window.WR_exam=async(el,{onDone}={})=>{
  el.innerHTML=`<div class="view"><p class="note">Đang chuẩn bị đề...</p></div>`;
  try{await WR_load();}catch(e){el.innerHTML=`<div class="view"><p class="empty">Chưa tải được đề Writing.</p></div>`;onDone&&onDone(null);return;}
  const st=WR_st();
  const choose=arr=>{const fresh=arr.filter(x=>!st.done[x.id]);return pick(fresh.length?fresh:arr);};
  const t1=choose(examType()==='general'?WR_D.t1g:WR_D.t1a), t2=choose(WR_D.t2), tasks=[t1,t2];
  const texts=['',''];let cur=0, timer=null, ended=false;
  const prevLeave=window.__leave; window.__leave=()=>{if(timer)timer.stop();prevLeave&&prevLeave();};
  el.innerHTML=`<div class="view wr-exam">
    <div class="spread wr-xh"><div><h2>Thi thử Writing</h2><p class="note">60 phút cho cả hai phần. Nên dành 20 phút cho Task 1 và 40 phút cho Task 2.</p></div>
      <span class="timer-chip" id="wxT">${ic('clock')} <span>60:00</span></span></div>
    <div class="row wr-steps" role="tablist">${tasks.map((x,i)=>`<button class="chip wr-sc" data-s="${i}" aria-pressed="${i===0}">Task ${i+1} <span class="small muted" id="wxC${i}">0/${WR_target(x)}</span></button>`).join('')}</div>
    ${tasks.map((x,i)=>`<div class="wr-task wr-xp" data-p="${i}" ${i?'hidden':''}>
      <section class="wr-pa panel"><div class="label">Task ${i+1}${x._k==='t1g'?' · thư '+esc((WR_TONE_VI[x.tone]||'').toLowerCase()):''}</div>${WR_promptHTML(x)}${x._k==='t1a'?WR_chartSVG(x.chart):''}</section>
      <section class="wr-wa panel"><div class="spread wr-bar"><span class="wr-wc" id="wxW${i}"><b>0</b> / ${WR_target(x)} từ</span></div>
        <textarea class="wr-tx en-s" id="wxX${i}" spellcheck="false" autocomplete="off" aria-label="Bài viết Task ${i+1}"></textarea>
        <div class="row">${i===0?`<button class="btn" data-go="1">Sang Task 2 ${ic('chevron-right')}</button>`:`<button class="btn" data-go="0">${ic('chevron-left')} Về Task 1</button>`}<button class="btn primary wx-sub">Nộp bài</button></div></section>
    </div>`).join('')}
    <div id="wxOut"></div></div>`;
  const show=i=>{cur=i;$$('.wr-xp',el).forEach(p=>p.hidden=+p.dataset.p!==i);$$('.wr-sc',el).forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.s===i)));window.scrollTo(0,0);};
  $$('.wr-sc',el).forEach(b=>b.onclick=()=>show(+b.dataset.s));
  $$('[data-go]',el).forEach(b=>b.onclick=()=>show(+b.dataset.go));
  tasks.forEach((x,i)=>{const tx=$('#wxX'+i,el);const key='x:'+x.id;tx.value=st.drafts[key]||'';
    const upd=()=>{texts[i]=tx.value;const n=countWords(tx.value),t=WR_target(x);const w=$('#wxW'+i,el);w.innerHTML=`<b>${n}</b> / ${t} từ`;w.classList.toggle('ok',n>=t);$('#wxC'+i,el).textContent=n+'/'+t;};
    upd(); tx.oninput=()=>{upd();st.drafts[key]=tx.value;clearTimeout(WR_saveT);WR_saveT=setTimeout(()=>{WR_saveT=null;touch('main');},1200);};});
  timer=makeTimer(3600,left=>{const c=$('#wxT',el);if(!c||!el.isConnected){timer&&timer.stop();return;}$('span',c).textContent=fmtTime(left);c.classList.toggle('low',left<=300);},()=>{toast('Hết 60 phút. Bài được nộp tự động.',3500);finish();});
  $$('.wx-sub',el).forEach(b=>b.onclick=()=>{const n2=countWords(texts[1]);
    if(!b.dataset.sure&&(countWords(texts[0])<WR_target(tasks[0])||n2<WR_target(tasks[1]))){b.dataset.sure='1';b.textContent='Chưa đủ số từ. Bấm lần nữa để nộp';return;}
    finish();});
  async function finish(){
    if(ended)return; ended=true; if(timer)timer.stop();
    if(WR_saveT){clearTimeout(WR_saveT);WR_saveT=null;}
    tasks.forEach((x,i)=>{delete st.drafts['x:'+x.id];if(countWords(texts[i])>=50)award('write',1);st.done[x.id]=st.done[x.id]||Date.now();});
    touch('main');
    $$('.wr-xp,.wr-steps,.wr-xh .timer-chip',el).forEach(n=>n.hidden=true);
    const out=$('#wxOut',el); window.scrollTo(0,0);
    const cont=band=>{const b=$('#wxDone',el);if(b)b.onclick=()=>{window.__leave=prevLeave||null;onDone&&onDone(band);};};
    const modelsOnly=(msg)=>{out.innerHTML=`<div class="panel">${mcSay('calm',msg,56)}</div>
      ${tasks.map((x,i)=>`<div class="grid2 wr-cmp"><div class="panel"><h3>Task ${i+1}: bài của bạn</h3><div class="en-s wr-essay">${esc(texts[i])||'<span class="muted">(bỏ trống)</span>'}</div></div><div class="panel"><h3>Task ${i+1}: bài mẫu</h3>${WR_models(x)}</div></div>`).join('')}
      <div class="row"><button class="btn primary" id="wxDone">Tiếp tục</button></div>`;cont(null);};
    if(!AI){modelsOnly('Đã nộp bài. AI chấm bài cần mật khẩu nhóm và máy chủ có cấu hình AI, nên lần này bạn hãy tự so sánh với bài mẫu.');return;}
    const grade=async()=>{
      out.innerHTML=`<div class="panel wr-load">${mascot('idea',84)}<div><b>Jack đang chấm bài, khoảng 20-40 giây</b><p class="note">Đang chấm cả hai phần, có thể lâu hơn một chút.</p><div class="wr-bar-ld"><i></i></div></div></div>`;
      try{
        const rs=[];
        for(let i=0;i<2;i++){
          if(countWords(texts[i])<20){rs.push({bands:{ta:countWords(texts[i])?2:0,cc:countWords(texts[i])?2:0,lr:countWords(texts[i])?2:0,gra:countWords(texts[i])?2:0},overall:countWords(texts[i])?2:0,summary:'Bài quá ngắn hoặc bỏ trống nên không thể chấm theo tiêu chí, chỉ tính điểm tối thiểu.',strengths:[],improve:['Luôn viết đủ số từ tối thiểu, dù chưa hoàn hảo.'],corrections:[],better:''});continue;}
          rs.push(await WR_grade(tasks[i],texts[i]));
        }
        if(!el.isConnected)return;
        rs.forEach((r,i)=>WR_saveHist(tasks[i],texts[i],r));
        const band=Math.round(((rs[0].overall+2*rs[1].overall)/3)*2)/2;
        recordScore({skill:'writing',band,title:'Thi thử Writing 60 phút',detail:{t1:rs[0].overall,t2:rs[1].overall}});
        out.innerHTML=`<div class="panel wr-xres"><div class="wr-ovr"><div class="wr-ovb"><span class="label">Band Writing</span><span class="band-big">${fmtBand(band)}</span></div><div class="wr-sum">${mascot(band>=7?'yay':band>=6?'ok':'hmm',64)}<p>Task 1 được ${fmtBand(rs[0].overall)}, Task 2 được ${fmtBand(rs[1].overall)}. Task 2 tính gấp đôi Task 1 khi ra band Writing.</p></div></div>
          <div class="row"><button class="btn primary" id="wxDone">Tiếp tục</button></div></div>
          ${subTabs('wxRt',[['0','Kết quả Task 1'],['1','Kết quả Task 2']],'0',k=>drawR(+k))}<div id="wxR"></div>`;
        const drawR=k=>{$$('#wxRt [data-t]',el).forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.t===k)));const box=$('#wxR',el);box.innerHTML=`<div class="view">${WR_resultHTML(tasks[k],texts[k],rs[k])}</div>`;WR_bindResult(box);};
        drawR(0); cont(band);
        if(band>=7&&typeof confetti==='function')confetti();
      }catch(e){ if(!el.isConnected)return;
        out.innerHTML=`<div class="panel">${mcSay('hmm',esc(aiError(e)),56)}<div class="row"><button class="btn primary" id="wxRetry">${ic('rotate-ccw')} Chấm lại</button><button class="btn" id="wxSkip">Xem bài mẫu và bỏ qua</button></div><p class="note">Bài viết của bạn vẫn được giữ trong trang này.</p></div>`;
        $('#wxRetry',out).onclick=grade; $('#wxSkip',out).onclick=()=>modelsOnly('Không chấm được bằng AI lần này. Hãy tự so sánh với bài mẫu.');
      }
    };
    grade();
  }
};

/* ================= SPEAKING: Part 1, Part 2 cue cards, Part 3, AI examiner chat, full speaking test (SP_exam) ================= */
let SP_noRec=false, SP_D=null, SP_tab='p1', SP_uid=0, SP_p2f='all';
const SP_live=new Set();          // cleanup functions for timers, recognition, recording
const SP_urls=[];                 // blob URLs of recordings (revoked on leave)
const SP_CRIT=[['fc','Trôi chảy và mạch lạc','Fluency and Coherence','Nói đều, ít ngập ngừng, các ý nối với nhau rõ ràng.'],
  ['lr','Từ vựng','Lexical Resource','Từ đa dạng, đúng ngữ cảnh, biết diễn đạt lại khi bí từ.'],
  ['gra','Ngữ pháp','Grammatical Range and Accuracy','Dùng cả câu đơn lẫn câu phức, ít lỗi.'],
  ['pr','Phát âm','Pronunciation','Dễ nghe, rõ âm cuối, đúng trọng âm, ngữ điệu tự nhiên.']];
const SP_TOP={person:'Người',place:'Nơi chốn',object:'Đồ vật',event:'Sự kiện',experience:'Trải nghiệm',activity:'Hoạt động',media:'Sách, phim, mạng'};
const SP_NOSR='Máy này chưa ghi âm được (cần mật khẩu nhóm và quyền micro), hãy gõ câu trả lời';
const SP_ms=()=>window.__spFast?50:1000;
const SP_c=s=>String(s==null?'':s).replace(/\s*[\u2014\u2013]\s*/g,', ').replace(/\u2192/g,'->').replace(/\u2190/g,'<-').replace(/\u2194/g,'<->');
const SP_hasSR=()=>canListen();
const SP_hi9=()=>{try{return (+plCfg().target||0)>=8.5;}catch(e){return false;}};
const SP_upB=()=>SP_hi9()?'band 9':'band 8';

function SP_every(fn){let id=setInterval(fn,SP_ms());const t={stop(){if(id)clearInterval(id);id=null;SP_live.delete(t.stop);}};SP_live.add(t.stop);return t;}
function SP_stopAll(){stopSay();[...SP_live].forEach(f=>{try{f();}catch(e){}});SP_live.clear();}
function SP_hook(){window.__leave=()=>{SP_stopAll();SP_urls.splice(0).forEach(u=>{try{URL.revokeObjectURL(u);}catch(e){}});};}
function SP_store(){P.sp=P.sp||{};P.sp.att=P.sp.att||[];return P.sp;}
const SP_band=x=>{const n=+x;if(isNaN(n))return null;return Math.round(Math.min(9,Math.max(0,n))*2)/2;};
const SP_cardText=c=>c.card+'\n'+c.bullets.join('\n')+'\n'+c.explain;
async function SP_data(){if(!SP_D)SP_D=await loadJSON('speaking');return SP_D;}

/* ---------- answer recorder ----------
   SP_rec(host,{q, voice, part, hint, speakQ, hideQ, autoStart, limit, warn, exam, record, id, title, aiQ, onDone(api), onReset}) */
function SP_rec(host,o){
  const st={phase:'idle',secs:0,text:'',url:null,lis:null,recP:null,tick:null,att:null,awarded:false,edited:false};
  const uid='spr'+(++SP_uid);
  host.innerHTML=`<div class="sp-rec" id="${uid}">${o.hideQ?'':`<div class="sp-q"><button class="spk" data-sq aria-label="Nghe lại câu hỏi">${SPK}</button><div class="en-s">${esc(o.q)}</div></div>`}<div class="sp-body"></div></div>`;
  const root=$('#'+uid,host), body=$('.sp-body',root);
  const sayQ=()=>say(o.q,{voice:o.voice||'f',lang:'en-GB'});
  const sq=$('[data-sq]',root); if(sq)sq.onclick=e=>{e.preventDefault();sayQ();};
  const cleanup=()=>{if(st.tick)st.tick.stop();if(st.lis){try{st.lis.stop();}catch(e){}st.lis=null;}
    if(st.recP){const p=st.recP;st.recP=null;p.then(r=>r&&r.stop()).then(u=>{if(u)try{URL.revokeObjectURL(u);}catch(e){}}).catch(()=>{});}};
  SP_live.add(cleanup);
  const words=()=>countWords(st.text);
  const save=()=>{
    if(!st.text.trim())return;
    const S=SP_store();
    if(!st.att){st.att={q:String(o.q).slice(0,400),part:o.part||'',id:o.id||'',t:st.text,d:Date.now(),s:st.secs,band:null};S.att.push(st.att);if(S.att.length>150)S.att.splice(0,S.att.length-150);}
    else st.att.t=st.text;
    if(!st.awarded&&words()>=5){st.awarded=true;award('speak',1);}
    touch('main');
  };
  const drawIdle=()=>{
    st.phase='idle';
    body.innerHTML=`${o.hint?`<p class="note">${o.hint}</p>`:''}
      <div class="row"><button class="btn primary" data-go>${ic('mic')} Trả lời</button>${o.exam?'':'<button class="btn ghost sm" data-type>Gõ câu trả lời</button>'}</div>
      ${SP_hasSR()?'':`<p class="note">${SP_NOSR}.</p>`}`;
    $('[data-go]',body).onclick=start;
    const ty=$('[data-type]',body); if(ty)ty.onclick=()=>{st.secs=0;st.text='';drawReview(true);};
  };
  const timerHTML=()=>o.limit?`${ic('timer')} <span data-tt>${fmtTime(st.secs)}</span> / ${fmtTime(o.limit)}`:`${ic('clock')} <span data-tt>${fmtTime(st.secs)}</span>`;
  const updTimer=()=>{const t=$('[data-tt]',body);if(t)t.textContent=fmtTime(st.secs);
    const ch=$('.timer-chip',body);if(ch&&o.limit)ch.classList.toggle('low',o.limit-st.secs<=15);
    const w=$('[data-warn]',body);if(w&&o.warn){w.textContent=st.secs<60?'Cố nói đủ 1-2 phút. Nếu bí ý, quay lại các gợi ý trên thẻ.':'Tốt rồi, bạn đã nói hơn 1 phút. Có thể nói tiếp đến 2 phút.';w.className='note sp-warn'+(st.secs<60?'':' ok');}};
  function start(){
    if(st.phase!=='idle')return;
    stopSay(); st.phase='live'; st.secs=0; st.text=''; st.edited=false;
    const L=st.lis=listen({lang:'en-GB',onText:(t,fin)=>{
      if(st.phase==='live'||st.phase==='stopping'){if(!fin||t.length>=st.text.length)st.text=t;const b=$('.sp-live',body);if(b)b.textContent=st.text||'...';}
      else if(st.phase==='review'&&fin&&!st.edited&&t.length>st.text.length){st.text=t;const ta=$('.sp-tr',body);if(ta)ta.value=t;stats();save();}
    }});
    body.innerHTML=`<div class="spread"><span class="sp-on"><i class="sp-dot"></i>${st.lis?'Đang nghe bạn nói':'Đang ghi'}</span><span class="timer-chip">${timerHTML()}</span></div>
      ${o.warn?'<p class="note sp-warn" data-warn></p>':''}
      ${st.lis?(st.lis.whisper?'<div class="sp-live note" aria-live="polite">Đang ghi âm. Nói xong bấm Xong, chữ sẽ hiện ra sau vài giây.</div>':'<div class="sp-live en-s" aria-live="polite">...</div>'):`<p class="note">${SP_NOSR}.</p><textarea class="sp-type en-s" rows="4" placeholder="Gõ lại những gì bạn vừa nói"></textarea>`}
      <div class="row"><button class="btn primary" data-stop>${ic('circle-stop')} Xong</button></div>`;
    $('[data-stop]',body).onclick=finish;
    const ty=$('.sp-type',body); if(ty)setTimeout(()=>ty.focus(),30);
    updTimer();
    st.recP=L&&L.whisper?Promise.resolve({stop:()=>L.url()}):SP_noRec?Promise.resolve(null):recorder().then(r=>{if(!r)SP_noRec=true;return r;}).catch(()=>{SP_noRec=true;return null;});
    st.tick=SP_every(()=>{st.secs++;updTimer();if(o.limit&&st.secs>=o.limit){toast('Hết 2 phút.');finish();}});
  }
  async function finish(){
    if(st.phase!=='live')return; st.phase='stopping';
    if(st.tick)st.tick.stop();
    const ty=$('.sp-type',body); if(ty)st.text=ty.value.trim();
    const b=$('[data-stop]',body); if(b){b.disabled=true;b.textContent='Đang lưu...';}
    if(st.lis){const L=st.lis;st.lis=null;let p=null;try{p=L.stop();}catch(e){}
      if(L.whisper&&p){if(b)b.textContent='Đang chuyển giọng thành chữ...';try{const t=await p;if(t)st.text=t;}catch(e){}}}
    const p=st.recP; st.recP=null;
    let r=null; try{r=p?await p:null;}catch(e){}
    try{st.url=r?await r.stop():null;}catch(e){st.url=null;}
    if(st.url)SP_urls.push(st.url);
    if(!document.body.contains(root))return;
    drawReview(false);
    o.onDone&&o.onDone(api);
  }
  function stats(){
    const el=$('[data-stats]',body); if(!el)return; const n=words();
    el.innerHTML=`<span><b class="num">${n}</b> từ</span>${st.secs?`<span><b class="num">${fmtTime(st.secs)}</b></span><span><b class="num">${n?Math.round(n/(st.secs/60)):0}</b> từ/phút</span>`:''}`;
  }
  function drawReview(typed){
    st.phase='review';
    body.innerHTML=`${st.url?`<div class="sp-play"><span class="label">Nghe lại giọng bạn</span><audio controls preload="metadata" src="${st.url}"></audio></div>`:''}
      <label class="label" for="${uid}t">${typed?'Gõ câu trả lời của bạn (tiếng Anh)':'Bản ghi chữ, sửa lại chỗ máy nghe sai'}</label>
      <textarea id="${uid}t" class="sp-tr en-s" rows="${Math.min(10,Math.max(3,Math.ceil(st.text.length/60)))}" placeholder="${typed?'Gõ những gì bạn sẽ nói':'Máy chưa nghe được chữ nào. Gõ lại câu trả lời ở đây.'}">${esc(st.text)}</textarea>
      <div class="sp-stats" data-stats></div>
      ${st.secs&&words()&&st.secs>=10?`<p class="note">${SP_paceNote(words(),st.secs)}</p>`:''}
      <div class="row">${o.exam?'':`<button class="btn sm need-ai" data-ai>${ic('sparkles')} Nhận xét bằng AI</button><button class="btn ghost sm" data-again>${ic('rotate-ccw')} Nói lại</button>`}</div>
      ${o.exam?'':'<p class="note no-ai">Bật trợ lý AI (mật khẩu nhóm) để được chấm band và sửa câu.</p>'}
      <div class="sp-ai"></div>`;
    stats(); refreshAIBits();
    const ta=$('.sp-tr',body);
    ta.oninput=()=>{st.edited=true;st.text=ta.value;stats();};
    ta.onchange=()=>{st.text=ta.value.trim();save();};
    if(typed){setTimeout(()=>ta.focus(),30);}
    save();
    const ai=$('[data-ai]',body); if(ai)ai.onclick=()=>{
      st.text=ta.value.trim(); save();
      if(countWords(st.text)<5){toast('Câu trả lời còn quá ngắn để nhận xét.');return;}
      SP_feedback($('.sp-ai',body),{part:o.part,qs:[o.aiQ||o.q],answers:[st.text],secs:st.secs,record:o.record,id:o.id,title:o.title,att:st.att});
    };
    const ag=$('[data-again]',body); if(ag)ag.onclick=()=>{st.att=null;st.awarded=false;st.text='';st.secs=0;st.url=null;o.onReset&&o.onReset();drawIdle();};
    if(typed&&o.onDone)ta.addEventListener('change',()=>{if(!api._typedDone&&st.text){api._typedDone=1;o.onDone(api);}});
  }
  const api={get text(){const ta=$('.sp-tr',body);return (ta?ta.value:st.text).trim();},get secs(){return st.secs;},get url(){return st.url;},get att(){return st.att;},
    get phase(){return st.phase;},q:o.q,start,stop:finish,stopNow(){if(st.phase==='live')return finish();return Promise.resolve();}};
  drawIdle();
  if(o.autoStart)setTimeout(start,0);
  else if(o.speakQ)sayQ();
  return api;
}
function SP_paceNote(n,secs){
  const w=n/(secs/60);
  if(w<70)return 'Tốc độ khá chậm. Thử nói liền mạch hơn, dùng cụm nối như "well", "the thing is" thay vì dừng lâu.';
  if(w>190)return 'Bạn nói khá nhanh. Chậm lại một chút để phát âm rõ âm cuối.';
  return 'Tốc độ ổn, khoảng tốc độ nói tự nhiên (100-170 từ mỗi phút).';
}

/* ---------- AI examiner feedback ---------- */
function SP_gradePrompt(desc,block){
  return `You are an experienced, fair IELTS Speaking examiner helping a Vietnamese learner. Assess the candidate using the official public band descriptors (Fluency and Coherence, Lexical Resource, Grammatical Range and Accuracy, Pronunciation), each 0-9 in half bands.

Task: ${desc}

IMPORTANT: the candidate's answers below are a speech-to-text transcript (or typed by the learner). Punctuation, capital letters and some words may be wrong because of the recogniser, so do not punish punctuation, and if a word looks like a recognition error, judge what they most likely said. Judge Pronunciation only cautiously from indirect clues (missing word endings like -s/-ed, words the recogniser clearly misheard), and say in the summary that pronunciation is estimated from the transcript. A very short answer limits Fluency and Coherence.
${SP_hi9()?`
The candidate is aiming for band 8.5-9, so be extra strict at the top of the scale and apply the band 8 vs band 9 distinctions precisely: band 9 needs speech that is fluent with only rare, content-related hesitation, fully coherent and appropriately extended topic development, precise and idiomatic vocabulary used naturally, and consistently accurate complex grammar apart from native-like slips. In "summary" and "improve", say explicitly (in Vietnamese) what is currently stopping each criterion from reaching 9.
`:''}
${block}

Return JSON exactly in this shape:
{"bands":{"fc":6,"lr":6,"gra":5.5,"pr":6},"overall":6,"summary":"2-3 sentences in Vietnamese","good":["1-3 strengths in Vietnamese"],"improve":["2-4 concrete tips in Vietnamese, each saying exactly what to do next time"],"fixes":[{"orig":"exact phrase the candidate said","fix":"better natural English","why":"short reason in Vietnamese"}],"upgrade":"a ${SP_upB()} version of the candidate's answer in natural spoken British English, keeping their ideas and roughly their length or a little longer"}
Give 2-5 fixes from the candidate's own words. Vietnamese text must be natural and plain. Do not use the em dash character anywhere.`;
}
function SP_block(qs,answers){return qs.map((q,i)=>`Examiner: ${q}\nCandidate (transcript): ${answers[i]||'(no answer)'}`).join('\n\n').slice(0,40000);}
function SP_feedback(box,{part,qs,answers,secs,record,id,title,att,desc,block,onBand}){
  const run=async()=>{
    box.innerHTML=`<div class="sp-wait">${mcSay('idea','Jack đang nghe lại câu trả lời...',56)}</div>`;
    const d=desc||`${part||'Speaking'} answer.${secs?` The candidate spoke for about ${Math.round(secs)} seconds.`:''}`;
    try{
      const j=await askJSON(SP_gradePrompt(d,block||SP_block(qs,answers)));
      if(!document.body.contains(box))return;
      const b=j&&j.bands||{}; const bands={fc:SP_band(b.fc),lr:SP_band(b.lr),gra:SP_band(b.gra),pr:SP_band(b.pr)};
      let ov=overallBand([bands.fc,bands.lr,bands.gra,bands.pr]); if(ov==null)ov=SP_band(j&&j.overall);
      if(ov==null)throw {code:'bad_json'};
      box.innerHTML=SP_fbHTML(j,bands,ov);
      if(att){att.band=ov;touch('main');}
      if(record)recordScore({skill:'speaking',band:ov,id:id||'',title:title||'Speaking'});
      onBand&&onBand(ov,j);
    }catch(e){
      if(!document.body.contains(box))return;
      box.innerHTML=`<div class="fb bad">${esc(aiError(e))}</div><div class="row"><button class="btn sm" data-retry>${ic('rotate-ccw')} Thử lại</button></div>`;
      $('[data-retry]',box).onclick=run;
    }
  };
  if(!AI){box.innerHTML=`<p class="note">${esc(aiError({code:'no_ai'}))}</p>`;return;}
  run();
}
function SP_fbHTML(j,bands,ov){
  const list=a=>(Array.isArray(a)?a:[]).filter(Boolean).map(x=>`<li>${esc(SP_c(x))}</li>`).join('');
  const fixes=(Array.isArray(j.fixes)?j.fixes:[]).filter(f=>f&&(f.orig||f.fix));
  const up=SP_c(j.upgrade||'');
  return `<div class="sp-fb">
    <div class="sp-ov"><div><span class="label">Band ước tính</span><b class="num">${fmtBand(ov)}</b></div><p class="note">Chấm từ bản ghi chữ nên chỉ để tham khảo, nhất là điểm Phát âm.</p></div>
    <div class="sp-bands">${SP_CRIT.map(([k,vi,en])=>`<div class="sp-band"><b class="num">${fmtBand(bands[k])}</b><span>${vi}</span><small>${en}</small></div>`).join('')}</div>
    ${j.summary?`<p class="sp-sum">${esc(SP_c(j.summary))}</p>`:''}
    ${list(j.good)?`<div><h3>Điểm tốt</h3><ul class="sp-ul ok">${list(j.good)}</ul></div>`:''}
    ${list(j.improve)?`<div><h3>Cần cải thiện</h3><ul class="sp-ul">${list(j.improve)}</ul></div>`:''}
    ${fixes.length?`<div><h3>Sửa câu</h3><div class="sp-fixes">${fixes.map(f=>`<div class="sp-fix"><div class="en-s"><s>${esc(SP_c(f.orig))}</s></div><div class="en-s sp-fixok">${ic('check')} ${esc(SP_c(f.fix))}</div>${f.why?`<div class="note">${esc(SP_c(f.why))}</div>`:''}</div>`).join('')}</div></div>`:''}
    ${up?`<div><h3>Câu trả lời nâng cấp (${SP_upB()})</h3><div class="ex sp-ex"><button class="spk" data-say="${esc(up)}" data-voice="f" aria-label="Nghe">${SPK}</button><div class="en-s">${esc(up)}</div></div></div>`:''}
  </div>`;
}

/* ---------- view ---------- */
VIEWS.speak=async el=>{
  SP_hook();
  el.innerHTML='<div class="view"><p class="note">Đang tải phòng luyện nói...</p></div>';
  try{await SP_data();}catch(e){el.innerHTML='<div class="view"><p class="note">Chưa tải được dữ liệu Speaking. Kiểm tra mạng rồi tải lại trang.</p></div>';return;}
  SP_home(el);
};

  const D=SP_D;
  el.innerHTML=`<div class="view sp">

    <div class="panel sp-intro">
      ${mcSay('hi','Bài thi Speaking dài 11-14 phút, nói trực tiếp với giám khảo. Ở đây bạn luyện từng phần, nghe lại giọng mình và xem câu mẫu.',60)}
      <div class="sp-parts">
        <div><b>Part 1</b><span>4-5 phút. Câu hỏi ngắn về bản thân, công việc, sở thích. Trả lời 2-3 câu mỗi câu hỏi.</span></div>
        <div><b>Part 2</b><span>3-4 phút. Nhận một cue card, có 1 phút chuẩn bị rồi nói liền 1-2 phút.</span></div>
        <div><b>Part 3</b><span>4-5 phút. Thảo luận sâu hơn quanh chủ đề Part 2: nêu quan điểm, giải thích, so sánh.</span></div>
      </div>
      <details class="sp-det"><summary>4 tiêu chí chấm điểm (mỗi tiêu chí 25%)</summary>
        <div class="sp-crit">${SP_CRIT.map(([k,vi,en,d])=>`<div><b>${vi}</b><small>${en}</small><span>${d}</span></div>`).join('')}</div></details>
      <p class="note">App ghi âm để bạn nghe lại và chuyển giọng nói thành chữ (tốt nhất trên Chrome hoặc Edge). Bản ghi âm không được lưu, chỉ lưu phần chữ.</p>
    </div>
    ${subTabs('spTabs',[['p1','Part 1'],['p2','Part 2 (cue card)'],['p3','Part 3'],['ai','Giám khảo AI']],SP_tab,t=>{SP_tab=t;SP_home(el);})}
    <div id="spTab"></div>
    ${SP_recentHTML()}

  const box=$('#spTab',el);
  if(SP_tab==='p1'){
    box.innerHTML=`<div class="panel"><h3>Chọn chủ đề Part 1</h3><p class="note">Mỗi chủ đề có 4-5 câu hỏi. Giám khảo đọc câu hỏi, bạn trả lời khoảng 20-30 giây.</p>
      <div class="sp-topics">${D.p1.map((t,i)=>`<button class="sp-topic" data-i="${i}"><b>${esc(t.topic)}</b><span class="note">${t.qs.length} câu${SP_doneP1(t)?' · đã luyện':''}</span></button>`).join('')}</div></div>`;
    $$('[data-i]',box).forEach(b=>b.onclick=()=>SP_p1(el,+b.dataset.i));
  }else if(SP_tab==='p2'||SP_tab==='p3'){
    const p2=SP_tab==='p2';
    const draw=()=>{
      const list=D.p2.map((c,i)=>[c,i]).filter(([c])=>SP_p2f==='all'||c.topic===SP_p2f);
      box.innerHTML=`<div class="panel"><div class="spread"><h3>${p2?'Chọn cue card':'Câu hỏi thảo luận Part 3 theo chủ đề'}</h3>${p2?`<button class="btn primary sm" data-rand>${ic('repeat')} Ngẫu nhiên</button>`:''}</div>
        <p class="note">${p2?'Thẻ giống hệt đề thi: 1 phút chuẩn bị, 2 phút nói. Sau đó xem từ vựng, bài mẫu band 8, band 9 và sang Part 3.':'Mỗi cue card có 5 câu hỏi Part 3. Trả lời từng câu, khoảng 40-60 giây, rồi xem câu mẫu.'}</p>
        <div class="row">${[['all','Tất cả'],...Object.entries(SP_TOP)].map(([k,t])=>`<button class="chip" data-f="${k}" aria-pressed="${SP_p2f===k}">${t}</button>`).join('')}</div>
        <div class="sp-cards">${list.map(([c,i])=>`<button class="sp-cl" data-c="${i}"><span class="pill">${SP_TOP[c.topic]||esc(c.topic)}</span><span class="en sp-clt">${esc(p2?c.card:c.card.replace(/^Describe /,'').replace(/\.$/,''))}</span>${p2?'':`<span class="note en">${esc(c.p3[0])}</span>`}${SP_doneId(c.id,p2?'Part 2':'Part 3')?`<span class="sp-tick" title="Đã luyện">${ic('check')}</span>`:''}</button>`).join('')}</div></div>`;
      $$('[data-f]',box).forEach(b=>b.onclick=()=>{SP_p2f=b.dataset.f;draw();});
      $$('[data-c]',box).forEach(b=>b.onclick=()=>p2?SP_p2(el,+b.dataset.c):SP_p3(el,+b.dataset.c));
      const r=$('[data-rand]',box); if(r)r.onclick=()=>SP_p2(el,D.p2.indexOf(pick(D.p2)));
    };
    draw();
  }else{
    box.innerHTML=`<div class="panel sp-mock">
        <h3>${ic('message-circle')} Phỏng vấn với giám khảo AI</h3>
        <p class="note">Giám khảo AI hỏi Part 1, đưa cue card cho Part 2 (có giờ chuẩn bị và giờ nói), rồi hỏi tiếp Part 3 dựa trên những gì bạn nói. Trong lúc thi giám khảo không sửa lỗi. Bấm "Kết thúc và chấm" để nhận band và nhận xét.</p>
        <div class="row need-ai"><button class="btn primary" data-chat>${ic('mic')} Bắt đầu phỏng vấn</button></div>
        <p class="note no-ai">Cần bật trợ lý AI (mật khẩu nhóm) để dùng giám khảo AI. Bạn vẫn có thể làm bài thi đủ 3 phần bên dưới.</p>
      </div>
      <div class="panel"><h3>${ic('clipboard-check')} Thi thử Speaking đủ 3 phần</h3>
        <p class="note">Khoảng 12 phút: Part 1 (4 câu), Part 2 (1 phút chuẩn bị, 2 phút nói), Part 3 (3-4 câu). Câu hỏi lấy từ ngân hàng đề, không cần AI. Có AI thì được chấm cả bài.</p>
        <div class="row"><button class="btn" data-exam>Bắt đầu thi thử</button></div></div>`;
    refreshAIBits();
    $('[data-chat]',box).onclick=()=>SP_chat(el);
    $('[data-exam]',box).onclick=()=>SP_exam(el,{onDone:()=>{},back:()=>SP_home(el)});
  }
}
function SP_doneP1(t){const a=(P.sp&&P.sp.att)||[];return a.some(x=>x.part==='Part 1'&&t.qs.includes(x.q));}

function SP_head(el,back,label,title,step){

/* Part 2 model talks: band 8 sample + band 9 sample9 with why9 */

/* ---------- Part 1 and Part 3 practice (one question at a time) ---------- */
function SP_series(el,{label,title,qs,samples,samples9,hint,part,id,back,voice,extra}){
  SP_stopAll(); SP_hook();
  let i=0; const ans=[];
  const draw=()=>{
    SP_stopAll();
    el.innerHTML=`<div class="view sp">${SP_head(el,back,label,title,`Câu ${i+1}/${qs.length}`)}${SP_dots(qs.length,i)}
      <div class="panel" id="spR"></div><div id="spAfter" class="sp-after"></div></div>`;
    $('[data-back]',el).onclick=()=>SP_home(el);
    SP_rec($('#spR',el),{q:qs[i],voice,part,id,hint,speakQ:true,
      onReset:()=>{$('#spAfter',el).innerHTML='';},
      onDone:r=>{
        ans[i]=r;
        const last=i===qs.length-1;
        $('#spAfter',el).innerHTML=`${SP_sampleHTML(qs[i],samples,'',samples9)}<div class="row"><button class="btn primary" data-next>${last?'Xem tổng kết':'Câu tiếp'} ${ic('chevron-right')}</button></div>`;
        $('[data-next]',el).onclick=()=>{ans[i]={q:qs[i],text:r.text,secs:r.secs};if(last)summary();else{i++;draw();}};
      }});
  };
  const summary=()=>{
    SP_stopAll();
    const done=ans.filter(a=>a&&a.text);
    el.innerHTML=`<div class="view sp">${SP_head(el,back,label,title,'Tổng kết')}
      <div class="panel">${mcSay(done.length===qs.length?'yay':'ok',done.length?`Xong ${done.length}/${qs.length} câu. Đọc lại câu trả lời của bạn và so với câu mẫu nhé.`:'Bạn chưa trả lời câu nào. Thử lại nhé.',56)}</div>
      <div class="panel"><h3>Câu trả lời của bạn</h3><div class="sp-sumlist">${qs.map((q,k)=>`<div class="sp-sq"><div class="en sp-sqq">${esc(q)}</div><div class="en-s">${ans[k]&&ans[k].text?esc(ans[k].text):'<span class="note">(chưa trả lời)</span>'}</div>${SP_sampleHTML(q,samples,'Câu mẫu',samples9).replace('panel sp-sample','sp-sample sm')}</div>`).join('')}</div>
        <div class="row">${done.length?`<button class="btn sm need-ai" data-ai>${ic('sparkles')} Nhận xét cả lượt bằng AI</button>`:''}<button class="btn sm" data-again>${ic('rotate-ccw')} Làm lại</button>${extra?extra.html:''}</div>
        <div class="sp-ai"></div></div></div>`;
    refreshAIBits();
    $('[data-back]',el).onclick=()=>SP_home(el);
    $('[data-again]',el).onclick=()=>{i=0;ans.length=0;draw();};
    const ai=$('[data-ai]',el); if(ai)ai.onclick=()=>{const d=qs.map((q,k)=>[q,ans[k]&&ans[k].text]).filter(x=>x[1]);
      SP_feedback($('.sp-ai',el),{part,qs:d.map(x=>x[0]),answers:d.map(x=>x[1]),desc:`IELTS Speaking ${part}, ${d.length} questions on "${title}". Judge the set of answers as a whole.`});};
    if(extra)extra.bind(el);
  };
  draw();
}

    hint:'Part 3 cần trả lời dài hơn, khoảng 40-60 giây: nêu quan điểm, giải thích lý do, thêm ví dụ hoặc so sánh.',

/* ---------- Part 2: cue card + 1 minute prep + 2 minutes talk ---------- */
function SP_cardHTML(c){
  return `<div class="sp-card en"><div class="sp-card-t">${esc(c.card)}</div><div class="sp-card-s">${esc(c.bullets[0])}</div>
    <ul>${c.bullets.slice(1).map(b=>`<li>${esc(b)}</li>`).join('')}</ul><div class="sp-card-t2">${esc(c.explain)}</div></div>`;
}
/* runs the cue card: ready -> prep (60s, notes) -> talk (120s) ; opts {voice, exam, onDone(rec)} */
function SP_p2run(host,c,o){
  const voice=o.voice||'f';
  host.innerHTML=`${SP_cardHTML(c)}<div class="sp-p2s"></div>`;
  const s=$('.sp-p2s',host);
  const intro="Now I'm going to give you a topic, and I'd like you to talk about it for one to two minutes. Before you talk, you'll have one minute to think about what you're going to say. You can make some notes if you wish.";
  s.innerHTML=`<p class="note">Giám khảo đưa thẻ và cho bạn 1 phút chuẩn bị. Bạn được ghi chú ngắn.</p>
    <div class="row"><button class="btn primary" data-prep>${ic('timer')} Bắt đầu 1 phút chuẩn bị</button><button class="btn ghost sm" data-now>Bắt đầu nói luôn</button></div>`;
  let notes='';
  const talk=()=>{
    SP_stopAll(); const ta=$('.sp-notes',s); if(ta)notes=ta.value;
    s.innerHTML=`${notes.trim()?`<div class="sp-notesv"><span class="label">Ghi chú của bạn</span><div>${esc(notes)}</div></div>`:''}<div class="sp-talk"></div>`;
    const go=()=>{if(!document.body.contains(s))return;SP_rec($('.sp-talk',s),{q:SP_cardText(c),aiQ:SP_cardText(c),hideQ:true,voice,part:'Part 2',id:c.id,title:'Speaking Part 2: '+c.card,record:!o.exam,exam:o.exam,
      autoStart:true,limit:120,warn:true,onDone:r=>o.onDone&&o.onDone(r),onReset:()=>o.onReset&&o.onReset()});};
    say("Alright. Remember, you have one to two minutes for this. Please start speaking now.",{voice,lang:'en-GB'}).then(go);
  };
  const prep=()=>{
    stopSay(); let left=60;
    s.innerHTML=`<div class="spread"><span class="label">Thời gian chuẩn bị</span><span class="timer-chip">${ic('timer')} <span data-pt>${fmtTime(left)}</span></span></div>
      <textarea class="sp-notes" rows="4" placeholder="Ghi chú ý chính: ai, ở đâu, khi nào, chuyện gì, cảm nghĩ... Chỉ vài từ khóa thôi."></textarea>
      <p class="note">Mẹo: mỗi gợi ý trên thẻ ghi 2-3 từ khóa, thêm một chi tiết cụ thể (tên, con số, cảm xúc) để nói đủ 2 phút.</p>
      <div class="row"><button class="btn primary" data-now>${ic('mic')} Bắt đầu nói luôn</button></div>`;
    $('[data-now]',s).onclick=talk;
    setTimeout(()=>{const t=$('.sp-notes',s);if(t)t.focus({preventScroll:true});},30);
    const t=SP_every(()=>{left--;const e=$('[data-pt]',s);if(e)e.textContent=fmtTime(left);const ch=$('.timer-chip',s);if(ch)ch.classList.toggle('low',left<=10);if(left<=0){t.stop();talk();}});
  };
  $('[data-prep]',s).onclick=()=>{prep();say(intro,{voice,lang:'en-GB'});};
  $('[data-now]',s).onclick=talk;
}
function SP_p2(el,ci){

      <div class="panel"><div class="spread"><h3>Bài mẫu band 8 và band 9</h3><button class="btn sm" data-show>Xem bài mẫu</button></div><div class="sp-hid" hidden>

/* ---------- AI examiner chat (mock interview) ---------- */
function SP_chat(el){
  SP_stopAll(); SP_hook();
  const D=SP_D, t1=pick(D.p1), card=pick(D.p2), voice=pick(['m','f']);
  const C={stage:'p1',n1:0,n3:0,msgs:[],log:[],busy:false,ended:false,lis:null,base:'',t0:0};
  const sys=`You are a friendly but strict IELTS Speaking examiner running a real practice test with a Vietnamese candidate. Speak British English. Rules: ask exactly one question per turn; keep each turn short (one or two sentences); never correct, teach or praise the candidate's English during the test; do not give feedback or scores; react naturally to what the candidate says when moving on; no lists, no markdown, no emoji, no em dash. Output only what the examiner says aloud.`;
  el.innerHTML=`<div class="view sp">
    <div class="spread"><button class="btn ghost sm" data-back>${ic('chevron-left')} Thoát</button><span class="pill ai" data-stage>Part 1</span></div>
    <div class="spread"><h2>Giám khảo AI</h2><button class="btn sm" data-end>${ic('award')} Kết thúc và chấm</button></div>
    <div class="sp-chat" aria-live="polite"></div>
    <div class="panel sp-comp"></div>
    <div class="sp-res"></div></div>`;
  const log=$('.sp-chat',el), comp=$('.sp-comp',el), res=$('.sp-res',el);
  $('[data-back]',el).onclick=()=>{SP_tab='ai';SP_home(el);};
  $('[data-end]',el).onclick=()=>grade();
  const stageName={p1:'Part 1',p2:'Part 2',p3:'Part 3',end:'Chấm điểm'};
  const setStage=s=>{C.stage=s;const p=$('[data-stage]',el);if(p)p.textContent=stageName[s]||s;};
  const scroll=()=>{const last=log.lastElementChild;if(last&&last.scrollIntoView)last.scrollIntoView({block:'nearest',behavior:'smooth'});};
  const addEx=(text,{speak=true,cardHTML=''}={})=>{
    text=SP_c(text).trim(); C.log.push({who:'ex',text});
    const d=document.createElement('div'); d.className='sp-msg ex';
    d.innerHTML=`<div class="sp-who">Giám khảo</div><div class="sp-bub"><div class="en-s">${esc(text)}</div><button class="spk sm" data-say="${esc(text)}" data-voice="${voice}" aria-label="Nghe lại">${SPK}</button></div>${cardHTML}`;
    log.appendChild(d); scroll();
    setTimeout(()=>{if(comp.scrollIntoView&&!C.ended)comp.scrollIntoView({block:'nearest',behavior:'smooth'});},60);
    return speak?say(text,{voice,lang:'en-GB'}):Promise.resolve();
  };
  const addMe=text=>{C.log.push({who:'me',text,stage:C.stage});const d=document.createElement('div');d.className='sp-msg me';d.innerHTML=`<div class="sp-who">Bạn</div><div class="sp-bub"><div class="en-s">${esc(text)}</div></div>`;log.appendChild(d);scroll();};
  const typing=on=>{let d=$('.sp-typing',log);if(on&&!d){d=document.createElement('div');d.className='sp-msg ex sp-typing';d.innerHTML='<div class="sp-bub"><span class="sp-dots"><i></i><i></i><i></i></span></div>';log.appendChild(d);scroll();}if(!on&&d)d.remove();};
  const fallbackQ=()=>C.stage==='p1'?(C.n1===0?`Let's talk about ${t1.topic.toLowerCase()}. ${t1.qs[0]}`:(t1.qs[C.n1]||pick(t1.qs))):(card.p3[C.n3]||pick(card.p3));
  async function exTurn(userContent){
    C.busy=true; drawComp(); typing(true);
    C.msgs.push({role:'user',content:userContent});
    let text='';
    try{const r=await ask(C.msgs);text=SP_c(r&&r.text||'').trim();}catch(e){text='';if(!C.warned){C.warned=1;toast(aiError(e)+' Jack dùng câu hỏi có sẵn.',4000);}}
    if(!document.body.contains(log))return;
    if(!text)text=fallbackQ();
    C.msgs.push({role:'assistant',content:text});
    typing(false); C.busy=false; drawComp();
    await addEx(text);
  }
  function stopMic(){const b=$('[data-mic]',comp);if(C.lis){const L=C.lis;C.lis=null;let p=null;try{p=L.stop();}catch(e){}
      if(L.whisper&&p){if(b){b.disabled=true;b.innerHTML='Đang chuyển thành chữ...';}return p.then(()=>{if(b){b.disabled=false;b.setAttribute('aria-pressed','false');b.innerHTML=`${ic('mic')} Nói`;}});}}
    if(b){b.setAttribute('aria-pressed','false');b.innerHTML=`${ic('mic')} Nói`;}return Promise.resolve();}
  SP_live.add(stopMic);
  function micOn(ta){
    if(C.lis){stopMic();return;}
    stopSay(); C.base=ta.value.trim()?ta.value.trim()+' ':'';
    C.lis=listen({lang:'en-GB',onText:tx=>{ta.value=C.base+tx;}});
    if(!C.lis){toast(SP_NOSR+'.',4000);ta.focus();return;}
    const b=$('[data-mic]',comp); if(b){b.setAttribute('aria-pressed','true');b.innerHTML=`<i class="sp-dot"></i> Đang nghe, bấm để dừng`;}
  }
  function drawComp(){
    if(C.ended){comp.hidden=true;return;}
    comp.hidden=false;
    if(C.stage==='p2'){return;} // Part 2 composer is drawn by p2 flow
    comp.innerHTML=`<textarea class="sp-in en-s" rows="3" placeholder="${C.busy?'Giám khảo đang nói...':'Bấm Nói để trả lời bằng giọng, hoặc gõ câu trả lời'}" ${C.busy?'disabled':''}></textarea>
      <div class="spread"><div class="row"><button class="btn sm" data-mic aria-pressed="false" ${C.busy?'disabled':''}>${ic('mic')} Nói</button>${SP_hasSR()?'':`<span class="note">${SP_NOSR}.</span>`}</div>
      <button class="btn primary" data-send ${C.busy?'disabled':''}>Gửi ${ic('chevron-right')}</button></div>`;
    const ta=$('.sp-in',comp);
    $('[data-mic]',comp).onclick=()=>micOn(ta);
    $('[data-send]',comp).onclick=async()=>{await stopMic();send(ta.value);};
    ta.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send(ta.value);}};
  }
  async function send(v){
    v=String(v||'').trim(); if(!v||C.busy||C.ended)return;
    stopMic(); stopSay(); addMe(v); if(countWords(v)>=5)award('speak',1);
    if(C.stage==='p1'){
      C.n1++;
      if(C.n1<4)await exTurn(`Candidate: ${v}\n\n[Examiner note: ask the next Part 1 question about "${t1.topic}" (or a natural follow-up to the answer). Suggested questions: ${t1.qs.join(' | ')}]`);
      else startP2(v);
    }else if(C.stage==='p3'){
      C.n3++;
      if(C.n3<4)await exTurn(`Candidate: ${v}\n\n[Examiner note: Part 3. Ask the next discussion question linked to the cue card topic, reacting to what the candidate just said. You may use or adapt: ${card.p3.join(' | ')}]`);
      else{C.msgs.push({role:'user',content:'Candidate: '+v});await addEx('Thank you. That is the end of the speaking test.');grade();}
    }
  }
  function startP2(lastAns){
    setStage('p2');
    const line="Thank you. Now I'm going to give you a topic, and I'd like you to talk about it for one to two minutes. Before you talk, you'll have one minute to think about what you're going to say. You can make some notes if you wish. Here is your topic.";
    C.msgs.push({role:'user',content:'Candidate: '+lastAns});
    C.msgs.push({role:'assistant',content:line+' Cue card: '+SP_cardText(card).replace(/\n/g,' ')});
    addEx(line,{cardHTML:SP_cardHTML(card)});
    comp.innerHTML='';
    let left=60;
    comp.innerHTML=`<div class="spread"><span class="label">1 phút chuẩn bị</span><span class="timer-chip">${ic('timer')} <span data-pt>${fmtTime(left)}</span></span></div>
      <textarea class="sp-notes" rows="3" placeholder="Ghi chú vài từ khóa"></textarea>
      <div class="row"><button class="btn primary" data-now>${ic('mic')} Bắt đầu nói luôn</button></div>`;
    const tk=SP_every(()=>{left--;const e=$('[data-pt]',comp);if(e)e.textContent=fmtTime(left);if(left<=0){tk.stop();talk();}});
    $('[data-now]',comp).onclick=()=>{tk.stop();talk();};
    function talk(){
      const notes=($('.sp-notes',comp)||{}).value||'';
      tk.stop();
      comp.innerHTML=`${notes.trim()?`<div class="sp-notesv"><span class="label">Ghi chú</span><div>${esc(notes)}</div></div>`:''}<div class="sp-talk"></div>`;
      const go=()=>{if(!document.body.contains(comp))return;
        const r=SP_rec($('.sp-talk',comp),{q:SP_cardText(card),hideQ:true,voice,part:'Part 2',id:card.id,exam:true,autoStart:true,limit:120,warn:true,
          onDone:rr=>{const box=$('.sp-talk',comp);const row=document.createElement('div');row.className='row';row.innerHTML=`<button class="btn primary" data-p2send>Gửi phần nói ${ic('chevron-right')}</button>`;box.appendChild(row);
            $('[data-p2send]',comp).onclick=()=>{const v=rr.text;if(!v){toast('Chưa có nội dung. Gõ lại phần bạn đã nói.');return;}endP2(v);};}});
        C.p2rec=r;};
      addEx('Alright. Remember, you have one to two minutes for this. Please start speaking now.').then(go);
    }
  }
  async function endP2(v){
    addMe(v); setStage('p3');
    await exTurn(`Candidate (Part 2 long turn): ${v}\n\n[Examiner note: Part 2 is over. Say a very short thank you, then begin Part 3: "We've been talking about ${card.card.replace(/^Describe /,'').replace(/\.$/,'')}. I'd like to discuss some more general questions related to this." Then ask one discussion question that reacts to what the candidate said. You may use or adapt: ${card.p3.join(' | ')}]`);
  }
  function grade(){
    const answers=C.log.filter(x=>x.who==='me');
    if(!answers.length){toast('Bạn chưa trả lời câu nào.');return;}
    SP_stopAll(); C.ended=true; setStage('end'); drawComp();
    const b=$('[data-end]',el); if(b)b.hidden=true;
    const block=C.log.map(x=>(x.who==='ex'?'Examiner: ':'Candidate (transcript): ')+x.text).join('\n\n').slice(-38000);
    res.innerHTML=`<div class="panel"><h3>Kết quả buổi phỏng vấn</h3><div class="sp-ai"></div><div class="row"><button class="btn" data-new>${ic('repeat')} Phỏng vấn lại</button></div></div>`;
    $('[data-new]',res).onclick=()=>SP_chat(el);
    SP_feedback($('.sp-ai',res),{record:true,id:'mock-ai',title:'Speaking: phỏng vấn giám khảo AI',block,
      desc:`A full IELTS Speaking mock interview (Part 1 on "${t1.topic}", Part 2 cue card "${card.card}", Part 3 discussion). The test may have been ended early; assess what is there. For "upgrade", rewrite the candidate's Part 2 long turn (or their longest answer) at ${SP_upB()}.`});
    res.scrollIntoView&&res.scrollIntoView({block:'start',behavior:'smooth'});
  }
  drawComp();
  exTurn(sys+`\n\nThe test starts now. Part 1 topic: "${t1.topic}". Suggested questions: ${t1.qs.join(' | ')}\nBegin with a one-line greeting, say you will ask some questions about ${t1.topic.toLowerCase()}, then ask the first question.`);
}

/* ---------- full speaking test without AI questions: window.SP_exam(el,{onDone}) ---------- */
async function SP_exam(el,{onDone,back}={}){
  SP_stopAll(); SP_hook();
  el.innerHTML='<div class="view"><p class="note">Đang chuẩn bị đề...</p></div>';
  let D; try{D=await SP_data();}catch(e){el.innerHTML='<div class="view"><p class="note">Chưa tải được đề Speaking. Kiểm tra mạng rồi thử lại.</p></div>';onDone&&onDone(null);return;}
  const t1=pick(D.p1), card=pick(D.p2), voice=pick(['m','f']);
  const q1=t1.qs.slice(0,4), q3=shuffle(card.p3).slice(0,Math.random()<0.5?3:4);
  const steps=[...q1.map((q,k)=>({part:'Part 1',q,k,n:q1.length})),{part:'Part 2'},...q3.map((q,k)=>({part:'Part 3',q,k,n:q3.length}))];
  const out=[]; let i=0, finished=false;
  const fin=b=>{if(finished)return;finished=true;onDone&&onDone(b);};
  const shell=(inner,label)=>`<div class="view sp sp-exam"><div class="spread"><h2>Thi thử Speaking</h2><span class="pill ai">${label||''}</span></div>${SP_dots(steps.length,i)}${inner}</div>`;
  el.innerHTML=shell(`<div class="panel">${mcSay('calm','Bài thi gồm 3 phần, khoảng 12 phút. Giám khảo đọc từng câu hỏi, bạn bấm "Trả lời" rồi nói, xong bấm "Xong". Part 2 có 1 phút chuẩn bị và tối đa 2 phút nói. Trong bài thi không có câu mẫu hay nhận xét, kết quả xem ở cuối.',60)}
    <ul class="sp-ul"><li>Part 1: ${q1.length} câu về chủ đề quen thuộc</li><li>Part 2: một cue card</li><li>Part 3: ${q3.length} câu thảo luận</li></ul>
    <div class="row"><button class="btn primary" data-start>${ic('play')} Bắt đầu</button>${back?'<button class="btn ghost" data-back>Quay lại</button>':''}</div></div>`,'Sẵn sàng');
  $('[data-start]',el).onclick=()=>step();
  const bk=$('[data-back]',el); if(bk)bk.onclick=back;
  function step(){
    SP_stopAll();
    const s=steps[i];
    if(!s)return results();
    if(s.part==='Part 2'){
      el.innerHTML=shell(`<div class="panel" id="spRun"></div><div class="row" id="spNx"></div>`,'Part 2');
      SP_p2run($('#spRun',el),card,{voice,exam:true,onDone:r=>{
        $('#spNx',el).innerHTML=`<button class="btn primary" data-next>Sang Part 3 ${ic('chevron-right')}</button>`;
        $('[data-next]',el).onclick=()=>{out.push({part:'Part 2',q:SP_cardText(card),text:r.text,secs:r.secs});i++;step();};
      }});
      return;
    }
    el.innerHTML=shell(`<div class="spread"><h3>${s.part}</h3><span class="note num">Câu ${s.k+1}/${s.n}</span></div><div class="panel" id="spR"></div><div class="row" id="spNx"></div>`,s.part);
    const pre=s.k===0?(s.part==='Part 1'?`In this first part, I'd like to ask you some questions about ${t1.topic.toLowerCase()}. `:`We've been talking about ${card.card.replace(/^Describe /,'').replace(/\.$/,'')}. I'd like to discuss with you some more general questions related to this. `):'';
    const r=SP_rec($('#spR',el),{q:s.q,voice,part:s.part,exam:true,hint:s.part==='Part 1'?'Trả lời 2-3 câu, khoảng 20-30 giây.':'Trả lời khoảng 40-60 giây: quan điểm, lý do, ví dụ.',
      onDone:rr=>{
        const last=i===steps.length-1;
        $('#spNx',el).innerHTML=`<button class="btn primary" data-next>${last?'Nộp bài':'Câu tiếp'} ${ic('chevron-right')}</button>`;
        $('[data-next]',el).onclick=()=>{out.push({part:s.part,q:s.q,text:rr.text,secs:rr.secs});i++;step();};
      }});
    say(pre+s.q,{voice,lang:'en-GB'});
    void r;
  }
  function results(){
    SP_stopAll(); i=steps.length;
    const answered=out.filter(x=>x.text);
    const samples=`<div class="panel"><h3>Câu mẫu để so sánh</h3>
      ${q1.map(q=>SP_sampleHTML(q,t1.samples,'Part 1: '+esc(q),t1.samples9)).join('')}
      <div class="panel sp-sample"><h3>Part 2: bài mẫu</h3>${SP_p2models(card,voice)}</div>
      ${q3.map(q=>SP_sampleHTML(q,card.p3samples,'Part 3: '+esc(q),card.p3samples9)).join('')}</div>`;
    const yours=`<details class="sp-det panel"><summary>Xem lại câu trả lời của bạn (${answered.length}/${out.length})</summary><div class="sp-sumlist">${out.map(x=>`<div class="sp-sq"><span class="pill">${x.part}</span><div class="en sp-sqq">${esc(x.q.split('\n')[0])}</div><div class="en-s">${x.text?esc(x.text):'<span class="note">(chưa trả lời)</span>'}</div></div>`).join('')}</div></details>`;
    el.innerHTML=shell(`<div class="panel"><h3>Kết quả</h3><div class="sp-ai"></div></div>${yours}${samples}
      <div class="row"><button class="btn" data-again>${ic('repeat')} Thi đề khác</button></div>`,'Kết quả');
    $('[data-again]',el).onclick=()=>SP_exam(el,{onDone,back});
    const box=$('.sp-ai',el);
    if(!answered.length){box.innerHTML=mcSay('hmm','Bạn chưa trả lời câu nào nên chưa chấm được. Xem câu mẫu bên dưới rồi thử lại nhé.',56);fin(null);return;}
    if(!AI){box.innerHTML=mcSay('ok','Bạn đã làm xong bài thi. Chưa bật trợ lý AI nên chưa chấm band được. Nghe lại câu mẫu và so với câu trả lời của bạn nhé.',56);fin(null);return;}
    const block=out.map(x=>`[${x.part}]${x.secs?` (${Math.round(x.secs)}s)`:''}\nExaminer: ${x.q.replace(/\n/g,' ')}\nCandidate (transcript): ${x.text||'(no answer)'}`).join('\n\n');
    SP_feedback(box,{record:true,id:'exam-'+card.id,title:'Thi thử Speaking: '+t1.topic+' + '+card.card,block,
      desc:`A full IELTS Speaking test: Part 1 (${q1.length} questions on "${t1.topic}"), Part 2 long turn (cue card "${card.card}", 1 minute preparation, up to 2 minutes), Part 3 (${q3.length} discussion questions). Give one set of band scores for the whole test. For "upgrade", rewrite the candidate's Part 2 long turn at ${SP_upB()}.`,
      onBand:b=>{confetti&&b>=6.5&&confetti();fin(b);}});
    // if grading fails, the retry button stays; let the caller continue anyway
    const skip=document.createElement('div');skip.className='row';skip.innerHTML='<button class="btn ghost sm" data-skip>Bỏ qua chấm điểm</button>';
    box.parentNode.appendChild(skip); $('[data-skip]',skip).onclick=()=>{skip.remove();fin(null);};
    const obs=setInterval(()=>{if(finished||!document.body.contains(skip)){clearInterval(obs);skip.remove();}},500);
  }
}
window.SP_exam=(el,opts)=>SP_exam(el,opts||{});

/* ================= PHÒNG AI (lab): debate, paraphrase, real-text vocabulary ================= */
const LB_TYPE_VI={opinion:'Nêu quan điểm',discussion:'Thảo luận hai quan điểm',advantages:'Ưu và nhược điểm','problem-solution':'Vấn đề và giải pháp','two-part':'Câu hỏi hai phần'};
const LB_TOPIC_VI={education:'giáo dục',environment:'môi trường',technology:'công nghệ',health:'sức khỏe',work:'công việc',crime:'tội phạm',government:'chính phủ',media:'truyền thông',culture:'văn hóa',globalisation:'toàn cầu hóa',transport:'giao thông',family:'gia đình',tourism:'du lịch',city:'đô thị',science:'khoa học',language:'ngôn ngữ',sport:'thể thao',food:'ẩm thực'};
const LB_TABS=[['debate','Tranh luận'],['para','Paraphrase'],['real','Từ đời thật']];
const LB_POS=['phr','n','v','adj','adv','idiom'];
let LB_tab=null, LB_el=null;
const LB_mic={lis:null};

function LB_st(){P.lb=P.lb||{};const s=P.lb;s.debates=Array.isArray(s.debates)?s.debates:[];s.imports=Array.isArray(s.imports)?s.imports:[];
  s.para=Object.assign({sets:0,written:0,good:0,rsets:0,rq:0,rok:0,streak:0,best:0},s.para||{});return s;}
const LB_tgt=()=>{try{const t=+plCfg().target;return isFinite(t)&&t>0?t:7;}catch(e){return 7;}};
const LB_hi=()=>LB_tgt()>=8.5;
const LB_c=s=>String(s??'').replace(/\s*\u2014\s*/g,', ').replace(/\u2013/g,'-').replace(/[\u2192\u21d2\u27f6]/g,'->').replace(/[\u2190\u21d0]/g,'<-').replace(/\u2194/g,'<->').trim();
const LB_s=(v,max)=>{const s=typeof v==='string'?v:(v==null?'':typeof v==='number'?String(v):'');return LB_c(s).slice(0,max||2000);};
const LB_a=v=>Array.isArray(v)?v:[];
const LB_band=v=>{v=parseFloat(v);if(!isFinite(v))return null;return Math.min(9,Math.max(0,Math.round(v*2)/2));};
const LB_ten=v=>{v=parseFloat(v);if(!isFinite(v))return null;return Math.min(10,Math.max(0,Math.round(v)));};
const LB_date=t=>{const d=new Date(t);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();};
const LB_body=()=>LB_el&&document.body.contains(LB_el)?$('#lbBody',LB_el):null;
const LB_calib=()=>{const t=LB_tgt();return `The learner's target is IELTS band ${t}. Be demanding at that level: ${t>=8.5?'band 9 needs fully natural, precise, flexible language with only rare slips; anything vague, generic, slightly unnatural or imprecise must be flagged, and do not give 8 or 9 unless it is genuinely earned':'judge against the band descriptors for band '+t+' and do not inflate scores'}.`;};
const LB_rules='Write every explanation in Vietnamese (natural, plain, addressing the learner as "bạn") and every English example in British English. Never use the em dash character.';

function LB_loading(title,sub){return `<div class="panel lb-load">${mascot('idea',72)}<div class="lb-ldt"><b>${title}</b>${sub?`<p class="note">${sub}</p>`:''}<div class="lb-ld"><i></i></div></div></div>`;}
function LB_errHTML(e){return `<div class="panel lb-err">${mcSay('hmm',esc(aiError(e)),56)}<div class="row"><button class="btn primary" data-retry>${ic('rotate-ccw')} Thử lại</button></div></div>`;}
function LB_bindRetry(host,fn){const b=host&&$('[data-retry]',host);if(b)b.onclick=fn;}

/* text box with mic: o = {ph, rows, send, extra, value, onInput, onSend, busy} */
function LB_composer(host,o){
  host.innerHTML=`<textarea class="lb-in en-s" rows="${o.rows||3}" placeholder="${esc(o.ph||'')}" ${o.busy?'disabled':''}>${esc(o.value||'')}</textarea>
    <div class="lb-cbar"><div class="row"><button type="button" class="btn sm" data-mic aria-pressed="false" ${o.busy?'disabled':''}>${ic('mic')} Nói</button>${canListen()?'':'<span class="note lb-nosr">Trình duyệt này không nhận giọng nói, hãy dùng Chrome hoặc Edge, hoặc gõ câu trả lời.</span>'}</div>
    <div class="row">${o.extra||''}<button type="button" class="btn primary" data-send ${o.busy?'disabled':''}>${o.send||'Gửi'}</button></div></div>`;
  const ta=$('textarea',host), mb=$('[data-mic]',host);
  const micOff=()=>{const L=LB_mic.lis;LB_mic.lis=null;let p=null;if(L){try{p=L.stop();}catch(e){}}
    if(L&&L.whisper&&p){mb.disabled=true;mb.innerHTML='Đang chuyển thành chữ...';return p.then(()=>{mb.disabled=false;mb.setAttribute('aria-pressed','false');mb.innerHTML=`${ic('mic')} Nói`;});}
    mb.setAttribute('aria-pressed','false');mb.innerHTML=`${ic('mic')} Nói`;return Promise.resolve();};
  mb.onclick=()=>{
    if(LB_mic.lis){micOff();return;}
    stopSay(); const base=ta.value.trim()?ta.value.trim()+' ':'';
    LB_mic.lis=listen({lang:'en-GB',onText:t=>{ta.value=base+t;o.onInput&&o.onInput(ta.value);}});
    if(!LB_mic.lis){toast('Máy này chưa ghi âm được, hãy gõ câu trả lời.',4000);ta.focus();return;}
    mb.setAttribute('aria-pressed','true');mb.innerHTML='<i class="lb-dot"></i> Đang nghe, bấm để dừng';
  };
  ta.oninput=()=>o.onInput&&o.onInput(ta.value);
  const send=async()=>{await micOff();const v=ta.value.trim();if(!v){toast('Bạn chưa nói hoặc gõ gì.');return;}o.onSend(v);};
  $('[data-send]',host).onclick=send;
  ta.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send();}};
  return ta;
}

/* ================= 1. TRANH LUẬN ================= */
let LB_D={phase:'setup',rounds:4};

async function LB_t2(){if(LB_W2)return LB_W2;try{const d=await loadJSON('writing');LB_W2=LB_a(d&&d.t2).filter(x=>x&&x.prompt);}catch(e){LB_W2=[];}return LB_W2;}
const LB_motion=p=>String(p||'').split('\n').map(s=>s.trim()).filter(s=>s&&!/^(give reasons|write at least)/i.test(s)).join(' ');

async function LB_debDraw(){

        <label class="label" for="lbOwn">Hoặc tự gõ chủ đề (tiếng Anh)</label>
        <textarea id="lbOwn" class="en-s" rows="2" placeholder="Ví dụ: Remote work does more harm than good to young professionals."></textarea>

      ${hist.length?`<div class="panel"><h3>Các trận gần đây</h3><div class="lb-hist">${hist.map((h,i)=>`<button class="lb-hi" data-hi="${hist.length-1-i}"><span class="en lb-pt">${esc(h.motion)}</span><span class="note num">${LB_date(h.t)}${h.overall!=null?' | Band '+fmtBand(h.overall):''}</span></button>`).join('')}</div></div>`:''}`;

    const start=(motion,x)=>{LB_D={phase:'pos',rounds:D.rounds,motion,type:x&&x.type||'',topic:x&&x.topic||'',draft:'',id:Date.now()};LB_debDraw();window.scrollTo(0,0);};
    $$('[data-pi]',body).forEach(b=>b.onclick=()=>{const x=list[+b.dataset.pi];start(LB_motion(x.prompt),x);});

    $('#lbOwnGo',body).onclick=()=>{const v=$('#lbOwn',body).value.trim();if(countWords(v)<4){toast('Gõ chủ đề dài hơn một chút, ít nhất 4 từ.');return;}start(v.slice(0,400),null);};
    $$('[data-hi]',body).forEach(b=>b.onclick=()=>LB_debOld(LB_st().debates[+b.dataset.hi]));
    return;
  }
  const head=`<div class="panel lb-motion"><div class="spread"><span class="label">Đề tranh luận</span><div class="row">${D.type?`<span class="pill">${esc(LB_TYPE_VI[D.type]||D.type)}</span>`:''}<button class="btn ghost sm" id="lbBack">${ic('chevron-left')} Đổi đề</button></div></div>
    <div class="lb-mrow"><button class="spk" data-say="${esc(D.motion)}" data-voice="m" aria-label="Nghe đề">${SPK}</button><p class="en-s">${esc(D.motion)}</p></div></div>`;
  if(D.phase==='pos'){
    body.innerHTML=`${head}<div class="panel"><h3>Lập trường của bạn</h3><p class="note">Nói hoặc gõ ngắn gọn 1-3 câu: bạn đồng ý hay không, và lý do chính. Jack sẽ đứng ở phía ngược lại.</p><div id="lbComp"></div></div>`;
    LB_composer($('#lbComp',body),{ph:'I firmly believe that...',rows:3,send:'Bắt đầu tranh luận',value:D.draft,onInput:v=>D.draft=v,onSend:v=>LB_debStart(v)});
    LB_debBack(body); return;
  }
  /* run / done */
  const answered=D.turns.filter(t=>t.who==='me'&&!t.pos).length, round=Math.min(D.rounds,D.turns.filter(t=>t.who==='ai').length);

function LB_debSys(D){

function LB_debPrompt(D){

${LB_calib()}

"""
${tr.slice(0,20000)}
"""

/* ================= PRONUNCIATION (Phát âm): IPA chart, minimal pairs, rules, speaking practice ================= */
const PR_S={tab:'ipa',mp:null,spSrc:'',spIdx:0};
const PR_TYPES=[['vowel','Nguyên âm đơn'],['diphthong','Nguyên âm đôi'],['consonant','Phụ âm']];
function prData(){P.pr=P.pr||{};P.pr.seen=P.pr.seen||{};P.pr.best=P.pr.best||{};return P.pr;}
const prSay=(w,o)=>say(w,Object.assign({lang:'en-GB'},o||{}));
const prSlash=s=>/^\//.test(s)?s:'/'+s+'/';
// say several words in a row; stops if anything else starts speaking meanwhile
async function prSayList(words){for(const w of words){const p=prSay(w);const t=sayToken;await p;if(sayToken!==t)return;await new Promise(r=>setTimeout(r,180));if(sayToken!==t)return;}}

    ${PR_TYPES.map(([t,label])=>{const xs=D.sounds.filter(x=>x.type===t);return `<section class="pr-sec"><h3>${label} <span class="note num">${xs.length}</span></h3>

}
function prSound(x,D){
  const d=prData();
  if(!d.seen[x.ipa]){d.seen[x.ipa]=Date.now();touch('main');award('pron',1);const s=$('#prSeen');if(s)s.textContent=Object.keys(d.seen).length+'/'+D.sounds.length+' âm đã xem';}

function prTabSync(){$$('#prTabs [data-t]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===PR_S.tab));}

/* ---------- minimal pairs ---------- */
function prMP(box,D){
  const set=PR_S.mp&&D.minimal.find(m=>m.id===PR_S.mp);
  if(!set){
    const best=prData().best;
    box.innerHTML=`<p class="note">Chọn một cặp âm. App đọc một từ, bạn bấm từ mình nghe được. 10 lượt mỗi ván.</p>
      <div class="pr-sets">${D.minimal.map(m=>`<button class="pr-set" data-mp="${esc(m.id)}"><b>${esc(m.contrast)}</b><span class="small muted">${esc(m.pairs.slice(0,2).map(p=>p.join(' / ')).join(', '))}</span>${best[m.id]!=null?`<span class="pill">${best[m.id]}/10</span>`:''}</button>`).join('')}</div>`;
    $$('[data-mp]',box).forEach(b=>b.onclick=()=>{PR_S.mp=b.dataset.mp;prMP(box,D);});
    return;
  }
  const N=10; let round=0,score=0,cur=null,locked=false;
  const order=[];while(order.length<N)order.push(...shuffle(set.pairs));
  const draw=()=>{
    if(round>=N){
      const d=prData();const old=d.best[set.id];if(old==null||score>old){d.best[set.id]=score;touch('main');}
      if(typeof gmSfx==='function')gmSfx('end');
      box.innerHTML=`<div class="panel pr-end">${mcSay(score>=8?'yay':score>=5?'ok':'hmm',`<b>Đúng ${score}/${N}</b><br>${score>=8?'Tai bạn phân biệt tốt cặp này.':score>=5?'Khá rồi, chơi thêm một ván cho chắc.':'Cặp này khó. Bấm "Nghe cả hai" nhiều lần để quen.'}`,72)}
        <div class="small muted">Kỷ lục cặp này: ${d.best[set.id]}/${N}</div>
        <div class="row"><button class="btn primary" id="prAgain">${ic('rotate-ccw')} Chơi lại</button><button class="btn" id="prSets">Chọn cặp khác</button></div></div>`;
      $('#prAgain').onclick=()=>prMP(box,D);$('#prSets').onclick=()=>{PR_S.mp=null;prMP(box,D);};
      return;
    }
    const pair=order[round], k=Math.random()<.5?0:1; cur={pair,k}; locked=false;
    box.innerHTML=`<div class="panel pr-game">
      <div class="spread"><button class="btn ghost sm" id="prSets">${ic('chevron-left')} Các cặp</button><b class="pr-con">${esc(set.contrast)}</b><span class="num note">${round+1}/${N} · đúng ${score}</span></div>
      <div class="bar-track"><i style="width:${round/N*100}%"></i></div>
      <div class="pr-play"><button class="gm-play" id="prRep" aria-label="Nghe lại">${SPK}</button><span class="note">Bạn nghe thấy từ nào?</span></div>
      <div class="pr-choice">${pair.map((w,i)=>`<button class="opt pr-ch" data-i="${i}">${esc(w)}</button>`).join('')}</div>
      <div id="prFb" class="pr-fb"></div>
      <div class="row pr-ctl"><button class="btn sm" id="prBoth">${ic('repeat')} Nghe cả hai</button></div></div>`;
    $('#prSets').onclick=()=>{PR_S.mp=null;prMP(box,D);};
    $('#prRep').onclick=()=>prSay(pair[k]);
    $('#prBoth').onclick=()=>prSayList(pair);
    $$('.pr-ch',box).forEach(b=>b.onclick=()=>{
      if(locked)return;locked=true;const i=+b.dataset.i, ok=i===k;
      $$('.pr-ch',box).forEach((y,j)=>{y.disabled=true;if(j===k)y.classList.add('right');else if(j===i)y.classList.add('wrong');});
      if(ok){score++;award('pron',1);}
      $('#prFb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Đúng rồi.':'Chưa đúng.'}</b> Từ được đọc là <b>${esc(pair[k])}</b>.</div><button class="btn primary" id="prNext">${round+1<N?'Lượt tiếp':'Xem kết quả'} ${ic('chevron-right')}</button>`;
      $('#prNext').onclick=()=>{round++;draw();};$('#prNext').focus();
    });
    setTimeout(()=>{if(cur&&cur.pair===pair)prSay(pair[k]);},250);
  };
  draw();
}

/* ---------- speaking practice ---------- */
function prSpeak(box,D){
  const srcs=[...D.sounds.map(s=>['s:'+s.ipa,'Âm '+prSlash(s.ipa)+' ('+s.ex[0]+')',s.ex.concat(...(s.pairs||[]))]),...D.minimal.map(m=>['m:'+m.id,'Cặp '+m.contrast,[].concat(...m.pairs)])];
  if(!srcs.find(s=>s[0]===PR_S.spSrc))PR_S.spSrc=srcs[0][0];
  const src=srcs.find(s=>s[0]===PR_S.spSrc), words=[...new Set(src[2].map(w=>String(w).trim()).filter(Boolean))];
  if(PR_S.spIdx>=words.length)PR_S.spIdx=0;

const TS_SK=[['listening','Listening','headphones','khoảng 30 phút, 40 câu'],['reading','Reading','book-open','60 phút, 40 câu'],['writing','Writing','pen-line','60 phút, Task 1 và Task 2'],['speaking','Speaking','mic','11 đến 14 phút, 3 phần']];

/* test lists from data: {lsN, lsX, rdN, rdX} (normal and expert test numbers) */
async function TS_lists(type){
  const [L,R]=await Promise.all([loadJSON('listening'),loadJSON('reading')]);
  const lt=[...new Set(L.map(p=>p.test))].sort((a,b)=>a-b);
  const rt=[...new Set(R.filter(p=>p.type===type).map(p=>p.test))].sort((a,b)=>a-b);
  return {lsN:lt.filter(t=>!LS_isX(t)),lsX:lt.filter(LS_isX),rdN:rt.filter(t=>!RD_isXT(R,type,t)),rdX:rt.filter(t=>RD_isXT(R,type,t))};
}
/* a mock = {ls, rd, x, label}: normal mock N uses Reading N when it is a normal test, else cycles; expert mock i pairs expert tests */
function TS_mockOf(T,key){
  const x=String(key)[0]==='x', i=parseInt(String(key).replace('x',''),10)||1;
  const ls=x?T.lsX:T.lsN, rd=x?T.rdX:T.rdN;
  const l=ls.includes(i)&&!x?i:ls[(i-1)%Math.max(1,ls.length)];
  const r=!x&&rd.includes(i)?i:rd.length?rd[(i-1)%rd.length]:null;
  return {key:String(key),ls:l,rd:r,x,label:x?(ls.length>1?'đề chuyên gia '+i:'đề chuyên gia'):'đề '+i};
}

function gmData(){P.gm=P.gm||{};P.gm.best=P.gm.best||{};return P.gm;}
function gmSave(){touch('main');}
let GM_AC=null;
function gmSfx(kind){
  if(gmData().mute)return;
  try{
    if(!GM_AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;GM_AC=new C();}
    const ac=GM_AC; if(ac.state==='suspended')ac.resume();
    const t0=ac.currentTime+0.01;
    const tone=(f,start,dur,{type='sine',vol=0.18,slide=0}={})=>{
      const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t0+start);
      if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t0+start+dur);
      g.gain.setValueAtTime(0.0001,t0+start);g.gain.exponentialRampToValueAtTime(vol,t0+start+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t0+start+dur);
      o.connect(g);g.connect(ac.destination);o.start(t0+start);o.stop(t0+start+dur+0.02);
    };
    if(kind==='ok'){tone(880,0,0.16,{vol:0.14});tone(1318.5,0.08,0.26,{vol:0.12});}
    else if(kind==='bad'){tone(196,0,0.18,{type:'triangle',vol:0.2,slide:0.8});}
    else if(kind==='end'){tone(523.25,0,0.16,{type:'triangle',vol:0.16});tone(659.25,0.13,0.16,{type:'triangle',vol:0.16});tone(783.99,0.26,0.42,{type:'triangle',vol:0.18});tone(1567.98,0.26,0.42,{vol:0.05});}
  }catch(e){}
}

function gmClear(){GM_TIMERS.forEach(t=>{try{t.stop?t.stop():clearInterval(t);}catch(e){}});GM_TIMERS=[];stopSay();}
// short Vietnamese meaning for options: first sense, part-of-speech tag removed
function gmVi(w){let s=String(w.vi||'').split(';')[0].replace(/^\s*\([a-z., ]+\)\s*/i,'').trim();if(s.length>42){const c=s.split(',')[0].trim();s=c.length>=4?c:s.slice(0,40)+'...';}return s;}
function gmStem(word){const w=word.toLowerCase().split(' ')[0];return w.length<=4?w:w.replace(/(e|y)$/,'').slice(0,Math.max(3,w.length-2));}
function gmBlank(w){
  if(!w.ex)return null; const one=!/\s/.test(w.w.trim());
  const re=one?new RegExp('\\b'+gmStem(w.w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[a-z]*\\b','i'):new RegExp(w.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
  const m=w.ex.match(re); if(!m)return null;
  return {pre:w.ex.slice(0,m.index),hit:m[0],post:w.ex.slice(m.index+m[0].length)};
}
async function gmPool(){
  await loadAllVocab();
  const seenWords=Object.keys(P.srs||{}).map(k=>VI.get(k)).filter(w=>w&&w.vi&&!PHR_LV(w.lv));
  if(seenWords.length>=20){GM_S.src='seen';return seenWords;}
  GM_S.src='lv';const lv=P.settings.lv&&P.settings.lv.length?P.settings.lv:[1];
  const words=V.filter(w=>lv.includes(w.lv)&&w.vi&&!PHR_LV(w.lv));return words.length>=20?words:V.filter(w=>w.lv===1&&w.vi);
}
function gmDistract(w,pool,n,key){
  const val=key||(x=>gmVi(x)), mine=val(w), same=pool.filter(x=>x!==w&&x.pos===w.pos&&val(x)!==mine);
  const out=[];const used=new Set([mine]);
  for(const x of shuffle(same.length>=n*3?same:pool)){if(x===w)continue;const v=val(x);if(used.has(v))continue;used.add(v);out.push(x);if(out.length>=n)break;}
  return out;
}

function gmFloat(host,txt,ok){

/* ---------- 1. Tốc độ 60 giây ---------- */
function gmSpeed(el,pool){
  const body=gmStage(el,'speed',`<span class="timer-chip" id="gmT">${ic('timer')}<span>60</span></span><span class="gm-pts num" id="gmP">0</span>`);
  let pts=0,combo=0,maxCombo=0,right=0,wrong=0,cur=null,busy=false,over=false;const missed=[];
  const deck=shuffle(pool);let di=0;
  const mult=()=>combo>=8?4:combo>=5?3:combo>=2?2:1;
  const next=()=>{
    if(over)return;
    const w=deck[di++%deck.length]; const opts=shuffle([w,...gmDistract(w,pool,3)]); cur={w,opts};busy=false;
    body.innerHTML=`<div class="gm-tbar" id="gmBar"><i style="width:${(timer?timer.left():60)/60*100}%"></i></div>
      <div class="gm-sp" id="gmSp"><div class="gm-combo">${combo>=2?`<span class="gm-cb${combo>=5?' hot':''}">${combo} câu liên tiếp, x${mult()}</span>`:''}</div>
        <div class="gm-word en" style="--n:${Math.min(6,Math.ceil(w.w.length/3))}">${esc(w.w)}</div>${w.ipa?`<span class="ipa">${esc(w.ipa)}</span>`:''}</div>
      <div class="gm-opts">${opts.map((o,i)=>`<button class="gm-opt" data-i="${i}"><span class="gm-k">${i+1}</span><span>${esc(gmVi(o))}</span></button>`).join('')}</div>`;
    $$('.gm-opt',body).forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  };
  const choose=i=>{
    if(busy||over||!cur)return;busy=true;const o=cur.opts[i], ok=o===cur.w, btns=$$('.gm-opt',body);
    btns.forEach((b,j)=>{if(cur.opts[j]===cur.w)b.classList.add('right');else if(j===i)b.classList.add('wrong');});
    if(ok){combo++;maxCombo=Math.max(maxCombo,combo);right++;const g=10*mult();pts+=g;gmSfx('ok');gmRight();gmFloat($('#gmSp'),'+'+g,true);}
    else{combo=0;wrong++;missed.push(cur.w);gmSfx('bad');gmWrong(cur.w);gmFloat($('#gmSp'),cur.w.w+': '+gmVi(cur.w),false);}
    $('#gmP').textContent=pts;
    GM_TIMERS.push(setTimeout(next,ok?260:900));
  };
  const keys=e=>{if(current!=='games'||!$('#gmP'))return document.removeEventListener('keydown',keys);if(['1','2','3','4'].includes(e.key))choose(+e.key-1);};
  document.addEventListener('keydown',keys);
  let timer=null;
  timer=makeTimer(60,left=>{const t=$('#gmT');if(t){t.lastElementChild.textContent=left;t.classList.toggle('low',left<=10);}const b=$('#gmBar');if(b){b.classList.toggle('low',left<=10);b.firstElementChild.style.width=left/60*100+'%';}},()=>{
    over=true;document.removeEventListener('keydown',keys);
    const g=gmData(), old=g.best.speed||0, isBest=pts>old; if(isBest){g.best.speed=pts;gmSave();}
    gmEnd(el,'speed',{score:right,total:right+wrong,line:pts+' điểm',isBest,missed,
      best:`<div><b class="num">${right}</b><span class="small muted">câu đúng</span></div><div><b class="num">${maxCombo}</b><span class="small muted">chuỗi dài nhất</span></div><div><b class="num">${Math.max(old,pts)}</b><span class="small muted">kỷ lục</span></div>`});
  });
  GM_TIMERS.push(timer);
  next();
}

/* ---------- 2. Nghe và gõ ---------- */
function gmDict(el,pool){
  const N=10; const list=shuffle(pool.filter(w=>/^[a-z][a-z'-]*$/i.test(w.w))).slice(0,N);
  const body=gmStage(el,'dict',`<span class="num note" id="gmR"></span><span class="gm-pts num" id="gmP">0</span>`);
  let i=0,score=0;const missed=[];
  const draw=()=>{
    if(i>=N){const g=gmData(),old=g.best.dict,isBest=score>0&&(old==null||score>old);if(isBest||old==null){g.best.dict=score;gmSave();}
      return gmEnd(el,'dict',{score,total:N,line:score+'/'+N,isBest,missed,best:`<div><b class="num">${Math.max(old||0,score)}/10</b><span class="small muted">kỷ lục</span></div>`});}
    const w=list[i]; let hint=0, done=false;
    $('#gmR').textContent=(i+1)+'/'+N;
    body.innerHTML=`<div class="bar-track"><i style="width:${i/N*100}%"></i></div>
      <div class="gm-tq"><button class="gm-play" id="gmPlay" aria-label="Nghe lại">${SPK}</button><span class="note">Bấm để nghe lại. Nghe chậm: <button class="lnk" id="gmSlow">${ic('snail')} chậm</button></span></div>
      <div class="gm-hint" id="gmHint"></div>
      <form class="gm-type" id="gmF"><input type="text" id="gmI" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Gõ từ bạn nghe được" aria-label="Gõ từ"><button class="btn primary">Kiểm tra</button></form>
      <div class="row"><button class="btn sm" id="gmHintB">${ic('lightbulb')} Gợi ý</button><button class="btn ghost sm" id="gmSkip">Bỏ qua</button></div>
      <div id="gmFb"></div>`;
    const play=r=>say(w.w,{rate:r});
    $('#gmPlay').onclick=()=>play();$('#gmSlow').onclick=()=>play(0.6);
    $('#gmHintB').onclick=()=>{hint++;$('#gmHint').innerHTML=`${w.ipa?`<span class="ipa">${esc(w.ipa)}</span>`:''}<span>Bắt đầu bằng <b class="en">${esc(w.w[0])}</b>, ${w.w.length} chữ cái</span>${hint>1?`<span class="small muted">${esc(gmVi(w))}</span>`:''}`;};
    const finish=ok=>{
      if(done)return;done=true;$('#gmI').disabled=true;$$('#gmF button,#gmHintB,#gmSkip',body).forEach(b=>b.disabled=true);
      if(ok){score++;gmSfx('ok');gmRight();$('#gmP').textContent=score;}else{missed.push(w);gmSfx('bad');gmWrong(w);}
      $('#gmFb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Đúng chính tả.':'Chưa đúng.'}</b> <span class="en"><b>${esc(w.w)}</b></span> ${w.ipa?`<span class="ipa">${esc(w.ipa)}</span>`:''} ${esc(gmVi(w))}</div><button class="btn primary" id="gmN" style="margin-top:10px">${i+1<N?'Từ tiếp':'Xem kết quả'} ${ic('chevron-right')}</button>`;
      $('#gmN').onclick=()=>{i++;draw();};$('#gmN').focus();
    };
    $('#gmF').onsubmit=e=>{e.preventDefault();const v=$('#gmI').value.trim();if(!v)return;finish(enFold(v)===enFold(w.w));};
    $('#gmSkip').onclick=()=>finish(false);
    setTimeout(()=>{if($('#gmI'))$('#gmI').focus();},50);
    GM_TIMERS.push(setTimeout(()=>{if($('#gmPlay'))play();},250));
  };
  draw();
}

/* ---------- 3. Điền từ vào câu ---------- */
function gmCloze(el,pool){
  const N=10; const ok=pool.filter(w=>gmBlank(w)); const list=shuffle(ok.length>=N?ok:pool.filter(w=>w.ex)).slice(0,N);
  const body=gmStage(el,'cloze',`<span class="num note" id="gmR"></span><span class="gm-pts num" id="gmP">0</span>`);
  let i=0,score=0;const missed=[];
  const draw=()=>{
    if(i>=N||!list[i]){const g=gmData(),old=g.best.cloze,isBest=score>0&&(old==null||score>old);if(isBest||old==null){g.best.cloze=score;gmSave();}
      return gmEnd(el,'cloze',{score,total:N,line:score+'/'+N,isBest,missed,best:`<div><b class="num">${Math.max(old||0,score)}/10</b><span class="small muted">kỷ lục</span></div>`});}
    const w=list[i], b=gmBlank(w)||{pre:w.ex+' ',hit:w.w,post:''};
    const opts=shuffle([w,...gmDistract(w,pool,3,x=>x.k)]);
    $('#gmR').textContent=(i+1)+'/'+N;
    body.innerHTML=`<div class="bar-track"><i style="width:${i/N*100}%"></i></div>
      <div class="gm-cz"><div class="gm-czvi"><span class="label">Nghĩa</span> ${esc(gmVi(w))}</div>
      <div class="en-s gm-czs">${esc(b.pre)}<span class="gm-gap" id="gmGap">______</span>${esc(b.post)}</div>
      <div class="small muted">${esc(w.exvi||'')}</div></div>
      <div class="gm-opts">${opts.map((o,k)=>`<button class="gm-opt" data-i="${k}"><span class="gm-k">${k+1}</span><span class="en">${esc(o.w)}</span></button>`).join('')}</div>
      <p class="note">Từ trong câu có thể đã được chia (thêm -s, -ed, -ing).</p><div id="gmFb"></div>`;
    let done=false;
    $$('.gm-opt',body).forEach(btn=>btn.onclick=()=>{
      if(done)return;done=true;const k=+btn.dataset.i, good=opts[k]===w;
      $$('.gm-opt',body).forEach((x,j)=>{x.disabled=true;if(opts[j]===w)x.classList.add('right');else if(j===k)x.classList.add('wrong');});
      $('#gmGap').textContent=b.hit;$('#gmGap').classList.add(good?'ok':'bad');
      if(good){score++;gmSfx('ok');gmRight();$('#gmP').textContent=score;}else{missed.push(w);gmSfx('bad');gmWrong(w);}
      $('#gmFb').innerHTML=`<div class="row"><button class="spk" data-say="${esc(w.ex)}" aria-label="Nghe câu">${SPK}</button><button class="btn primary" id="gmN">${i+1<N?'Câu tiếp':'Xem kết quả'} ${ic('chevron-right')}</button></div>`;
      $('#gmN').onclick=()=>{i++;draw();};
    });
  };
  draw();
}

/* ---------- 4. Ghép cặp ---------- */
function gmMatch(el,pool){
  const words=[];const used=new Set();
  for(const w of shuffle(pool)){const v=gmVi(w);if(used.has(v)||used.has(w.k))continue;used.add(v);used.add(w.k);words.push(w);if(words.length>=6)break;}
  const body=gmStage(el,'match',`<span class="timer-chip" id="gmT">${ic('clock')}<span>00:00</span></span><span class="gm-pts num" id="gmP">0/6</span>`);
  const L=shuffle(words), R=shuffle(words);
  body.innerHTML=`<p class="note">Bấm một từ bên trái rồi bấm nghĩa đúng bên phải.</p>
    <div class="gm-mt2"><div class="gm-col">${L.map(w=>`<button class="gm-mc2 en" data-k="${esc(w.k)}" data-s="l">${esc(w.w)}</button>`).join('')}</div>
    <div class="gm-col">${R.map(w=>`<button class="gm-mc2" data-k="${esc(w.k)}" data-s="r">${esc(gmVi(w))}</button>`).join('')}</div></div>`;
  let sel=null,got=0,errs=0,sec=0;const missed=[];const wrongOnce=new Set();
  const iv=setInterval(()=>{sec++;const t=$('#gmT');if(t)t.lastElementChild.textContent=fmtTime(sec);},1000);GM_TIMERS.push(iv);
  $$('.gm-mc2',body).forEach(b=>b.onclick=()=>{
    if(b.classList.contains('ok'))return;
    if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');if(b.dataset.s==='l')say(VI.get(b.dataset.k).w);return;}
    const a=sel,c=b;sel=null;a.classList.remove('sel');
    if(a.dataset.k===c.dataset.k){
      [a,c].forEach(x=>{x.classList.add('ok');x.disabled=true;});got++;gmSfx('ok');gmRight();$('#gmP').textContent=got+'/6';
      if(got>=words.length){clearInterval(iv);
        const g=gmData(),old=g.best.match,isBest=old==null||sec<old;if(isBest){g.best.match=sec;gmSave();}
        GM_TIMERS.push(setTimeout(()=>gmEnd(el,'match',{score:got,total:words.length,line:fmtTime(sec),isBest,missed,
          best:`<div><b class="num">${errs}</b><span class="small muted">lần ghép sai</span></div><div><b class="num">${fmtTime(isBest?sec:old)}</b><span class="small muted">kỷ lục</span></div>`}),500));}
    }else{
      errs++;gmSfx('bad');const lw=VI.get((a.dataset.s==='l'?a:c).dataset.k);
      if(lw&&!wrongOnce.has(lw.k)){wrongOnce.add(lw.k);missed.push(lw);gmWrong(lw);}
      [a,c].forEach(x=>{x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),450);});
    }
  });
}

/* ---------- feedback: sounds, pop/shake, XP fly, celebrations ---------- */
function uiSfx(k){try{if(typeof gmSfx==='function')gmSfx(k);}catch(e){}}
function uiOptFx(e){
  const o=e.target.closest&&e.target.closest('.opt');if(!o)return;
  setTimeout(()=>{
    let el=document.contains(o)?o:null;
    if(!el){const all=$$('.opt.right,.opt.wrong');if(!all.length)return;el=all.find(x=>x.classList.contains('wrong'))||all[0];}
    if(el.dataset.fx)return;
    if(el.classList.contains('wrong')){el.dataset.fx=1;uiSfx('bad');if(!uiReduced())el.classList.add('is-bad');}
    else if(el.classList.contains('right')){el.dataset.fx=1;uiSfx('ok');if(!uiReduced())el.classList.add('is-ok');}

}
window.__xpFly=n=>{
  setTimeout(uiChips,0); if(!n)return;
  const chip=[$('#xpChip')].find(x=>x&&x.offsetParent); if(!chip)return;
  const to=chip.getBoundingClientRect(), from=UI_PT||{x:innerWidth/2,y:innerHeight/2};
  const f=document.createElement('div');f.className='xpfly';f.textContent='+'+n+' XP';document.body.appendChild(f);
  f.style.left=from.x+'px';f.style.top=from.y+'px';
  if(uiReduced()||!f.animate){setTimeout(()=>f.remove(),900);return;}
  const dx=to.left+to.width/2-from.x, dy=to.top+to.height/2-from.y;
  f.animate([{transform:'translate(-50%,-50%) scale(.8)',opacity:0},{transform:'translate(-50%,-120%) scale(1.05)',opacity:1,offset:.25},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.6)`,opacity:.2}],{duration:750,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>{f.remove();};
};
function confetti({count=100,duration=1500}={}){
  if(uiReduced())return;
  const cv=document.createElement('canvas'),dpr=devicePixelRatio||1;cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:90;width:100%;height:100%';
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;document.body.appendChild(cv);const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const cols=['#22346E','#E8821E','#F5B82E','#2C5FC4','#FFC857','#C8372F'];
  const ps=Array.from({length:count},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*13,vy:-Math.random()*13-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:4+Math.random()*4,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){const k=(t-t0)/duration;ctx.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.globalAlpha=Math.max(0,1-k);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(k<1)requestAnimationFrame(f);else cv.remove();})(t0);
}

}
