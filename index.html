<script>
/* Catalis - Stalis's IELTS. App core: helpers, data, progress, sync, speech, routing, vocabulary (SRS + dictionary).
   Feature modules (src/features/*.js) are pasted inside this closure right before the boot section by build.py. */
(function(){
'use strict';

/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.random()*a.length|0];
const DAY=86400000;
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime();};
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const viFold=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const enFold=s=>String(s).toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
const SPK='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
const ic=(n,cls)=>`<svg class="i${cls?' '+cls:''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
function toast(msg,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms);}
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const fmtTime=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const countWords=t=>(String(t).trim().match(/[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g)||[]).length;

/* ================= data ================= */
const LVS=[1,2,3,4,5,6,7,8]; const PHR_LV=L=>L>=6;
const LV_NAME={0:'Từ của bạn',1:'Nền tảng',2:'Trung cấp',3:'Học thuật',4:'Band 7+',5:'Chuyên gia',6:'Collocation',7:'Idiom',8:'Phrasal verb'};
const LV_BAND={1:'band 4.5-5.5',2:'band 5.5-6.5',3:'band 6.5-7.5',4:'band 7-8, theo chủ đề',5:'band 8.5-9, từ học thuật C2 và cách nói tự nhiên',6:'cụm từ hay đi cùng nhau, B2-C2, theo 13 chủ đề',7:'thành ngữ cho Speaking, B2-C2',8:'cụm động từ B2-C2'};
const V=[]; const VI=new Map(); const LV_COUNT=[0,0,0,0,0,0,0,0,0]; const loadedLv=new Set(); const lvLoading={};
async function loadLevel(L){
  if(loadedLv.has(L))return;
  if(!lvLoading[L])lvLoading[L]=(async()=>{
    const rows=await (await fetch('data/vocab-'+L+'.json')).json();
    rows.forEach((x,i)=>{const w={w:x[0],ipa:x[1],pos:x[2],vi:x[3],ex:x[4],exvi:x[5],col:x[6]||[],fam:x[7]||'',em:x[8]||'',topic:x[9]||'',lv:L,i,k:x[0].toLowerCase()};V.push(w);VI.set(w.k,w);});
    LV_COUNT[L]=rows.length; loadedLv.add(L);
  })();
  return lvLoading[L];
}
async function loadAllVocab(){await Promise.all(LVS.map(loadLevel));}
const JCACHE={};
function loadJSON(name){if(!JCACHE[name])JCACHE[name]=fetch('data/'+name+'.json').then(r=>{if(!r.ok)throw new Error(name);return r.json();}).catch(e=>{delete JCACHE[name];throw e;});return JCACHE[name];}

/* ================= band conversion ================= */
// raw score out of 40 -> band (commonly used tables, approximate)
const BAND_L=[[39,9],[37,8.5],[35,8],[32,7.5],[30,7],[26,6.5],[23,6],[18,5.5],[16,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5],[2,2],[1,1],[0,0]];
const BAND_RA=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5],[2,2],[1,1],[0,0]];
const BAND_RG=[[40,9],[39,8.5],[37,8],[36,7.5],[34,7],[32,6.5],[30,6],[27,5.5],[23,5],[19,4.5],[15,4],[12,3.5],[9,3],[6,2.5],[3,2],[1,1],[0,0]];
function bandOf(skill,raw,total,exam){
  total=total||40; const r=Math.round(raw/total*40);
  const t=skill==='listening'?BAND_L:(exam||examType())==='general'?BAND_RG:BAND_RA;
  for(const [min,b] of t)if(r>=min)return b; return 0;
}
// overall = mean of the skill bands; .25 rounds up to .5 and .75 rounds up to the next whole band
function overallBand(bs){const v=bs.filter(x=>x!=null&&!isNaN(x));if(!v.length)return null;const a=v.reduce((s,x)=>s+x,0)/v.length;const f=Math.floor(a),r=a-f;return r<0.25?f:r<0.75?f+0.5:f+1;}
const fmtBand=b=>b==null?'-':(+b).toFixed(1);

/* ================= progress state ================= */
const DEFAULT={v:1,upd:0,settings:{lv:[1],newPerDay:10,mode:'en',voiceRate:0.95,accent:'en-GB',voiceF:'',voiceM:'',ipa:true,theme:''},srs:{},hist:{},day:{},scores:[],custom:[]};
const slugOf=n=>viFold(n).trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30);
let WHO=store.get('catalis-who',null);
const PKEY=()=>WHO?'catalis-p:'+WHO.slug:'catalis-p';
let P=Object.assign(structuredClone(DEFAULT),store.get(PKEY(),{}));
P.settings=Object.assign({},DEFAULT.settings,P.settings||{});
let dirty=new Set();
function touch(part){P.upd=Date.now();dirty.add(part||'main');store.set(PKEY(),P);scheduleSync();}
function examType(){return (P.plan&&P.plan.exam)||'academic';}

/* SRS (SM-2 style), cards keyed by lowercase word */
function schedule(k,r){ // r: 0 again,1 hard,2 good,3 easy
  const now=Date.now(); let c=P.srs[k]||{iv:0,ef:2.5,n:0,l:0,due:now,s:0};
  if(r===0){c.l++;c.n=0;c.iv=0;c.ef=Math.max(1.3,c.ef-0.2);c.due=now+60*1000;c.s=1;}
  else{
    if(r===1){c.iv=c.iv<1?1:Math.max(1,Math.round(c.iv*1.2));c.ef=Math.max(1.3,c.ef-0.15);}
    else if(r===2){c.iv=c.n===0?1:c.n===1?3:Math.round(c.iv*c.ef);}
    else{c.iv=c.n===0?4:Math.round(Math.max(c.iv,1)*c.ef*1.3);c.ef+=0.15;}
    c.n++;c.s=2;c.due=today()+c.iv*DAY;
  }
  P.srs[k]=c; touch('main');
  return c;
}
function ivLabel(k,r){

function mergeP(a,b){

function listenWhisper({lang,onText,onEnd,continuous,maxMs=9000}){
  let stream=null,mr=null,chunks=[],ctx=null,timer=null,stopped=false,heard=false,alive=false,quietSince=0,started=Date.now();
  // create the audio context inside the tap (iPhone keeps it suspended otherwise); if it never reports sound we do not trust it
  try{const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();ctx.resume&&ctx.resume();}catch(e){ctx=null;}
  let resolveUrl;const urlP=new Promise(r=>resolveUrl=r);let textP=null;
  const code=String(lang||'en').slice(0,2);
  const cleanup=()=>{clearInterval(timer);try{ctx&&ctx.close();}catch(e){}if(stream)stream.getTracks().forEach(t=>t.stop());};
  const finish=()=>{
    if(textP)return textP;
    textP=new Promise(async res=>{
      stopped=true;
      const blob=await new Promise(r=>{if(!mr||mr.state==='inactive'){r(chunks.length?new Blob(chunks,{type:(mr&&mr.mimeType)||'audio/webm'}):null);return;}
        mr.onstop=()=>r(chunks.length?new Blob(chunks,{type:mr.mimeType||'audio/webm'}):null);try{mr.stop();}catch(e){r(null);}});
      cleanup();
      resolveUrl(blob?URL.createObjectURL(blob):null);
      let t='';if(blob&&(heard||!alive))t=await transcribe(blob,code);
      onText&&onText(t,true);onEnd&&onEnd(t);res(t);
    });
    return textP;
  };
  (async()=>{
    try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});}
    catch(e){micDenied();stopped=true;resolveUrl(null);textP=Promise.resolve('');onText&&onText('',true);onEnd&&onEnd('');return;}
    if(stopped){stream.getTracks().forEach(t=>t.stop());return;}
    const mt=recMime();try{mr=new MediaRecorder(stream,mt?{mimeType:mt,audioBitsPerSecond:48000}:{});}catch(e){mr=new MediaRecorder(stream);}
    mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};mr.start(250);
    // loudness watch: knows whether anything was said, and stops single answers after a pause
    let an=null,buf=null;
    try{if(ctx){const src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=1024;src.connect(an);buf=new Float32Array(an.fftSize);}}catch(e){an=null;}
    timer=setInterval(()=>{const now=Date.now();let rms=0;
      if(an){an.getFloatTimeDomainData(buf);let s=0;for(const v of buf)s+=v*v;rms=Math.sqrt(s/buf.length);}
      if(rms>1e-4)alive=true;
      if(rms>0.02){heard=true;quietSince=0;}else if(!quietSince)quietSince=now;
      if(!continuous){
        if(alive&&((heard&&quietSince&&now-quietSince>1300)||(!heard&&now-started>6000)))finish();
        else if(!alive&&now-started>4000)finish();   // no level reading on this device: fixed 4 s for one word
        else if(now-started>maxMs)finish();
      }
      else if(now-started>180000)finish();},100);
  })();
  return {whisper:true,stop:finish,url:()=>urlP};
}
function listenBrowser({lang,onText,onEnd,continuous}){
  if(!SR)return null;
  const rec=new SR(); rec.lang=lang; rec.interimResults=true; rec.continuous=continuous; rec.maxAlternatives=1;
  let finalText='', stopped=false, lastInterim='';
  rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)finalText+=r[0].transcript+' ';else interim+=r[0].transcript;}lastInterim=interim;onText&&onText((finalText+interim).trim(),false);};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')micDenied();};
  rec.onend=()=>{if(!stopped&&continuous){try{rec.start();return;}catch(e){}}const t=(finalText.trim()||lastInterim.trim());onText&&onText(t,true);onEnd&&onEnd(t);};
  try{rec.start();}catch(e){return null;}
  return {stop(){stopped=true;try{rec.stop();}catch(e){}return Promise.resolve(finalText.trim());}};
}
function listen({lang='en-GB',onText,onEnd,continuous=true,maxMs}={}){
  if(useWhisper())return listenWhisper({lang,onText,onEnd,continuous,maxMs});
  return listenBrowser({lang,onText,onEnd,continuous});
}
/* audio recorder: await recorder() -> {stop():Promise<blobURL>} or null */
async function recorder(){
  if(!CAN_REC)return null;
  let stream; try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){micDenied();return null;}
  const mt=recMime(); let mr; try{mr=new MediaRecorder(stream,mt?{mimeType:mt}:{});}catch(e){mr=new MediaRecorder(stream);}
  const chunks=[]; mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);}; mr.start(250);
  return {stop:()=>new Promise(res=>{mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());res(chunks.length?URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||'audio/webm'})):null);};try{mr.stop();}catch(e){res(null);}})};
}

const VIEWS={};
let current='home';
function go(v){if(v===current){route();return;}current=v;try{history.pushState(null,'','#'+v);}catch(e){}route();window.scrollTo(0,0);}
window.addEventListener('popstate',()=>{const h=(location.hash||'').slice(1)||'home';if(VIEWS[h]&&h!==current){current=h;route();}});
function route(soft){
  if(typeof uiNav==='function')uiNav();
  if(soft&&['test','listen','read','write','speak'].includes(current))return;
  stopSay(); window.__leave&&window.__leave(); window.__leave=null;
  const v=$('#view'); v.innerHTML='';
  try{(VIEWS[current]||VIEWS.home)(v);}catch(e){console.error(e);v.innerHTML=`<div class="view"><p class="note">Có lỗi khi mở trang này. Tải lại trang rồi thử lại.</p></div>`;}

/* timer: makeTimer(seconds, onTick(left), onEnd) -> {stop, left()} ; counts down once per second */
function makeTimer(sec,onTick,onEnd){
  let left=sec, id=setInterval(()=>{left--;onTick&&onTick(left);if(left<=0){clearInterval(id);id=null;onEnd&&onEnd();}},1000);
  onTick&&onTick(left);
  return {stop(){if(id)clearInterval(id);id=null;},left:()=>left};
}
/* generic quiz runner for mcq items {q, o:[...], a:index, w:'giải thích'} and fill items {q:'... ___ ...', a:'ans|alt', w}
   runQuiz(el,{title, items, kind, onDone(score,total)}) */
function runQuiz(el,{title,items,kind='review',onDone,intro=''}){
  let i=0,score=0;
  const draw=()=>{
    const x=items[i];
    if(!x){el.innerHTML=`<div class="view"><h2>${esc(title)}</h2><div class="panel quiz-end">${typeof mascot==='function'?mascot(score>=items.length*0.8?'yay':score>=items.length/2?'ok':'hmm',100):''}<h3>Đúng ${score}/${items.length} câu</h3><div class="row"><button class="btn primary" id="qzAgain">Làm lại</button><button class="btn" id="qzHome">Về Hôm nay</button></div></div></div>`;
      $('#qzAgain').onclick=()=>{i=0;score=0;items=shuffle(items);draw();};$('#qzHome').onclick=()=>go('home');onDone&&onDone(score,items.length);return;}
    const isMc=Array.isArray(x.o);
    el.innerHTML=`<div class="view"><div class="spread"><h2>${esc(title)}</h2><span class="note num">${i+1}/${items.length}</span></div>${i===0&&intro?`<p class="note">${intro}</p>`:''}
      <div class="panel qz">${x.pre||''}<div class="qz-q">${esc(x.q)}</div>
      ${isMc?`<div class="opts">${x.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div>`
        :`<form class="row" id="qzF"><input type="text" id="qzI" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ đáp án" style="flex:1 1 200px"><button class="btn primary">Kiểm tra</button></form>`}
      <div id="qzW"></div></div></div>`;
    const hl=$('.qz-hl',el);if(hl){const b=hl.closest('.qz-ctxb');b.scrollTop=hl.offsetTop-b.offsetTop-12;}
    const after=ok=>{if(ok)score++;else window.__mistake&&window.__mistake('q',x);if(ok&&window.__mistOk)window.__mistOk(x);
      window.__award&&window.__award(kind,1);
      $('#qzW').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Đúng rồi.':'Chưa đúng.'}</b>${!ok&&!isMc?` Đáp án: <b>${esc(String(x.a).split('|')[0])}</b>.`:''} ${esc(x.w||'')}</div><button class="btn primary" id="qzN">Câu tiếp ${ic('chevron-right')}</button>`;
      $('#qzN').onclick=()=>{i++;draw();};$('#qzN').focus();};
    if(isMc)$$('[data-k]',el).forEach(b=>b.onclick=()=>{const k=+b.dataset.k;$$('[data-k]',el).forEach((y,j)=>{y.disabled=true;if(j===x.a)y.classList.add('right');else if(j===k)y.classList.add('wrong');});after(k===x.a);});
    else{$('#qzF').onsubmit=e=>{e.preventDefault();const v=$('#qzI').value;if(!v.trim())return;$('#qzI').disabled=true;after(checkAnswer(v,x.a));};setTimeout(()=>$('#qzI').focus(),30);}
  };
  draw();
}
/* answer check for gap fills: "carbon dioxide|CO2", ignores case, punctuation, articles at start, and number words */
const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,hundred:100};
function normAns(s){
  let t=String(s).toLowerCase().replace(/[’`]/g,"'").replace(/£|\$|€/g,'').replace(/(\d),(\d{3})/g,'$1$2').replace(/(\d)(st|nd|rd|th)\b/g,'$1')
    .replace(/[^a-z0-9.%':/ -]+/g,' ').replace(/-/g,' ').replace(/\s+/g,' ').trim();
  t=t.replace(/^(the|a|an) /,'').replace(/\.$/,'');
  t=t.split(' ').map(x=>NUMW[x]!=null?String(NUMW[x]):x).join(' ');
  return t;
}
function checkAnswer(input,answer){const v=normAns(input);if(!v)return false;return String(answer).split('|').some(a=>normAns(a)===v);}

function hiWord(sent,word){
  if(/\s/.test(word.trim())){ /* phrase: mark each content word */
    const ws=word.toLowerCase().replace(/\b(sb|sth|someone|something|one's|sb's|sth's)\b/g,' ').split(/[^a-z']+/).filter(x=>x.length>2&&!['the','and','for','with','into','from','than','that'].includes(x));
    let h=esc(sent);ws.forEach(x=>{const st=x.replace(/(e|y)$/,'').slice(0,Math.max(3,x.length-2));h=h.replace(new RegExp('\\b('+st.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+"[a-z']*)",'i'),'<mark>$1</mark>');});return h;}
  const stem=word.toLowerCase().split(' ')[0].replace(/(e|y)$/,'').slice(0,Math.max(3,word.length-2));
  return esc(sent).replace(new RegExp('\\b('+stem.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[a-z]*)','i'),'<mark>$1</mark>');
}

  $('#cInfo').onclick=()=>openWord(w.k);
  $$('[data-r]',box).forEach(b=>b.onclick=()=>rate(+b.dataset.r));
}
function flip(){if(!qcur||revealed)return;revealed=true;drawCard();say(qcur.w);}
function rate(r){
  if(!qcur||!revealed)return; const w=qcur;
  const wasNew=!P.srs[w.k]; const c=schedule(w.k,r); if(!c.first)c.first=Date.now();
  window.__award&&window.__award(wasNew?'new':'review',1); if(r===0)window.__mistake&&window.__mistake('word',w.k);
  queue.shift(); sessDone++;
  if(r===0)queue.splice(Math.min(queue.length,4),0,w);
  qcur=null; nextCard();
}
document.addEventListener('keydown',e=>{
  if(current!=='study'||e.target.closest('input,textarea,select')||$('.modal-bg'))return;
  if(e.code==='Space'){e.preventDefault();flip();}
  else if(['1','2','3','4'].includes(e.key)&&revealed)rate(+e.key-1);
});

        const v=viFold(w.vi);if(v.split(/[;,]\s*/).some(x=>x.replace(/\(.*?\)/g,'').trim()===qf))s=Math.max(s,80);else if(qf.length>1&&v.includes(qf))s=Math.max(s,25);

      catch(e){toast(aiError(e));}

const CC={fur:'#F2A33A',dark:'#D97F1E',stripe:'#C96F12',belly:'#FFF3DC',ear:'#FFB4A8',nose:'#E5707A',eye:'#1C2333',navy:'#22346E',gold:'#F5B82E',red:'#C8372F'};
function catAcc(r){
  let s='';
  if(r>=1&&r<4)s+=`<path d="M62 46c6-20 70-20 76 0z" fill="${CC.navy}"/><circle cx="100" cy="26" r="6" fill="${CC.gold}"/>`; // beanie
  if(r>=2)s+=`<g fill="none" stroke="${CC.navy}" stroke-width="3.5"><circle cx="82" cy="78" r="12"/><circle cx="118" cy="78" r="12"/><path d="M94 78h12"/></g>`; // glasses
  if(r>=4){s+=`<path d="M56 40l44-18 44 18-44 18z" fill="${CC.navy}"/><rect x="80" y="40" width="40" height="12" rx="3" fill="${CC.navy}"/><path d="M144 40v20" stroke="${CC.gold}" stroke-width="3"/><circle cx="144" cy="62" r="4" fill="${CC.gold}"/>`;} // mortarboard
  if(r>=5)s+=`<rect x="150" y="140" width="26" height="12" rx="6" fill="#FFF8E7" stroke="${CC.dark}" stroke-width="2"/><rect x="160" y="138" width="6" height="16" fill="${CC.red}"/>`; // scroll
  if(r>=6)s+=`<path d="M86 118l14 8-14 8zM114 118l-14 8 14 8z" fill="${CC.red}"/><circle cx="100" cy="126" r="4" fill="${CC.red}"/>`; // bow tie
  if(r>=7)s+=`<path d="M60 150c10 20 70 20 80 0v30H60z" fill="${CC.navy}" opacity=".9"/>`; // gown
  return s;
}
function catSVG(state,size,rank){
  state=state||'calm';size=size||120;rank=rank||0;
  const yay=state==='yay',zzz=state==='zzz';
  const eyes=zzz?`<path d="M74 80q8 6 16 0M110 80q8 6 16 0" stroke="${CC.eye}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`

    :`<path d="M100 96v4M100 100q-5 5-10 2M100 100q5 5 10 2" stroke="${CC.eye}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  const armL=yay?'M66 128c-14-8-22-22-20-36':'M66 132c-6 8-8 14-6 20';

  const extra=state==='idea'?`<g transform="translate(150 14)"><circle cx="14" cy="16" r="12" fill="${CC.gold}"/><rect x="9" y="26" width="10" height="8" rx="2" fill="#9AA3A0"/></g>`
    :zzz?`<g font-family="sans-serif" font-weight="800" fill="${CC.navy}"><text x="142" y="44" font-size="18">z</text><text x="156" y="30" font-size="13">z</text></g>`
    :yay?`<circle cx="32" cy="44" r="4" fill="${CC.red}"/><rect x="160" y="34" width="8" height="5" fill="${CC.gold}" transform="rotate(30 164 36)"/><circle cx="168" cy="74" r="3.5" fill="#2C5FC4"/>`:'';
  return `<svg class="mascot cat-${state}" viewBox="0 0 200 200" width="${size}" height="${size}" role="img" aria-label="Jack">
  <path d="M140 168c26 0 40-16 36-36-2-10-12-12-14-4 6 4 4 22-16 24z" fill="${CC.fur}"/><path d="M168 134l8-4M171 146l9 0" stroke="${CC.stripe}" stroke-width="4" stroke-linecap="round"/>

  <path d="M95 92h10l-5 5z" fill="${CC.nose}"/>
  <path d="M72 96l-18-3M72 101l-18 3M128 96l18-3M128 101l18 3" stroke="#7A5A3A" stroke-width="1.6" stroke-linecap="round"/>
  <ellipse cx="70" cy="92" rx="6" ry="4" fill="${CC.ear}" opacity=".8"/><ellipse cx="130" cy="92" rx="6" ry="4" fill="${CC.ear}" opacity=".8"/>

}


const mascotSVG=catSVG;
function mcRankIdx(){try{const xp=plXPTotal();let i=0;PL_RANKS.forEach((r,k)=>{if(xp>=r[0])i=k;});return i;}catch(e){return 0;}}
function mascot(state,size){if(P.settings&&P.settings.noMascot)return '';return `<span class="mc-wrap">${catSVG(state,size,mcRankIdx())}</span>`;}
function mcSay(state,text,size){if(P.settings&&P.settings.noMascot)return `<p class="note">${text}</p>`;return `<div class="mc-say">${mascot(state,size||64)}<div class="mc-bubble">${text}</div></div>`;}

/* ================= PLAN: XP, ranks, daily plan, band records, placement, mistakes, daily tip, reports ================= */
const PL_W={review:1,new:3,listen:1.5,read:1.5,write:25,speak:4,grammar:8,pron:2,test:30,game:1,daily:5,dict:2};
const PL_RANKS=[[0,'Freshman','Tân sinh viên'],[300,'Sophomore','Sinh viên năm hai'],[1000,'Junior','Sinh viên năm ba'],[2500,'Senior','Sinh viên năm cuối'],[5000,'Bachelor','Cử nhân'],[9000,'Master','Thạc sĩ'],[15000,'PhD','Tiến sĩ'],[25000,'Professor','Giáo sư']];
const TARGETS=[5,5.5,6,6.5,7,7.5,8,8.5,9];
function plDay(k){P.day=P.day||{};k=k||ymd(Date.now());return P.day[k]=P.day[k]||{xp:0};}
function plXPTotal(){return Object.values(P.day||{}).reduce((a,d)=>a+(d.xp||0),0);}
function plRank(xp){let r=PL_RANKS[0],nx=PL_RANKS[1];for(let i=0;i<PL_RANKS.length;i++){if(xp>=PL_RANKS[i][0]){r=PL_RANKS[i];nx=PL_RANKS[i+1]||null;}}return {r,nx};}
function award(kind,n){
  n=n||1; const d=plDay(); d[kind]=(d[kind]||0)+n; const before=plXPTotal();
  const gain=Math.round((PL_W[kind]||1)*n); d.xp=(d.xp||0)+gain;
  const k=ymd(Date.now()); P.hist[k]=(P.hist[k]||0)+n; touch('main');
  const a=plRank(before).r, b=plRank(plXPTotal()).r;
  window.__xpFly&&window.__xpFly(gain);
  if(b!==a){if(window.__rankUp)window.__rankUp(b);else toast('Lên danh hiệu mới: '+b[1],4000);}
  const goal=plGoalXP(); if(d.xp>=goal&&d.xp-gain<goal){if(window.__goalDone)setTimeout(window.__goalDone,b!==a?2500:600);}
}
window.__award=award;
function plCfg(){P.plan=P.plan||{target:6.5,minutes:30,exam:'academic',start:today(),auto:true};return P.plan;}
function plGoalXP(){return Math.round(plCfg().minutes*3.5);}
function plNewPerDay(){const m=plCfg().minutes;return m>=90?30:m>=60?22:m>=45?16:m>=30?12:8;}
// vocabulary groups for a target band: skip groups far below the target so cards stay challenging
function plLevels(t){return t<=5?[1]:t<=5.5?[1,2]:t<=6?[1,2,3]:t<=6.5?[2,3]:t<=7?[2,3,4]:t<=7.5?[3,4,5]:[3,4,5];}
function plApply(){const c=plCfg();if(!c.auto)return;P.settings.lv=[...plLevels(c.target),...(P.settings.lv||[]).filter(PHR_LV)];P.settings.newPerDay=plNewPerDay();}
function plTasks(){
  const c=plCfg(), d=plDay(), dow=new Date().getDay(), even=Math.floor(today()/DAY)%2===0;
  let due=0,nw=0;try{due=dueList(P.settings.lv).length;nw=Math.max(0,P.settings.newPerDay-newToday());}catch(e){}
  const t=[
    {k:'srs',t:'Ôn thẻ và học từ mới',sub:due+nw?`${due} thẻ đến hạn, ${nw} từ mới`:'Đã xong phần thẻ hôm nay',done:V.length>0&&due===0&&nw===0,go:'study'},
    {k:'listen',t:'Nghe 10 câu',sub:'Một part Listening hoặc chép chính tả',done:(d.listen||0)>=10,go:'listen',n:[(d.listen||0),10]},
    {k:'read',t:'Đọc 13 câu',sub:'Một passage Reading',done:(d.read||0)>=13,go:'read',n:[(d.read||0),13]},

/* ---------- band records ----------
   recordScore({skill:'listening'|'reading'|'writing'|'speaking'|'overall', band, raw, total, id, title, exam, detail})
   latestBands() -> {listening, reading, writing, speaking, overall} (latest band of each skill, or null) */
function recordScore(o){
  P.scores=P.scores||[]; P.scores.push(Object.assign({t:Date.now(),exam:examType()},o));
  if(P.scores.length>300)P.scores=P.scores.slice(-300); touch('main');
}
window.__score=recordScore;
function latestBands(){
  const out={listening:null,reading:null,writing:null,speaking:null,overall:null};
  // listening/reading: a full 40-question test beats any short section; short sections only fill in when no full test exists
  const full={};
  (P.scores||[]).forEach(s=>{if(!(s.skill in out)||s.band==null)return;
    const short=(s.skill==='listening'||s.skill==='reading')&&s.total&&s.total<36;
    if(short){if(!full[s.skill])out[s.skill]=s.partial?s.band:Math.min(s.band,7.5);}
    else{out[s.skill]=s.band;if(s.skill==='listening'||s.skill==='reading')full[s.skill]=1;}});
  if(out.overall==null&&P.placeBand)out.overall=P.placeBand;
  return out;
}
function estBand(){const b=latestBands();const o=overallBand([b.listening,b.reading,b.writing,b.speaking].filter(x=>x!=null));return o!=null&&[b.listening,b.reading,b.writing,b.speaking].filter(x=>x!=null).length>=2?o:(b.overall!=null?b.overall:o);}

/* ---------- placement test: objective and adaptive, about 15-18 minutes ----------
   Sections: 1 vocabulary (meaning in context, adaptive by level), 2 grammar (12 items), 3 reading (2 short timed tasks
   cut from real passages), 4 optional listening (5 items from one part, played once).
   Scoring is strict on purpose (the old self-report version inflated bands):
   - Vocabulary: a level is passed with >= 5/6 right (level 1: >= 4/6). A level below a tested level where the learner got
     >= 3/6 counts as passed (easier words). Highest passed level: none 4.5, L1 5.0, L2 6.0, L3 7.0, L4 7.5, L5 8.5,
     +0.5 if level 5 is 6/6. Adaptive path: start at level 2 (level 3 if the last placement band was >= 7), go up on >= 5/6,
     stop on < 5/6, drop one level on < 3/6 if the test has not gone up yet.
   - Grammar: 3 items per level 1-4. Highest level L with >= 2/3 right AND >= 2L right over levels 1..L (one lucky level
     does not count): none 4.5, 1 5.5, 2 6.5, 3 7.5, 4 8.5; 9.0 when level 4 is 3/3.
   - Reading: task A (non-expert passage, band upper bound <= 7, 5 items, 7 min): 0-1 5.0, 2 5.5, 3 6.0, 4 6.5, 5 7.0.
     Task B (expert passage, band upper bound >= 9, 5 items, 7 min) only if A >= 3 or vocabulary reached level 4:
     5 9.0, 4 8.5, 3 8.0, 2 7.5, otherwise keep A.
   - Listening (optional): <= 1 5.0, 2 6.0, 3 7.0, 4 8.0, 5 9.0 on an expert part (test >= 7); a normal part is capped at 7.5.
   - Overall = weighted mean (reading .40, listening .25, vocabulary .20, grammar .15; without listening reading .55 and the
     weights renormalised to sum 1), rounded DOWN to the nearest 0.5, capped at 9. Writing and Speaking are not measured. */
let PLC=null, PC_tm=null, PC_tok=0;
const PC_SEC={vocab:'Từ vựng',gram:'Ngữ pháp',read:'Đọc hiểu',listen:'Nghe'};
const PC_RK=new Set(['tfng','ynng','mcq','sentcomp','sumcomp','notecomp','shortans','matchinfo']);
const PC_viShort=s=>String(s||'').split(';').map(x=>x.replace(/\(\s*(?:n|v|adj|adv|phr|prep|conj|idiom|phrasal verb|phr v|n phr|v phr)\.?\s*\)/gi,'').replace(/\s{2,}/g,' ').trim()).filter(Boolean).slice(0,2).join('; ');
const PC_pos=w=>String(w.pos||'').split(/[ ,/]/)[0];
const PC_reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function PC_match(w){
  const ex=String(w.ex||''), toks=String(w.w).split(/\s+/).filter(t=>t&&!/^(sb|sth|someone|something|one's|sb's|\.\.\.)$/i.test(t));
  if(!toks.length)return null;
  const st=t=>{t=t.replace(/[()]/g,'');const s=t.length>5?t.slice(0,-2):t.length>3?t.slice(0,-1):t;return PC_reEsc(s)+"[\\w'-]*";};
  const tries=[toks.map(st).join("\\s+(?:[\\w'-]+\\s+){0,2}"),st(toks[0])];
  for(const r of tries){const m=new RegExp('\\b'+r,'i').exec(ex);if(m)return m;}
  return null;
}
function PC_hl(w){const ex=String(w.ex||''),m=PC_match(w);if(!m)return esc(ex);
  return esc(ex.slice(0,m.index))+'<mark class="pc-hl">'+esc(m[0])+'</mark>'+esc(ex.slice(m.index+m[0].length));}
function PC_vItem(w){
  const pos=PC_pos(w), right=PC_viShort(w.vi), seen=new Set([viFold(right)]), ds=[], pool=shuffle(V.filter(x=>x.lv===w.lv&&x!==w));
  for(const pass of [1,2])for(const x of pool){if(ds.length>=3)break;if(pass===1&&PC_pos(x)!==pos)continue;
    const t=PC_viShort(x.vi),f=viFold(t);if(!t||seen.has(f))continue;seen.add(f);ds.push(t);}
  const o=shuffle([right,...ds]);return {k:w.k,o,a:o.indexOf(right)};
}
function PC_vBand(res){
  let top=0;
  for(let L=1;L<=5;L++){const c=res[L];if(c==null)continue;if(c>=(L===1?4:5))top=Math.max(top,L);else if(c>=3&&L>1&&res[L-1]==null)top=Math.max(top,L-1);}
  return [4.5,5,6,7,7.5,8.5][top]+(res[5]===6?0.5:0);
}
function PC_gBand(res){let top=0,sum=0;for(let L=1;L<=4;L++){sum+=res[L]||0;if((res[L]||0)>=2&&sum>=2*L)top=L;}return top===4&&res[4]===3?9:[4.5,5.5,6.5,7.5,8.5][top];}
function PC_rBand(a,b){let r=[5,5,5.5,6,6.5,7][a]||5;if(b!=null){const x={5:9,4:8.5,3:8,2:7.5}[b];if(x)r=x;}return r;}
function PC_lBand(c,expert){const b=[5,5,6,7,8,9][c]||5;return expert?b:Math.min(7.5,b);}
function PC_overall(v,g,r,l){
  const x=l!=null?r*.4+l*.25+v*.2+g*.15:(r*.55+v*.2+g*.15)/.9; // without listening the weights sum to .9, so renormalise
  return Math.min(9,Math.floor(x*2+1e-9)/2);
}
function PC_rdItems(p,S){
  const out=[];p.groups.forEach((g,gi)=>{if(!PC_RK.has(g.kind))return;g.items.forEach((it,ii)=>{if(!S.includes(it.para))return;if(g.kind==='matchinfo'&&!S.includes(it.a))return;out.push({gi,ii});});});
  return out;
}
function PC_instr(g,S){
  const lim=(String(g.instr).match(/(?:Choose|Write)[^.]*?for each answer\./i)||['Choose NO MORE THAN TWO WORDS from the passage for each answer.'])[0];
  return {tfng:'Do the following statements agree with the information given in the text?\nWrite TRUE, FALSE or NOT GIVEN.',
    ynng:'Do the following statements agree with the claims of the writer?\nWrite YES, NO or NOT GIVEN.',
    mcq:'Choose the correct letter, A, B, C or D.',
    matchinfo:`Which paragraph contains the following information?\nChoose the correct letter, ${S[0]}-${S[S.length-1]}.`,
    sentcomp:'Complete the sentences below.\n'+lim, sumcomp:'Complete the summary below.\n'+lim, notecomp:'Complete the notes below.\n'+lim,
    shortans:'Answer the questions below.\n'+lim}[g.kind];
}
function PC_rdTask(R,expert,avoid){
  const ok=p=>expert?TS_bandHi(p.band)>=9:TS_bandHi(p.band)<=7, cands=[];
  R.forEach(p=>{if(!ok(p)||p.id===avoid)return;const labs=p.paras.map(x=>x[0]);
    [2,3].forEach(w=>{for(let i=0;i+w<=labs.length;i++){const S=labs.slice(i,i+w),its=PC_rdItems(p,S);if(its.length>=5)cands.push({p,S,its});}});});
  const mine=cands.filter(c=>c.p.type===examType()), c=pick(mine.length?mine:cands);if(!c)return null;
  const keep=new Set(shuffle(c.its.map((_,i)=>i)).slice(0,5)), its=c.its.filter((_,i)=>keep.has(i));
  return {pid:c.p.id,S:c.S,sel:its,A:{},left:420,sub:false,raw:0};
}
function PC_rdSec(R,t){
  const p=R.find(x=>x.id===t.pid), by={};
  t.sel.forEach(({gi,ii})=>{(by[gi]=by[gi]||[]).push(p.groups[gi].items[ii]);});
  const groups=Object.keys(by).map(Number).sort((a,b)=>a-b).map(gi=>{const g=p.groups[gi];return {kind:g.kind,instr:PC_instr(g,t.S),opts:g.opts,items:by[gi]};});
  return {sid:'pc'+t.pid,src:'Bài xếp lớp - Reading',groups,start:1,paras:t.S,p};
}
function PC_lsTask(L,expert){
  const ps=L.filter(p=>expert?LS_isX(p.test)&&p.part>=2:(p.part===2||p.part===3)&&!LS_isX(p.test));
  const p=pick(ps.length?ps:L.filter(x=>x.part===2||x.part===3));
  return {pid:p.id,x:LS_isX(p.test),A:{},started:false,ended:false,sub:false,raw:0};
}
function PC_lsSec(L,t){
  const p=L.find(x=>x.id===t.pid);let n=0;
  const groups=p.groups.map(g=>{const items=[];g.items.forEach(it=>{const c=g.kind==='multi'?2:1;if(n+c<=5){items.push(it);n+=c;}});return Object.assign({},g,{items,instr:String(g.instr).replace(/^\s*Questions?\s+\d+(?:\s*-\s*\d+)?[.:]?\s*/i,'')});}).filter(g=>g.items.length);
  return {sid:'pcl'+p.id,src:'Bài xếp lớp - Listening',groups,start:1,p};
}
/* right answers for a TS section, in a form the debug hook can type or click */
function PC_rights(sec){
  const out=[];sec.groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{const k=sec.sid+'.'+gi+'.'+ii;
    out.push({k,kind:g.kind,v:TS_GAP.has(g.kind)?String(it.a).split('|')[0]:g.kind==='multi'?it.a:g.kind==='matchinfo'?it.a:TS_TF[g.kind]?it.a:g.kind==='mcq'?it.a:String(it.a)});}));
  return out;
}

/* ---------- mistakes notebook ----------
   window.__mistake('word', key) or window.__mistake('q', item) where item is a quiz item {q, o?, a, w}
   window.__mistOk(item) after a correct answer: 2 correct in a row removes it */
const mkIsRd=v=>v&&v.t==='q'&&v.x&&(v.x.ctx?v.x.ctx.t==='rd':/^(Academic|GT) Test \d+ (Passage|Section) \d+$/.test(v.x.src||''));
function plMistList(){P.mist=P.mist||{};let rm=0;Object.keys(P.mist).forEach(k=>{if(mkIsRd(P.mist[k])){delete P.mist[k];rm++;}});if(rm)touch('main');return Object.entries(P.mist).filter(([k,v])=>!v.ok||v.ok<2);}
const mkKey=(type,x)=>type==='word'?'w:'+x:'q:'+String(x.q||x.s||'').slice(0,80)+'|'+(Array.isArray(x.o)?x.o.join('/'):x.a);
window.__mistake=(type,x)=>{
  P.mist=P.mist||{}; const key=mkKey(type,x);
  const e=P.mist[key]||{t:type,n:0,ok:0,x:type==='word'?x:{q:x.q||x.s,o:x.o,a:x.a,w:x.w||x.why||'',src:x.src||'',ctx:x.ctx||null}};
  if(type!=='word'&&x.ctx&&!e.x.ctx)e.x.ctx=x.ctx;
  e.n++;e.ok=0;e.last=Date.now();P.mist[key]=e;
  const keys=Object.keys(P.mist);if(keys.length>400)keys.sort((a,b)=>P.mist[a].last-P.mist[b].last).slice(0,keys.length-400).forEach(k=>delete P.mist[k]);
  touch('main');
};
window.__mistOk=x=>{P.mist=P.mist||{};[mkKey('q',x),'w:'+String(x.wk||'')].forEach(k=>{const e=P.mist[k];if(e){e.ok=(e.ok||0)+1;if(e.ok>=2)delete P.mist[k];}});};
VIEWS.mistakes=el=>{
  const list=plMistList().sort((a,b)=>b[1].n-a[1].n);
  const words=list.filter(([k,v])=>v.t==='word'), qs=list.filter(([k,v])=>v.t==='q');
  el.innerHTML=`<div class="view"><div class="spread"><h2>Sổ lỗi sai</h2><span class="note">${list.length} mục</span></div>
   <p class="note">App tự ghi lại từ bạn bấm "Quên", câu sai ở Listening, ngữ pháp, phát âm và trò chơi. Câu Reading không vào sổ vì cần đọc cả bài mới làm lại được, xem lại ngay trong bài sau khi nộp. Mỗi mục trả lời đúng 2 lần liên tiếp thì tự rời sổ.</p>
   ${list.length?`<div class="row"><button class="btn primary" id="mkGo">Ôn 15 mục sai nhiều nhất</button></div>`:mcSay('ok','Chưa có lỗi nào. Câu nào bạn trả lời sai sẽ được lưu ở đây để ôn lại.',72)}
   ${words.length?`<div class="panel"><h3>Từ hay quên</h3><div class="pexs">${words.slice(0,60).map(([k,v])=>{const w=VI.get(v.x);return w?`<button class="pex" data-wd="${esc(w.k)}"><b>${esc(w.w)}</b> <span class="muted small">${esc(w.vi)}</span> <span class="pill">${v.n}</span></button>`:'';}).join('')}</div></div>`:''}
   ${qs.length?`<div class="panel"><h3>Câu hay sai</h3>${qs.slice(0,40).map(([k,v])=>`<div class="mk-q"><div>${esc(v.x.q)} <span class="pill">${v.n}</span></div>${v.x.src?`<div class="small muted">${esc(v.x.src)}</div>`:''}<div class="small">Đáp án: <b>${esc(Array.isArray(v.x.o)?v.x.o[v.x.a]:String(v.x.a).split('|')[0])}</b></div>${v.x.w?`<div class="small muted">${esc(v.x.w)}</div>`:''}</div>`).join('')}</div>`:''}</div>`;
  $$('[data-wd]',el).forEach(b=>b.onclick=()=>openWord(b.dataset.wd));
  const g=$('#mkGo');if(g)g.onclick=async()=>{
    const items=list.slice(0,15).map(([k,v])=>{if(v.t==='q')return Object.assign({},v.x);const w=VI.get(v.x);if(!w)return null;
      const o=shuffle([w,...shuffle(V.filter(x=>x.lv===w.lv&&x.vi!==w.vi)).slice(0,3)]);return {q:'"'+w.w+'" nghĩa là gì?',o:o.map(x=>x.vi),a:o.indexOf(w),w:w.w+' '+w.ipa+': '+w.vi,wk:w.k};}).filter(Boolean);
    g.disabled=true;await mkCtx(items);
    plDay().mist=(plDay().mist||0)+1;touch('main');
    runQuiz(el,{title:'Ôn sổ lỗi',items,kind:'review'});
  };
};

/* Reading and Listening questions need their passage or dialogue to be answerable again.
   New entries carry ctx {t:'rd'|'ls', id, para}; older ones are matched by their source title. */
const MK_RD=/^(Academic|GT) Test \d+ (Passage|Section) \d+$/, MK_LS=/^Listening Test (\d+) Part (\d+)$/;
async function mkCtx(items){
  const kind=x=>x.ctx?x.ctx.t:MK_LS.test(x.src||'')?'ls':MK_RD.test(x.src||'')?'rd':'';
  const need=items.filter(x=>kind(x));if(!need.length)return;
  let R=null,L=null;
  if(need.some(x=>kind(x)==='rd'))try{R=await loadJSON('reading');}catch(e){}
  if(need.some(x=>kind(x)==='ls'))try{L=await loadJSON('listening');}catch(e){}
  need.forEach(x=>{
    if(kind(x)==='rd'&&R){const p=x.ctx?R.find(p=>p.id===x.ctx.id):R.find(p=>RD_title(p)===x.src);if(p)x.pre=mkRdHTML(p,x.ctx&&x.ctx.para);}
    if(kind(x)==='ls'&&L){let p;if(x.ctx)p=L.find(p=>p.id===x.ctx.id);else{const m=x.src.match(MK_LS);p=L.find(p=>p.test===+m[1]&&p.part===+m[2]);}if(p)x.pre=mkLsHTML(p);}
  });
}
function mkRdHTML(p,para){
  return `<details class="g qz-ctx" open><summary><span class="t">Đoạn văn: ${esc(p.title||RD_title(p))}${para?` (đáp án nằm ở đoạn ${esc(para)})`:''}</span>${ic('chevron-right')}</summary>
    <div class="qz-ctxb">${p.paras.map(([l,t])=>`<p class="rd-p en-s${para&&l===para?' qz-hl':''}"><b class="rd-l">${esc(l)}</b>${esc(t)}</p>`).join('')}</div></details>`;
}
function mkLsHTML(p){
  return `<details class="g qz-ctx"><summary><span class="t">Nghe lại hoặc đọc lời thoại: Part ${p.part}${p.title?', '+esc(p.title):''}</span>${ic('chevron-right')}</summary>
    <div class="qz-ctxb">${p.lines.map(([sid,t],li)=>{const sp=LS_spk(p,sid);return `<div class="ls-tl"><button class="spk sm" data-pid="${p.id}" data-li="${li}" data-say="${esc(t)}" data-lang="${esc(sp.accent)}" data-voice="${esc(sp.voice)}" aria-label="Nghe dòng này">${SPK}</button><div class="ls-tlt"><span class="ls-sp">${esc(sp.name)}</span><span class="en-s">${esc(t)}</span></div></div>`;}).join('')}</div></details>`;
}

const DLY_CAT={idiom:'Idiom',collocation:'Collocation',phrasal:'Phrasal verb',tip:'Mẹo thi',mistake:'Lỗi hay gặp',fact:'Có thể bạn chưa biết'};
function dlyIndex(){const c=plCfg();return Math.max(0,Math.floor((today()-(c.start||today()))/DAY));}
function dlyCard(x,big){
  P.dly=P.dly||{}; const done=P.dly[x.id];
  return `<div class="dly ${big?'big':''}" data-id="${x.id}"><div class="spread"><span class="pill">${esc(DLY_CAT[x.cat]||x.cat)}</span>${done?ic('check','ok-i'):''}</div>
    <h3 class="dly-t">${esc(x.title)}</h3>${x.en&&x.en!==x.title?`<div class="dly-en en-s"><button class="spk sm" data-say="${esc(x.en)}" aria-label="Nghe">${SPK}</button> ${esc(x.en)}</div>`:''}
    <p style="margin:0">${esc(x.vi)}</p>
    ${x.ex?`<div class="ex"><button class="spk" data-say="${esc(x.ex[0])}" aria-label="Nghe câu">${SPK}</button><div><div class="en-s">${esc(x.ex[0])}</div><div class="small muted">${esc(x.ex[1])}</div></div></div>`:''}
    ${x.q?`<div class="dly-q"><span class="label">Câu hỏi nhỏ</span><div>${esc(x.q.q)}</div><div class="opts">${x.q.o.map((o,k)=>`<button class="opt ${done&&k===x.q.a?'right':''}" data-k="${k}" ${done?'disabled':''}>${esc(o)}</button>`).join('')}</div></div>`:''}</div>`;
}
function dlyBind(root,x){
  $$('.dly[data-id="'+x.id+'"] [data-k]',root).forEach(b=>b.onclick=()=>{const k=+b.dataset.k;$$('.dly[data-id="'+x.id+'"] [data-k]',root).forEach((y,i)=>{y.disabled=true;if(i===x.q.a)y.classList.add('right');else if(i===k)y.classList.add('wrong');});

}

/* ---------- reset placement: band, placement scores, and words marked known by placement but never reviewed since ---------- */
function plResetPlacement(){
  const isPl=s=>/xếp lớp/i.test(s.title||'');
  const nScores=(P.scores||[]).filter(isPl).length;
  const untouched=Object.entries(P.srs).filter(([k,c])=>c.pl&&c.n===2&&!c.l);
  const m=modal(`<h2>Xóa kết quả xếp lớp</h2>
    <p class="note">Sẽ xóa band ước lượng từ bài xếp lớp, ${nScores} điểm "Bài xếp lớp" trong lịch sử, và gỡ ${untouched.length} từ được đánh dấu đã biết lúc xếp lớp mà bạn chưa ôn lại lần nào. Từ đã ôn thật, điểm thi thử và XP giữ nguyên.</p>
    <div class="row"><button class="btn primary" id="rsGo">Xóa và làm lại bài xếp lớp</button><button class="btn" id="rsNo">Thôi</button></div>`);
  $('#rsNo',m.el).onclick=m.close;
  $('#rsGo',m.el).onclick=()=>{
    P.scores=(P.scores||[]).filter(s=>!isPl(s));
    untouched.forEach(([k])=>delete P.srs[k]);
    delete P.placeBand; delete P.placed; PLC=null; queue=[]; touch('main');
    m.close(); toast(`Đã xóa. Gỡ ${untouched.length} từ khỏi danh sách đã biết.`,3500); go('placement');
  };
}

/* ---------- one-time migration: results from the old self-report placement test (before placeV 2) are too generous.
   Clear them once per learner, the same way as plResetPlacement, and invite a retake. Runs on every route; cheap no-op afterwards. */
function plMigrate(){
  if(!P.placed||P.placeV>=2)return;
  const isPl=s=>/xếp lớp/i.test(s.title||'');
  P.scores=(P.scores||[]).filter(s=>!isPl(s));
  Object.entries(P.srs).forEach(([k,c])=>{if(c.pl&&c.n===2&&!c.l)delete P.srs[k];});
  delete P.placeBand; delete P.placed; P.placeRedo=1; queue=[]; touch('main');
}

/* ================= TEST ENGINE (TS_*) shared by Listening, Reading and Thi thử =================
   A "section" is one listening part or one reading passage: {sid, src, groups, start, paras?, p}
   Answers live in a plain object A keyed "sid.groupIndex.itemIndex" (multi: array of picked indexes). */
const TS_ROM=['i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii','xiii','xiv','xv'];
const TS_LET='ABCDEFGHIJKLMNOP'.split('');
const TS_GAP=new Set(['form','note','table','sentcomp','sumcomp','notecomp','shortans']);
const TS_TF={tfng:['TRUE','FALSE','NOT GIVEN'],ynng:['YES','NO','NOT GIVEN']};
let TS_cleans=[];
function TS_onClean(f){TS_cleans.push(f);}
function TS_clean(){const c=TS_cleans;TS_cleans=[];c.forEach(f=>{try{f();}catch(e){console.warn(e);}});}
function TS_count(groups){return groups.reduce((s,g)=>s+g.items.length*(g.kind==='multi'?2:1),0);}
function TS_answered(A){return Object.values(A).reduce((s,v)=>s+(Array.isArray(v)?v.length:(v!==''&&v!=null&&String(v).trim()?1:0)),0);}
const TS_v=dv=>/^\d+$/.test(dv)?+dv:dv;
/* expert (band 8.5-9) pack: derived from data */
const TS_XPILL='<span class="pill ts-xp">Chuyên gia 8.5-9</span>';
const TS_bandHi=b=>{const m=String(b||'').match(/\d+(?:\.\d+)?/g);return m?+m[m.length-1]:0;};
/* Band from a short section is only a rough guess: 10 or 13 questions cannot prove a band 9, and an easy part cannot either.
   Full tests (36+ questions) use the official-style table. Shorter sections: table band, capped by how hard the content is
   (normal content max 7.5, expert content max 8.5), and marked partial so full tests take priority in the learner's band. */
function TS_secBand(skill,raw,total,{expert=false,type}={}){
  const b=bandOf(skill,raw,total,type);
  if(total>=36)return {band:b,partial:false};
  return {band:Math.min(b,expert?8.5:7.5),partial:true};
}
const LS_isX=t=>+t>=7;
const RD_isXP=p=>TS_bandHi(p.band)>=9;
const RD_isXT=(R,type,t)=>R.some(p=>p.type===type&&p.test===t&&RD_isXP(p));
const TS_xHead=note=>`<div class="ts-xh"><h3>Đề chuyên gia (band 8.5-9)</h3><p class="note">${note}</p></div>`;
const LS_XNOTE='Khó hơn đề thường: người nói nhanh và tự nhiên, nhiều bẫy sửa lời và paraphrase.';
const RD_XNOTE='Khó hơn đề thường: bài học thuật dày, bẫy NOT GIVEN và paraphrase sát nghĩa.';

function TS_itemHTML(g,it,k,n,A,sec){
  const v=A[k], kind=g.kind;
  const num=`<span class="ts-n num">${kind==='multi'?n+'-'+(n+1):n}</span>`;
  let body;
  if(TS_GAP.has(kind)){
    const inp=`<input type="text" class="ts-gap" data-k="${k}" placeholder="${n}" value="${esc(v||'')}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Câu ${n}">`;
    const parts=String(it.q).split(/_{3,}/);
    const txt=s=>esc(s).replace(/ \| /g,'<span class="ts-sep">|</span>');
    body=`<div class="ts-qt">${parts.length>1?txt(parts[0])+inp+txt(parts.slice(1).join('___')):txt(it.q)+' '+inp}</div>`;
  }else if(kind==='mcq'){
    body=`<div class="ts-qt">${esc(it.q)}</div><div class="ts-ch">${it.o.map((o,i)=>`<button type="button" class="ts-c" data-k="${k}" data-v="${i}" aria-pressed="${v===i}"><b>${TS_LET[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>`;
  }else if(TS_TF[kind]){
    body=`<div class="ts-qt">${esc(it.q)}</div><div class="ts-tf">${TS_TF[kind].map(c=>`<button type="button" class="ts-c sm" data-k="${k}" data-v="${c}" aria-pressed="${v===c}">${c}</button>`).join('')}</div>`;
  }else if(kind==='multi'){
    const s=v||[];
    body=`<div class="ts-qt">${esc(it.q)} <span class="ts-hint">Chọn 2 đáp án</span></div><div class="ts-ch">${it.o.map((o,i)=>`<button type="button" class="ts-c ts-m" data-k="${k}" data-m="${i}" aria-pressed="${s.includes(i)}"><b>${TS_LET[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>`;
  }else{ // matching, matchfeat, headings, matchinfo
    const labs=kind==='matchinfo'?(sec.paras||[]):(kind==='headings'?TS_ROM:TS_LET).slice(0,(g.opts||[]).length);
    const vals=kind==='matchinfo'?labs:labs.map((_,i)=>String(i));
    body=`<div class="ts-sel"><span class="ts-qt">${esc(it.q)}</span><select data-k="${k}" aria-label="Câu ${n}"><option value="">Chọn</option>${labs.map((l,i)=>`<option value="${vals[i]}" ${v!=null&&String(v)===vals[i]?'selected':''}>${l}</option>`).join('')}</select></div>`;
  }
  return `<div class="ts-it" data-item="${k}">${num}<div class="ts-body">${body}<div class="ts-fb" hidden></div></div></div>`;
}
function TS_qHTML(sec,A){
  let n=sec.start;
  return sec.groups.map((g,gi)=>{
    let box='';
    if(g.opts&&g.opts.length){const lab=g.kind==='headings'?TS_ROM:TS_LET;
      box=`<div class="ts-box">${g.kind==='headings'?'<div class="ts-box-t">List of Headings</div>':''}${g.opts.map((o,i)=>`<div class="ts-bo"><b>${lab[i]}</b><span>${esc(o)}</span></div>`).join('')}</div>`;}
    const items=g.items.map((it,ii)=>{const h=TS_itemHTML(g,it,sec.sid+'.'+gi+'.'+ii,n,A,sec);n+=g.kind==='multi'?2:1;return h;}).join('');
    return `<div class="ts-grp"><div class="ts-instr">${esc(g.instr)}</div>${box}<div class="ts-items">${items}</div></div>`;
  }).join('');
}
/* delegated input handling; survives innerHTML redraws of root */
function TS_bind(root,A,onChange){
  root.addEventListener('input',e=>{const t=e.target;if(t.matches('.ts-gap')){A[t.dataset.k]=t.value;onChange&&onChange();}});
  root.addEventListener('change',e=>{const t=e.target;if(t.matches('select[data-k]')){A[t.dataset.k]=t.value;onChange&&onChange();}});
  root.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&t.matches('.ts-gap')){e.preventDefault();const all=$$('.ts-gap',root);const nx=all[all.indexOf(t)+1];if(nx)nx.focus();else t.blur();}});
  root.addEventListener('click',e=>{
    const b=e.target.closest('.ts-c');if(!b||b.disabled||!root.contains(b))return;const k=b.dataset.k;
    if(b.dataset.m!=null){let s=(A[k]||[]).slice();const i=+b.dataset.m;
      if(s.includes(i))s=s.filter(x=>x!==i);else{s.push(i);if(s.length>2)s.shift();}
      A[k]=s;$$('.ts-c',b.parentNode).forEach(x=>x.setAttribute('aria-pressed',s.includes(+x.dataset.m)));}
    else{const v=TS_v(b.dataset.v);A[k]=A[k]===v?undefined:v;if(A[k]===undefined)delete A[k];
      $$('.ts-c',b.parentNode).forEach(x=>x.setAttribute('aria-pressed',A[k]!==undefined&&TS_v(x.dataset.v)===A[k]));}
    onChange&&onChange();
  });
}
function TS_mark(sec,A){
  const out=[];let n=sec.start;
  sec.groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{
    const k=sec.sid+'.'+gi+'.'+ii, v=A[k], kind=g.kind;
    if(kind==='multi'){const s=(v||[]).slice().sort((a,b)=>a-b);const c=s.filter(i=>it.a.includes(i)).length;
      const r={k,kind,g,it,sec,multi:true,c,user:s.map(i=>TS_LET[i]).join(', '),right:it.a.slice().sort((a,b)=>a-b).map(i=>TS_LET[i]).join(', ')};
      out.push(Object.assign({},r,{n,ok:c>=1}),Object.assign({},r,{n:n+1,ok:c>=2,dup:true}));n+=2;return;}
    let ok=false,user='',right='';
    if(TS_GAP.has(kind)){user=String(v||'').trim();ok=!!user&&checkAnswer(user,it.a);right=String(it.a).split('|').join(' / ');}
    else if(kind==='mcq'){ok=v===it.a;user=v!=null?TS_LET[v]+'. '+it.o[v]:'';right=TS_LET[it.a]+'. '+it.o[it.a];}
    else if(TS_TF[kind]){ok=v===it.a;user=v||'';right=it.a;}
    else if(kind==='matchinfo'){ok=!!v&&v===it.a;user=v||'';right=it.a;}
    else{const lab=kind==='headings'?TS_ROM:TS_LET;const vi=v===''||v==null?null:+v;ok=vi===it.a;user=vi!=null?lab[vi]+'. '+g.opts[vi]:'';right=lab[it.a]+'. '+g.opts[it.a];}
    out.push({k,n,kind,g,it,sec,ok,user,right});n++;
  }));
  return out;
}
function TS_applyMarks(root,results,{onPara}={}){
  $$('input.ts-gap,select[data-k],.ts-c',root).forEach(x=>x.disabled=true);
  results.forEach(r=>{
    if(r.dup)return;const it=$(`[data-item="${r.k}"]`,root);if(!it)return;
    const full=r.multi?r.c===2:r.ok;it.classList.add(full?'ok':'bad');
    if(r.kind==='multi')$$('.ts-c',it).forEach(b=>{const i=+b.dataset.m;if(r.it.a.includes(i))b.classList.add('right');else if(b.getAttribute('aria-pressed')==='true')b.classList.add('wrong');});
    else if(r.kind==='mcq'||TS_TF[r.kind])$$('.ts-c',it).forEach(b=>{if(TS_v(b.dataset.v)===r.it.a)b.classList.add('right');else if(b.getAttribute('aria-pressed')==='true')b.classList.add('wrong');});
    else{const f=$('input.ts-gap,select',it);if(f)f.classList.add(r.ok?'ok':'bad');}
    const verdict=full?'Đúng':r.multi&&r.c===1?'Đúng 1 trong 2':'Sai';
    const fb=$('.ts-fb',it);
    fb.innerHTML=`<div><b class="${full?'ts-okt':'ts-badt'}">${verdict}.</b>${full?'':` Bạn ${TS_GAP.has(r.kind)?'viết':'chọn'}: <b>${r.user?esc(r.user):'(bỏ trống)'}</b>.`} Đáp án: <b>${esc(r.right)}</b></div>${r.it.why?`<div class="ts-why">${esc(r.it.why)}</div>`:''}${onPara&&r.it.para?`<button type="button" class="btn sm ts-para" data-para="${esc(r.it.para)}" data-sid="${esc(r.sec.sid)}">${ic('search')} Xem trong bài (đoạn ${esc(r.it.para)})</button>`:''}`;
    fb.hidden=false;
  });
  if(onPara)$$('.ts-para',root).forEach(b=>b.onclick=()=>onPara(b.dataset.sid,b.dataset.para));
}
/* wrong answers -> mistakes notebook, right ones -> __mistOk */
function TS_log(results){
  results.forEach(r=>{
    if(r.dup)return;if(!(r.sec.p&&r.sec.p.lines))return; /* Reading is reviewed inside the passage, not in the mistakes notebook */
    const it=r.it,k=r.kind;let x;
    if(k==='mcq')x={q:it.q,o:it.o,a:it.a};
    else if(TS_TF[k])x={q:it.q,o:TS_TF[k],a:TS_TF[k].indexOf(it.a)};
    else if(k==='multi')x={q:it.q+' (chọn 2: '+it.o.map((o,i)=>TS_LET[i]+'. '+o).join('; ')+')',a:it.a.map(i=>it.o[i]).join(' and ')};
    else if(k==='matchinfo')x={q:it.q+' (đoạn nào?)',a:it.a};
    else if(r.g.opts)x={q:it.q,o:r.g.opts,a:it.a};
    else x={q:it.q,a:it.a};
    x.w=it.why||'';x.src=r.sec.src;x.ctx={t:r.sec.p&&r.sec.p.lines?'ls':'rd',id:r.sec.sid,para:it.para||''};
    if(r.multi?r.c===2:r.ok){window.__mistOk&&window.__mistOk(x);}else window.__mistake&&window.__mistake('q',x);
  });
}
function TS_resHTML({raw,total,band,label,results,buttons='',partial=false}){
  const p=raw/total, st=p>=.8?'yay':p>=.55?'ok':'hmm';
  const msg=p===1?'Đúng hết.'+(partial?' Thử cả đề 40 câu hoặc đề chuyên gia để đo band chính xác hơn.':''):p>=.8?'Rất tốt. Xem lại vài câu sai rồi thử đề khó hơn.':p>=.55?'Khá ổn. Đọc kỹ phần giải thích các câu sai bên dưới.':'Chưa sao, xem giải thích từng câu sai rồi làm lại sau vài ngày.';
  return `<div class="panel ts-res"><div class="ts-res-top">${typeof mascot==='function'?mascot(st,80):''}
    <div class="ts-res-n"><span class="label">${esc(label)}</span><div class="ts-score num">${raw}<span>/${total}</span></div><div class="ts-bandl">${partial?"Band tham khảo":"Band ước tính"} <b class="num">${fmtBand(band)}</b></div>${partial?`<span class="small muted">Chỉ dựa trên ${total} câu, chưa phải band thật. Cần làm cả đề 40 câu.</span>`:""}${band>=8.5&&!partial?'<span class="small ts-top">Mức này đủ cho yêu cầu 8.5+ của các chương trình khó nhất.</span>':''}</div></div>
    <p class="note">${msg} Bấm vào số câu để xem lại.</p>
    <div class="ts-dots">${results.map(r=>`<button type="button" class="ts-dot ${r.ok?'ok':''}" data-go="${r.k}" aria-label="Câu ${r.n} ${r.ok?'đúng':'sai'}">${r.n}</button>`).join('')}</div>
    ${buttons?`<div class="row">${buttons}</div>`:''}</div>`;
}

/* ================= LISTENING (LS_*) ================= */
let LS_tok=0, LS_tab='parts';
const LS_sleep=ms=>new Promise(r=>setTimeout(r,ms));
const LS_PAUSE='<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="fill:currentColor;stroke:none"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>';
const LS_NOTES={practice:'Nghe lại từng câu thoải mái, dừng khi cần. Nộp bài xong sẽ xem được lời thoại và nghe lại từng dòng.',exam:'Bài nghe phát một lần, không dừng được. Câu hỏi hiện sẵn trong lúc nghe, hết bài có 2 phút kiểm tra lại rồi tự nộp.'};
// speaker of a line; two speakers of the same gender and accent in one part get different voices (f / f2, m / m2)
const LS_spk=(p,id)=>{
  if(!p._spk){const seen={};p._spk={};p.speakers.forEach(sp=>{const k=sp.accent+sp.voice;seen[k]=(seen[k]||0)+1;p._spk[sp.id]=Object.assign({},sp,{voice:seen[k]>1?sp.voice+'2':sp.voice});});}
  return p._spk[id]||p._spk[p.speakers[0].id];
};

  P.ls=P.ls||{};P.ls.best=P.ls.best||{};

  el.innerHTML=`<div class="view"><div class="spread"><h2>Listening</h2><span class="note">${new Set(L.map(p=>p.test)).size} đề, ${L.length} part, ${L.reduce((s,p)=>s+TS_count(p.groups),0)} câu</span></div>

  const xs=tests.filter(LS_isX);

/* runner: one part or a whole test (parts back to back) */
function LS_run(el,o){
  TS_clean();window.scrollTo(0,0);
  const {parts,exam=false,title,onDone,nextLabel,mock=false}=o;
  const onExit=o.onExit||(()=>go('listen'));
  const A={}, multi=parts.length>1;
  const secs=parts.map(p=>({sid:p.id,src:'Listening Test '+p.test+' Part '+p.part,groups:p.groups,start:(p.part-1)*10+1,p}));
  const total=secs.reduce((s,x)=>s+TS_count(x.groups),0);
  const seq=[];parts.forEach((p,pi)=>p.lines.forEach(([sid,t],li)=>seq.push({pi,sp:LS_spk(p,sid),t,pid:p.id,li,n:p.lines.length})));
  const LO=x=>({pid:x.pid,li:x.li,n:x.n,t:x.t,lang:x.sp.accent,voice:x.sp.voice});
  let last=-1,playing=false,pauseReq=false,started=false,done=false,sub=false,results=null,cp=0,chk=null,wait=0;
  const ctl=exam?'':`<button class="spk" id="lsPrev" aria-label="Dòng trước">${ic('chevron-left')}</button><button class="spk" id="lsRep" aria-label="Nghe lại dòng này">${ic('rotate-ccw')}</button><button class="spk" id="lsNext" aria-label="Dòng sau">${ic('chevron-right')}</button>`;
  el.innerHTML=`<div class="view ls-run">
    ${TS_barHTML(title,`<div class="ls-player" id="lsPlayer"><button class="ls-pp" id="lsPlay" aria-label="Phát">${ic('play')}</button>${ctl}<div class="ls-prog"><div class="ls-bar"><i id="lsFill"></i></div><div class="ls-meta" id="lsMeta"></div></div></div>`)}
    ${multi?`<div class="row tabs" id="lsParts">${parts.map((p,i)=>`<button class="chip" data-pt="${i}" aria-pressed="${i===0}">Part ${p.part}</button>`).join('')}</div>`:''}
    ${!multi?`<div class="ls-intro"><span class="pill">${exam?'Như thi thật':'Luyện tập'}</span> ${esc(parts[0].setting)}</div>`:`<div class="ls-intro"><span class="pill">${exam?'Như thi thật':'Luyện tập'}</span> Bốn part nghe liền nhau, giữa các part có 10 giây để đọc trước câu hỏi.</div>`}
    <div id="lsRes"></div>
    <div class="panel ts-qs" id="lsQs"></div>
    <div id="lsTr"></div></div>`;
  const qs=$('#lsQs',el);
  const cnt=()=>{const c=$('#tsCnt',el);if(c)c.textContent=sub?'Đã nộp bài':`Đã làm ${TS_answered(A)}/${total} câu`;};
  const drawQs=()=>{const s=secs[cp];
    qs.innerHTML=`<div class="spread"><h3>Part ${s.p.part}</h3><span class="small muted num">Câu ${s.start}-${s.start+TS_count(s.groups)-1}</span></div>${TS_qHTML(s,A)}`;
    if(results)TS_applyMarks(qs,results.filter(r=>r.sec===s));
    $$('#lsParts [data-pt]',el).forEach(b=>b.setAttribute('aria-pressed',+b.dataset.pt===cp));};
  const upd=()=>{
    if(sub)return;const x=seq[Math.max(0,last)];
    $('#lsFill',el).style.width=(done?100:Math.max(0,last+1)/seq.length*100)+'%';
    const pb=$('#lsPlay',el);
    if(exam){pb.disabled=started;pb.innerHTML=ic('play');}
    else{pb.innerHTML=playing&&!pauseReq?LS_PAUSE:ic('play');pb.setAttribute('aria-label',playing?'Tạm dừng':'Phát');}
    let m;
    if(exam)m=wait?`Đọc trước câu hỏi. Part ${parts[Math.min(parts.length-1,x.pi+1)].part} bắt đầu sau ${wait} giây`:done?'Bài nghe đã kết thúc. Kiểm tra lại câu trả lời.':started?`Đang phát${multi?' Part '+parts[x.pi].part:''}. Bài nghe không dừng được.`:'Bấm nút phát để bắt đầu. Bài nghe chỉ phát một lần.';
    else m=last<0?'Bấm phát để bắt đầu nghe':`Dòng ${last+1}/${seq.length}<span class="ls-who"> · ${esc(x.sp.name)}</span>${pauseReq?' · dừng sau câu này':''}${done&&!playing?' · đã hết bài':''}`;
    $('#lsMeta',el).innerHTML=m;
  };
  async function runFrom(i){
    const my=++LS_tok;stopSay();playing=true;pauseReq=false;started=true;done=false;upd();
    for(let j=i;j<seq.length;j++){
      const x=seq[j];
      if(multi&&x.pi!==cp&&(exam||j===i||x.pi!==seq[j-1].pi)){cp=x.pi;drawQs();}
      if(exam&&j>0&&x.pi!==seq[j-1].pi){last=j-1;for(wait=10;wait>0;wait--){upd();await LS_sleep(1000);if(my!==LS_tok)return;}wait=0;}
      last=j;upd();
      for(let q=1;q<=2;q++){const y=seq[j+q];if(y)prefetchLine(LO(y));}
      await sayLine(LO(x));
      if(my!==LS_tok)return;
      if(pauseReq){pauseReq=false;playing=false;upd();return;}
      const nx=seq[j+1];
      if(nx){await LS_sleep(nx.sp!==x.sp||nx.pi!==x.pi?800:350);if(my!==LS_tok)return;if(pauseReq){pauseReq=false;playing=false;upd();return;}}
    }
    playing=false;done=true;last=seq.length-1;upd();
    if(exam&&!sub)startCheck();
  }
  const halt=()=>{LS_tok++;stopSay();playing=false;pauseReq=false;};
  const startCheck=()=>{const tm=$('#tsTm',el);tm.hidden=false;
    chk=makeTimer(120,l=>{$('#tsTmT',el).textContent=fmtTime(l);tm.classList.toggle('low',l<=30);},()=>{toast('Hết giờ kiểm tra. Bài đã được nộp.');submit();});};
  $('#lsPlay',el).onclick=()=>{
    if(exam){if(!started)runFrom(0);return;}
    if(playing){if(pauseReq){halt();upd();}else{pauseReq=true;upd();}return;}
    runFrom(done||last<0?0:Math.min(seq.length-1,last+1));
  };
  if(!exam){
    $('#lsRep',el).onclick=()=>runFrom(Math.max(0,last));
    $('#lsPrev',el).onclick=()=>runFrom(Math.max(0,last-1));
    $('#lsNext',el).onclick=()=>runFrom(Math.min(seq.length-1,last+1));
  }
  $$('#lsParts [data-pt]',el).forEach(b=>b.onclick=()=>{cp=+b.dataset.pt;drawQs();});
  TS_bind(qs,A,cnt);
  TS_onClean(()=>{halt();chk&&chk.stop();});
  TS_exitBtn($('#tsBack',el),()=>(started||TS_answered(A)>0)&&!sub,onExit);
  $('#tsSub',el).onclick=()=>{if(!sub&&exam&&started&&!done&&TS_answered(A)<total&&!$('#tsSub',el).dataset.arm){$('#tsSub',el).dataset.arm=1;toast('Bài nghe chưa hết. Bấm Nộp bài lần nữa nếu muốn nộp ngay.');return;}submit();};

  function submit(){
    if(sub)return;sub=true;halt();chk&&chk.stop();
    results=secs.flatMap(s=>TS_mark(s,A));
    const raw=results.filter(r=>r.ok).length, sb=TS_secBand('listening',raw,total,{expert:parts[0].test>=7}), band=sb.band, partial=sb.partial;
    P.ls=P.ls||{};P.ls.best=P.ls.best||{};
    secs.forEach(s=>{const r=results.filter(x=>x.sec===s&&x.ok).length;P.ls.best[s.sid]=Math.max(P.ls.best[s.sid]??-1,r);});
    if(multi&&total>=40){P.ls.full=P.ls.full||{};P.ls.full[parts[0].test]=Math.max(P.ls.full[parts[0].test]??-1,raw);}
    TS_log(results);
    award('listen',total);if(total>=40&&!mock)award('test',1);
    recordScore({skill:'listening',band,raw,total,partial,id:multi?'lt'+parts[0].test:parts[0].id,title});
    touch('main');
    $('#tsSub',el).hidden=true;$('#tsTm',el).hidden=true;$('#lsPlayer',el).hidden=true;cnt();
    const btns=onDone?`<button class="btn primary" id="lsNextSec">${esc(nextLabel||'Tiếp tục')} ${ic('chevron-right')}</button>`
      :`<button class="btn primary" id="lsAgain">${ic('rotate-ccw')}Làm lại</button><button class="btn" id="lsList">Về danh sách</button>`;
    $('#lsRes',el).innerHTML=TS_resHTML({raw,total,band,partial,label:title,results,buttons:btns});
    const nb=$('#lsNextSec',el);if(nb)nb.onclick=()=>{TS_clean();onDone(raw,total);};
    const ag=$('#lsAgain',el);if(ag)ag.onclick=()=>LS_run(el,o);
    const li=$('#lsList',el);if(li)li.onclick=()=>{TS_clean();onExit();};
    $$('[data-go]',$('#lsRes',el)).forEach(b=>b.onclick=()=>{const r=results.find(x=>x.k===b.dataset.go);const i=secs.indexOf(r.sec);if(i!==cp){cp=i;drawQs();}const it=$(`[data-item="${r.k}"]`,qs);if(it){it.scrollIntoView({behavior:'smooth',block:'center'});it.classList.remove('ts-flash');void it.offsetWidth;it.classList.add('ts-flash');}});
    cp=0;drawQs();
    const tr=parts.map(p=>`${multi?`<h3 class="ls-trh">Part ${p.part}</h3>`:''}${p.lines.map(([sid,t],li)=>{const sp=LS_spk(p,sid);return `<div class="ls-tl"><button class="spk sm" data-pid="${p.id}" data-li="${li}" data-say="${esc(t)}" data-lang="${esc(sp.accent)}" data-voice="${esc(sp.voice)}" aria-label="Nghe dòng này">${SPK}</button><div class="ls-tlt"><span class="ls-sp">${esc(sp.name)}</span><span class="en-s">${esc(t)}</span></div></div>`;}).join('')}`).join('');
    $('#lsTr',el).innerHTML=exam?`<details class="g"><summary><span class="t">Xem lời thoại (transcript)</span>${ic('chevron-right')}</summary><div class="ls-trb">${tr}</div></details>`
      :`<div class="panel"><div class="spread"><h3>Lời thoại</h3><span class="small muted">Bấm loa để nghe lại từng dòng</span></div><div class="ls-trb">${tr}</div></div>`;
    window.scrollTo({top:0,behavior:'smooth'});
  }
  drawQs();upd();cnt();
}

/* exported for the mock test: all 4 parts of a test as one 40-question exam */
async function TS_listenTest(el,testNo,opts={}){

}

/* ---------- dictation ---------- */
const LS_nw=w=>normAns(w).replace(/[^a-z0-9%]/g,'');
function LS_diff(target,typed){
  const T=target.split(/\s+/).filter(w=>LS_nw(w)), U=typed.split(/\s+/).filter(w=>LS_nw(w));
  const nt=T.map(LS_nw), nu=U.map(LS_nw), m=T.length, n=U.length;
  const d=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)d[i][j]=nt[i]===nu[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const ops=[];let i=0,j=0;
  while(i<m||j<n){
    if(i<m&&j<n&&nt[i]===nu[j]){ops.push(['ok',T[i]]);i++;j++;}
    else if(j<n&&(i>=m||d[i][j+1]>=d[i+1][j])){ops.push(['extra',U[j]]);j++;}
    else{ops.push(['miss',T[i]]);i++;}
  }
  return {ops,ok:ops.filter(x=>x[0]==='ok').length,total:m};
}
function LS_dict(box,L){
  const pool=[];L.forEach(p=>p.lines.forEach(([sid,t],li)=>{const n=countWords(t);if(n>=8&&n<=25)pool.push({t,sp:LS_spk(p,sid),pid:p.id,li,n:p.lines.length,src:'Test '+p.test+' Part '+p.part});}));
  const sess={n:0,perfect:0};let cur=null,checked=false;
  const play=rate=>sayLine({pid:cur.pid,li:cur.li,n:cur.n,t:cur.t,lang:cur.sp.accent,voice:cur.sp.voice,rate});
  const draw=auto=>{
    cur=pick(pool);checked=false;
    box.innerHTML=`<div class="panel ls-dict"><div class="spread"><h3>Chép chính tả</h3><span class="small muted">${esc(cur.src)} · ${countWords(cur.t)} từ</span></div>
      <p class="note">Nghe một câu trong bài thi rồi gõ lại đúng từng từ. Nghe bao nhiêu lần cũng được. Không cần quan tâm chữ hoa và dấu câu.</p>
      <div class="row"><button class="btn primary" id="ldPlay">${ic('volume-2')}Nghe</button><button class="btn" id="ldSlow">${ic('snail')}Nghe chậm</button></div>
      <textarea id="ldIn" rows="3" placeholder="Gõ lại câu bạn nghe được" autocapitalize="off" autocorrect="off" spellcheck="false" class="en-s"></textarea>
      <div class="row"><button class="btn primary" id="ldChk">${ic('check')}Kiểm tra</button><button class="btn ghost" id="ldNext">Câu khác ${ic('chevron-right')}</button></div>
      <div id="ldOut"></div></div>
      <p class="note" id="ldSess">${sess.n?`Phiên này: ${sess.n} câu, ${sess.perfect} câu đúng hoàn toàn.`:'Mỗi câu chép xong được tính vào mục tiêu Nghe hôm nay.'}</p>`;
    $('#ldPlay',box).onclick=()=>play();
    $('#ldSlow',box).onclick=()=>play(Math.max(0.55,(P.settings.voiceRate||0.95)*0.72));
    $('#ldNext',box).onclick=()=>draw(true);
    const inp=$('#ldIn',box);
    inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();check();}};
    $('#ldChk',box).onclick=check;
    if(auto){play();setTimeout(()=>inp.focus(),50);}
  };
  function check(){
    const v=$('#ldIn',box).value;if(!v.trim()){toast('Gõ câu bạn nghe được trước đã.');return;}
    const r=LS_diff(cur.t,v), perfect=r.ok===r.total&&!r.ops.some(x=>x[0]==='extra');
    if(!checked){checked=true;sess.n++;if(perfect)sess.perfect++;award('listen',1);}
    $('#ldOut',box).innerHTML=`<div class="fb ${perfect?'ok':'bad'}"><b>${perfect?'Chính xác từng từ.':`Đúng ${r.ok}/${r.total} từ.`}</b>${perfect?'':' Chữ xanh là từ bạn nghe đúng, chữ đỏ gạch dưới là từ còn thiếu hoặc sai, chữ đỏ gạch ngang là từ thừa.'}</div>
      <div class="ls-diff en-s">${r.ops.map(([t,w])=>`<span class="ls-dw ${t}">${esc(w)}</span>`).join(' ')}</div>
      <div class="ex"><button class="spk" data-pid="${cur.pid}" data-li="${cur.li}" data-say="${esc(cur.t)}" data-lang="${esc(cur.sp.accent)}" data-voice="${esc(cur.sp.voice)}" aria-label="Nghe lại">${SPK}</button><div><div class="small muted">${esc(cur.sp.name)}</div><div class="en-s">${esc(cur.t)}</div></div></div>`;
    $('#ldSess',box).textContent=`Phiên này: ${sess.n} câu, ${sess.perfect} câu đúng hoàn toàn.`;
  }
  draw(false);
}

function RD_home(el,R){
  TS_clean();window.__leave=TS_clean;
  const type=RD_type||examType(), mode=P.rd.mode||'practice', full=P.rd.full||{};
  const tabs=[examType(),examType()==='academic'?'general':'academic'];
  const list=R.filter(p=>p.type===type), tests=[...new Set(list.map(p=>p.test))].sort((a,b)=>a-b);

  const xs=tests.filter(isX);
  el.innerHTML=`<div class="view"><div class="spread"><h2>Reading</h2><span class="note">${tests.length} đề, ${list.length} bài ${RD_TN[type]}</span></div>

  <div class="panel"><div class="spread"><h3>Bài của bạn, đã đánh dấu lỗi</h3><span class="small muted">${countWords(text)} từ</span></div>
    ${r.corrections.length?`<p class="note">Bấm vào chỗ gạch đỏ để xem cách sửa và lý do.</p>`:''}
    <div class="en-s wr-essay">${mk.html}</div>${missList}</div>
  ${r.better?`<div class="panel"><h3>Viết lại đoạn yếu nhất${WR_hi9()?' (band 9)':''}</h3><div class="en-s wr-better">${WR_paras(r.better)}</div></div>`:''}
  ${opts.model===false?'':`<details class="g wr-det" open><summary>${ic('award')} So sánh với bài mẫu band 8 và band 9</summary><div class="wr-dbody">${WR_models(x)}</div></details>`}`;
}
function WR_bindResult(root){
  $$('.wr-err',root).forEach(b=>b.onclick=()=>{const f=b.nextElementSibling;const open=f.hidden;f.hidden=!open;b.setAttribute('aria-expanded',String(open));b.classList.toggle('on',open);});
}

function WR_home(el){

    return `<button class="panel wr-card" data-id="${esc(x.id)}"><span class="pill">${esc(WR_meta(x))}</span><span class="wr-ct${x._k==='t1a'?'':' en'}">${esc(WR_title(x))}</span>${status}</button>`;};

    <div class="spread"><div><h2>Viết</h2><p class="note">Chọn một đề, viết trong phòng yên tĩnh này rồi nộp để AI chấm theo 4 tiêu chí IELTS.</p></div>
      <button class="btn" id="wrExam">${ic('timer')} Thi thử Writing 60 phút</button></div>
    ${subTabs('wrTabs',WR_TABS,WR_tab,t=>{WR_tab=t;WR_home(el);})}
    <div class="wr-grid">${list.map(card).join('')||'<p class="empty">Chưa có đề.</p>'}</div>
    <div class="panel"><h3>${ic('bar-chart')} Lịch sử chấm</h3>
      ${hist.length?`<div class="wr-hl">${hist.map(h=>`<button class="wr-hrow" data-id="${esc(h.id)}"><span class="small muted">${WR_date(h.t)}</span><span class="wr-hrt">${esc(WR_kindName(h.k))}: ${esc(h.title)}</span><b>${fmtBand(h.r.overall)}</b></button>`).join('')}</div>`:'<p class="note">Bạn chưa nộp bài nào để chấm. Bài đã chấm sẽ hiện ở đây.</p>'}
    </div>

/* ---------- task room ---------- */
function WR_open(el,id,showHist){
  const x=WR_find(id); if(!x){WR_home(el);return;}
  const st=WR_st(), target=WR_target(x); let timer=null, awarded=false, busy=false;
  const flush=()=>{if(WR_saveT){clearTimeout(WR_saveT);WR_saveT=null;touch('main');}};
  window.__leave=()=>{if(timer)timer.stop();flush();};
  el.innerHTML=`<div class="view wr-room">
    <div class="spread"><button class="btn ghost sm" id="wrBack">${ic('chevron-left')} Danh sách đề</button><span class="pill">${esc(WR_kindName(x._k))} · ${esc(WR_meta(x))}</span></div>
    <div class="wr-task">
      <section class="wr-pa panel"><div class="label">Đề bài</div>${WR_promptHTML(x)}${x._k==='t1a'?WR_chartSVG(x.chart):''}</section>
      <section class="wr-wa panel">
        <div class="spread wr-bar"><span class="wr-wc" id="wrWc"></span><div class="row" id="wrTm"></div></div>
        <textarea id="wrTx" class="wr-tx en-s" spellcheck="false" autocomplete="off" autocorrect="off" placeholder="${x._k==='t1g'?'Dear ...':'Viết bài của bạn bằng tiếng Anh ở đây...'}" aria-label="Bài viết"></textarea>
        <div class="spread"><button class="btn primary" id="wrSub">${ic('sparkles')} Nộp bài và chấm</button><span class="small muted" id="wrSaved">Bài nháp tự lưu</span></div>
        <p class="note no-ai">AI chấm bài cần mật khẩu nhóm và máy chủ đã cấu hình. Bạn vẫn có thể nộp để so sánh với bài mẫu.</p>
      </section>
      <section class="wr-ha">${WR_helpHTML(x)}</section>
    </div>
    <div id="wrOut" class="wr-out"></div>
    <div id="wrHist"></div>
  </div>`;
  refreshAIBits();
  const tx=$('#wrTx',el); tx.value=st.drafts[x.id]||'';
  const wc=()=>{const n=countWords(tx.value);const w=$('#wrWc',el);w.innerHTML=`<b>${n}</b> / ${target} từ`;w.classList.toggle('ok',n>=target);};
  wc();
  tx.oninput=()=>{wc();st.drafts[x.id]=tx.value;clearTimeout(WR_saveT);$('#wrSaved',el).textContent='Đang lưu...';
    WR_saveT=setTimeout(()=>{WR_saveT=null;touch('main');const s=$('#wrSaved',el);if(s)s.textContent='Đã lưu bản nháp';},900);};
  $('#wrBack',el).onclick=()=>{if(timer)timer.stop();flush();WR_home(el);window.scrollTo(0,0);};
  const drawTm=()=>{const box=$('#wrTm',el);
    box.innerHTML=`<button class="chip" data-tm="${WR_mins(x)*60}">${ic('timer')} ${WR_mins(x)} phút</button><button class="chip" data-tm="0" aria-pressed="true">Không giới hạn</button>`;
    $$('[data-tm]',box).forEach(b=>b.onclick=()=>{const s=+b.dataset.tm;if(!s)return;
      box.innerHTML=`<span class="timer-chip" id="wrTc">${ic('clock')} <span>${fmtTime(s)}</span></span><button class="btn ghost sm" id="wrTs">Dừng</button>`;
      timer=makeTimer(s,left=>{const c=$('#wrTc',el);if(!c){timer&&timer.stop();return;}$('span',c).textContent=fmtTime(left);c.classList.toggle('low',left<=180);},
        ()=>{toast('Hết giờ. Trong phòng thi bài sẽ bị thu lúc này. Bạn vẫn có thể viết nốt để luyện.',4200);});
      $('#wrTs',el).onclick=()=>{timer&&timer.stop();timer=null;drawTm();};
      tx.focus();});};
  drawTm();
  const out=$('#wrOut',el);
  const showModelOnly=text=>{
    out.innerHTML=`<div class="panel">${mcSay('calm','Bài đã được lưu. Hãy đọc bài mẫu và tự so sánh: bố cục, câu tổng quan, từ nối và cách dùng từ.',56)}
      <p class="note">${AI?'':'AI chấm bài cần mật khẩu nhóm (nhập ở phần Cài đặt) và máy chủ có cấu hình AI. Khi có AI, bạn sẽ nhận band theo 4 tiêu chí và từng lỗi được sửa.'}</p></div>
      <div class="grid2 wr-cmp"><div class="panel"><h3>Bài của bạn</h3><div class="en-s wr-essay">${esc(text)}</div></div>
      <div class="panel"><h3>Bài mẫu</h3>${WR_models(x)}</div></div>`;
  };
  const run=async text=>{
    busy=true; const b=$('#wrSub',el); if(b)b.disabled=true;
    out.innerHTML=`<div class="panel wr-load">${mascot('idea',84)}<div><b>Jack đang chấm bài, khoảng 20-40 giây</b><p class="note">Bạn cứ để trang này mở. Bài nháp vẫn được giữ nguyên.</p><div class="wr-bar-ld"><i></i></div></div></div>`;
    out.scrollIntoView({behavior:'smooth',block:'start'});
    try{
      const r=await WR_grade(x,text); if(!el.isConnected)return;
      WR_saveHist(x,text,r);
      out.innerHTML=WR_resultHTML(x,text,r); WR_bindResult(out); drawHist();
      if(r.overall>=7&&typeof confetti==='function')confetti();
    }catch(e){ if(!el.isConnected)return;
      out.innerHTML=`<div class="panel">${mcSay('hmm',esc(aiError(e)),56)}<div class="row"><button class="btn primary" id="wrRetry">${ic('rotate-ccw')} Chấm lại</button><button class="btn" id="wrMod">Xem bài mẫu</button></div><p class="note">Bài của bạn vẫn còn trong ô viết.</p></div>`;
      $('#wrRetry',out).onclick=()=>run(text); $('#wrMod',out).onclick=()=>showModelOnly(text);
    }
    busy=false; const b2=$('#wrSub',el); if(b2)b2.disabled=false;
  };
  $('#wrSub',el).onclick=()=>{
    if(busy)return; const text=tx.value.trim(), n=countWords(text);
    if(n<50){toast(`Bài mới có ${n} từ. Viết ít nhất 50 từ rồi nộp nhé.`);tx.focus();return;}
    flush(); if(timer){timer.stop();timer=null;drawTm();}
    if(!awarded){award('write',1);awarded=true;}
    if(!AI){st.done[x.id]=st.done[x.id]||Date.now();touch('main');showModelOnly(text);out.scrollIntoView({behavior:'smooth',block:'start'});return;}
    run(text);
  };
  const drawHist=()=>{
    const hs=st.hist.filter(h=>h.id===x.id).reverse(), box=$('#wrHist',el); if(!box)return;
    box.innerHTML=hs.length?`<div class="panel"><h3>Lịch sử chấm đề này</h3><div class="wr-hl">${hs.map((h,i)=>`<button class="wr-hrow" data-hi="${i}"><span class="small muted">${WR_date(h.t)}</span><span class="wr-hrt">${h.words} từ</span><b>${fmtBand(h.r.overall)}</b></button>`).join('')}</div></div>`:'';
    $$('[data-hi]',box).forEach(b=>b.onclick=()=>{const h=hs[+b.dataset.hi];out.innerHTML=`<div class="spread"><span class="label">Bài chấm ngày ${WR_date(h.t)}</span></div>`+WR_resultHTML(x,h.text,h.r);WR_bindResult(out);out.scrollIntoView({behavior:'smooth',block:'start'});});
  };
  drawHist();
  if(showHist){const h=WR_lastHist(x.id);if(h){out.innerHTML=WR_resultHTML(x,h.text,h.r);WR_bindResult(out);}}
}
