<style>
/* Catalis layout: sidebar on desktop, bottom nav on mobile, one content column. Navy accent + orange highlight. */
:root{

  --ok:#1A8048; --ok-soft:#DFF3E6; --ok-ink:#0E4D2A; --bad:#C2413A; --bad-soft:#FBE6E4; --bad-ink:#7A1F1A; --warn:#B7791F;
  --xp:#FFC857; --xp-ink:#3D2A00; --streak-1:#FFB020; --streak-2:#FF6A1A; --seal:#E8821E;

  --sh-1:0 1px 2px rgba(20,27,46,.05),0 2px 8px rgba(20,27,46,.05); --sh-2:0 2px 4px rgba(20,27,46,.06),0 8px 24px rgba(20,27,46,.09);
  --f-han:"Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-py:"Noto Sans","Segoe UI",Arial,sans-serif;
  --f-en:"Source Serif 4","Georgia",serif;
  --r-sm:10px; --r:16px; --r-lg:20px; --r-xl:28px;
  --ease:cubic-bezier(.2,0,0,1); --ease-out:cubic-bezier(.2,.8,.2,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

}}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}

button{cursor:pointer}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.han{font-family:var(--f-han)}
.py{font-family:var(--f-py)}
ruby rt{font-family:var(--f-py);font-size:max(11px,.45em);font-weight:500;letter-spacing:0}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
body.mono .t1,body.mono .t2,body.mono .t3,body.mono .t4,body.mono .t5{color:inherit}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}

/* shell: sidebar (>=900px) + top bar + bottom nav (<900px) */
.app{display:flex;min-height:100dvh}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.side{display:none}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1080px;margin:0 auto;height:56px;display:flex;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top h1{font-size:19px;font-weight:800;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.brand-sm{border:0;background:none;padding:0;width:40px;height:40px;display:grid;place-items:center;flex:none}
.brand-mc svg{display:block}
.tools{display:flex;gap:6px;align-items:center}
.chip-st,.chip-xp{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 10px;border-radius:999px;background:var(--surface);box-shadow:var(--sh-1);font-weight:800;font-size:15px;border:0;white-space:nowrap}
.chip-st .i{width:20px;height:20px;stroke:none}
.chip-st.cold .i{fill:var(--line2)}
.chip-xp{color:var(--xp-ink);background:var(--xp)}
.chip-xp .i{width:16px;height:16px;fill:currentColor;stroke:none}
.aa-btn{width:40px;height:40px;border-radius:999px;border:0;background:var(--surface);box-shadow:var(--sh-1);font-weight:800;font-size:15px}
.sync{font-size:12.5px;border-radius:999px;padding:4px 10px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;background:var(--sunk)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)}
.subnav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:1080px;width:100%;margin:0 auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.subnav::-webkit-scrollbar{display:none}
.subnav:empty{display:none}
.subnav button{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:650;font-size:14.5px;color:var(--ink)}
.subnav button .i{width:17px;height:17px;color:var(--muted)}
.subnav button[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.subnav button[aria-selected="true"] .i{color:var(--accent)}
main{max-width:1080px;width:100%;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);padding:4px max(4px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-top:1px solid var(--line)}
.bnav button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;font-size:12px;font-weight:650;color:var(--muted);padding:0}
.bnav .ind{width:56px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background-color .2s var(--ease)}
.bnav .i{width:23px;height:23px}
.bnav button[aria-current="page"]{color:var(--accent)}
.bnav button[aria-current="page"] .ind{background:var(--accent-soft)}
.bnav button[aria-current="page"] .i{stroke-width:2.4}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--t1);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;line-height:1}
@media (min-width:900px){
  .bnav{display:none}
  .side{display:flex;flex-direction:column;gap:6px;width:248px;flex:none;position:sticky;top:0;height:100dvh;padding:18px 14px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--surface) 55%,var(--bg))}
  .brand-sm{display:none}
  main{padding-bottom:64px}
  .top-in{height:64px}
  .top h1{font-size:22px}
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px;cursor:pointer}
.brand-t{display:flex;flex-direction:column;line-height:1.2}
.brand-t b{font-size:20px;font-weight:800;letter-spacing:-.01em}
.brand-t span{font-size:12.5px;color:var(--muted)}
.brand-t .han{color:var(--accent);font-weight:700;font-size:14px}
.side-nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;scrollbar-width:thin}
.side-nav .g{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;border:0;background:none;font-weight:650;font-size:15px;text-align:left;color:var(--ink);position:relative}
.side-nav .g:hover{background:var(--sunk)}
.side-nav .g[aria-current="page"]{color:var(--accent)}
.side-nav .g .badge{position:static;margin-left:auto}
.side-nav .sub{display:flex;flex-direction:column;gap:1px;margin:0 0 6px}
.side-nav .sub button{min-height:36px;padding:0 12px 0 44px;border-radius:10px;border:0;background:none;text-align:left;font-size:14.5px;color:var(--muted);font-weight:550}
.side-nav .sub button:hover{background:var(--sunk);color:var(--ink)}
.side-nav .sub button[aria-current="page"],.side-nav .g.solo[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.side-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.view{display:flex;flex-direction:column;gap:16px}
h2{font-size:20px;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:15px;margin:0}
.label{font-size:13px;color:var(--muted);font-weight:650}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:0;box-shadow:var(--sh-1);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chip{border:1.5px solid var(--line2);background:var(--surface);border-radius:999px;min-height:36px;padding:0 14px;font-size:14px;font-weight:600;position:relative}
.chip::after{content:"";position:absolute;inset:-4px}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.btn{border:1.5px solid var(--line2);background:var(--surface);border-radius:14px;min-height:44px;padding:0 18px;font-weight:650;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 3px 0 var(--accent-lo);font-weight:700}
.btn.primary:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--accent-lo)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;font-weight:600;border-radius:12px;position:relative}
.btn.sm::after{content:"";position:absolute;inset:-4px}
.btn.ghost{border-color:transparent;background:transparent}
.pill{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ai{background:var(--accent-soft);color:var(--accent)}
.kbd{font-family:var(--f-py);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
input[type=text],input[type=search],input[type=number],select,textarea{border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:8px 12px;min-width:0}
textarea{resize:vertical;width:100%}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;flex:none;padding:0}
.spk svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note{font-size:14px;color:var(--muted);margin:0}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r)}
.bar-track{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14.5px;font-weight:550;z-index:70;max-width:calc(100% - 32px);box-shadow:var(--sh-2);animation:toastIn .22s var(--ease-out)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}
@media (min-width:900px){.toast{bottom:28px}}

/* home */
.wotd{display:flex;gap:14px;align-items:center}
.wotd .em{font-size:44px;line-height:1}
.wotd .h{font-size:34px;font-weight:700;line-height:1.1}
.lvrow{display:grid;grid-template-columns:62px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;overflow-x:auto}
.heat i{width:11px;height:11px;border-radius:2px;background:var(--heat0)}
.heat i.h1{background:var(--heat1)}.heat i.h2{background:var(--heat2)}.heat i.h3{background:var(--heat3)}.heat i.h4{background:var(--heat4)}

/* study card */
.study{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
@media (max-width:820px){.study{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:0;border-radius:var(--r-lg);padding:28px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-height:360px;position:relative;box-shadow:var(--shadow)}
.card .corner{position:absolute;top:12px;left:14px;display:flex;gap:6px}
.card .corner-r{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.card .emo{font-size:56px;line-height:1.1;min-height:8px}
.card .big{font-size:clamp(56px,13vw,96px);line-height:1.12;font-weight:700;letter-spacing:.03em;overflow-wrap:anywhere}
.card .bigpy{font-size:22px;font-weight:500}
.card .hv{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

.card .ex{margin-top:6px;padding-top:12px;border-top:1px dashed var(--line);width:100%;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;text-align:left}
.ex .zh{font-size:19px}
.ex .pyl{font-size:13.5px}
.ex .vil{font-size:14px;color:var(--muted)}
.prompt-vi{font-size:26px;font-weight:700;max-width:30ch}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate .btn{flex-direction:column;gap:0;padding:8px 4px}
.rate small{font-weight:400;font-size:11.5px;color:var(--muted)}
.rate .r0{border-color:var(--bad)}.rate .r3{border-color:var(--ok)}
.card .done{padding:36px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}

/* dictionary */
.dict-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dict-tools input{flex:1 1 220px}
.wlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.wrow{display:grid;grid-template-columns:28px minmax(70px,auto) minmax(90px,140px) minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}

@media (max-width:600px){.wrow{grid-template-columns:24px auto minmax(0,1fr)}.wrow .p{display:none}.wrow .v{grid-column:3}.wrow .st{display:none}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line2);display:inline-block}
.dot.s1{background:var(--warn)}.dot.s2{background:var(--accent)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:16px;width:min(680px,100%);padding:22px;display:flex;flex-direction:column;gap:14px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .x{position:absolute;top:10px;right:10px}
.wd-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.wd-head .h{font-size:64px;font-weight:700;line-height:1}
.wd-head .em{font-size:52px}
.strokes{display:flex;gap:10px;flex-wrap:wrap}
.strokes .box{width:110px;height:110px;border:1px solid var(--line);border-radius:10px;background:var(--surface);position:relative}
.strokes .box svg{display:block}
.illus{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;max-width:420px}
.illus img{display:block;width:100%;height:auto}
.ai-out{white-space:pre-wrap;font-size:14.5px;background:var(--sunk);border-radius:10px;padding:12px 14px}

/* writing */
.write-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:700px){.write-wrap{grid-template-columns:minmax(0,1fr)}}
.wpad{width:min(320px,86vw);height:min(320px,86vw);border:1px solid var(--line2);border-radius:14px;background:var(--surface);position:relative;touch-action:none;margin:0 auto}
.wpad svg.grid{position:absolute;inset:0;pointer-events:none}
.wpad .hw{position:absolute;inset:0}

/* grammar */
.g{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.g>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;gap:10px;align-items:center}
.g>summary::-webkit-details-marker{display:none}
.g>summary .t{font-weight:600;flex:1;min-width:0}
.g[open]>summary{border-bottom:1px solid var(--line)}
.g .body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.formula{font-family:var(--f-py);background:var(--sunk);border-radius:8px;padding:8px 12px;font-size:14px;overflow-x:auto}
.vn{font-size:13.5px;background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.gq{border:1px dashed var(--line2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line2);display:inline-grid;place-items:center;flex:none;font-size:12px}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* quiz options shared */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;min-height:44px}
.opt:disabled{opacity:1}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt .zh{font-size:17px}

/* test */
.tcard{display:flex;flex-direction:column;gap:6px}
.runner-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:var(--shadow)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.timer.low{color:var(--bad)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.q .qn{font-weight:700;color:var(--muted);font-size:13px}
.q .text{font-size:18px;line-height:1.75}
.q .stmt{font-size:17px}
.q .w{font-size:13.5px;background:var(--sunk);border-radius:8px;padding:8px 12px}
.q.r-ok{border-color:var(--ok)}.q.r-bad{border-color:var(--bad)}
.pieces{display:flex;flex-wrap:wrap;gap:6px}
.piece{border:1px solid var(--line2);background:var(--sunk);border-radius:8px;padding:6px 10px;font-family:var(--f-han);font-size:18px}
.piece.used{opacity:.3}
.built{min-height:46px;border:1.5px dashed var(--line2);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.score .s{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.score .s b{font-size:28px;display:block;font-variant-numeric:tabular-nums}
.play{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.audio-lines{font-size:15px;background:var(--sunk);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}

/* chat */
.chat{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.chat{grid-template-columns:minmax(0,1fr)}}
.scen{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow-y:auto}
.scen button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;text-align:left;display:flex;gap:10px;align-items:center}
.scen button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.scen .e{font-size:20px}
.convo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:480px}
.msgs{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:62vh}
.msg{max-width:88%;display:flex;flex-direction:column;gap:4px}
.msg.me{align-self:flex-end;align-items:flex-end}
.bubble{border-radius:14px;padding:10px 13px;background:var(--sunk)}
.msg.me .bubble{background:var(--accent);color:var(--accent-ink)}
.bubble .zh{font-size:19px;line-height:1.9}
.bubble ruby rt{font-family:var(--f-py);font-size:10.5px;color:var(--muted)}
.bubble .vi{font-size:13.5px;color:var(--muted);margin-top:4px}
.fix{font-size:13px;border-left:3px solid var(--warn);padding:4px 10px;background:color-mix(in srgb,var(--warn) 10%,var(--surface));border-radius:0 8px 8px 0;max-width:100%}
.composer{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
.composer .row textarea{flex:1;min-height:44px}
.hints{display:flex;flex-wrap:wrap;gap:6px}
.hints button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-family:var(--f-han);font-size:15px}
.typing{color:var(--muted);font-size:13px}

/* tones */
.tones{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:760px){.tones{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tone{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left}
.tone svg{width:100%;height:auto}
.tone .tn{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tonebtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tonebtns .btn{font-size:20px;font-family:var(--f-py)}
@media (prefers-reduced-motion:no-preference){.opt,.card,.btn{transition:border-color .15s,background .15s}}

@media (max-width:560px){.sync-t{display:none}.sync{padding:6px}}

/* strokes */
.steps{display:flex;flex-wrap:wrap;gap:6px}
.step{width:76px;height:76px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:3px;position:relative}
.step svg{width:100%;height:100%;display:block}
.step .num{position:absolute;left:4px;top:2px;font-size:10px;color:var(--muted)}
.rule{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start}
.rn{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700}
.rx{font-size:18px}
.lnk{border:0;background:none;padding:0 2px;color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px}
.stypes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.stypes{grid-template-columns:minmax(0,1fr)}}
.stype{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:center}
.sx{font-size:30px;text-align:center}
/* pinyin */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pk{font-size:26px;font-weight:700;color:var(--accent)}
.pexs{display:flex;flex-wrap:wrap;gap:6px}
.pex{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:4px 9px;font-size:13.5px;text-align:left}
.pex .han{font-size:17px}
.ptable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:70vh}
.ptable{border-collapse:collapse;font-size:12.5px}
.ptable th{position:sticky;top:0;background:var(--sunk);padding:5px 6px;font-weight:600;z-index:1}
.ptable tbody th{left:0;z-index:2}
.ptable td{border:1px solid var(--line);padding:0}
.ptable td button{border:0;background:none;padding:5px 6px;width:100%;white-space:nowrap}
.ptable td button:hover{background:var(--accent-soft)}
/* radicals */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;text-align:center}
.rcard:hover{border-color:var(--accent)}
.rnum{position:absolute;top:5px;left:8px;font-size:10.5px;color:var(--muted)}
.rch{font-size:38px;line-height:1.15}
.rv{font-size:15px;color:var(--muted);min-height:18px}
.rhv{font-weight:700;text-transform:capitalize}

.mk-ok{color:var(--ok)} .mk-bad{color:var(--bad);text-decoration:underline wavy;text-underline-offset:5px}
.reader{max-width:780px}
.rtext{display:flex;flex-direction:column;gap:14px}
.rpara p{margin:0}
.rpara .han{font-size:22px;line-height:2.1}
.rpara ruby rt{font-family:var(--f-py);font-size:11px;color:var(--muted)}
.rvi{color:var(--muted);font-size:15px;margin-top:4px!important}
.rw{cursor:pointer;border-radius:4px}
.rw:hover{background:var(--accent-soft)}
.rlook{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:6px;z-index:6}
.rpara .spk{width:28px;height:28px;vertical-align:middle;margin-left:4px}
.rpara .spk svg{width:13px;height:13px}

/* pitch trainer */
.pt{display:flex;flex-direction:column;gap:12px;min-width:0}
.pt-pick{display:flex;flex-direction:column;gap:10px;min-width:0}
.pt-pick input[type=search]{width:100%}
.pt-tones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pt-tb{flex-direction:column;gap:0;padding:8px 4px}
.pt-tb .han{font-size:24px;font-weight:700;line-height:1.2}
.pt-tb .py{font-size:14px;font-weight:500}
.pt-tb[aria-pressed="true"],.pt-pc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pt-grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:440px}
.pt-pc{flex-direction:column;gap:0;font-weight:700;padding:6px 2px}
.pt-pc .py{font-size:11.5px;font-weight:400}
.pt-rc{display:inline-flex;gap:4px;align-items:baseline}
.pt-rc .han{font-size:17px}
.pt-item{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.pt-word{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.pt-h{font-size:40px;font-weight:700;line-height:1.1}
.pt-p{font-size:20px;font-weight:500}
.pt-btns{display:flex;flex-wrap:wrap;gap:8px}
.pt-btns .btn{flex:1 1 auto}
.pt-on{background:var(--bad)!important;border-color:var(--bad)!important;color:var(--accent-ink)!important}
.pt-dot{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block;animation:pt-blink 1s infinite}
@keyframes pt-blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pt-dot{animation:none}}
.pt-bar{max-width:320px}
.pt-msg{font-size:13.5px;background:var(--sunk);border-left:3px solid var(--warn);border-radius:8px;padding:10px 12px}
.pt-chart{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:640px}
.pt-chart svg{width:100%;max-width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pt-chart svg text{font-family:var(--f-py)}
.pt-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.pt-legend span{display:inline-flex;align-items:center;gap:6px}
.pt-k{display:inline-block;width:22px;height:0;border-top:3px solid var(--accent)}
.pt-km{border-top-color:var(--t4)}
.pt-ki{border-top:2px dashed var(--muted)}
.pt-total{display:flex;align-items:baseline;gap:8px}
.pt-total b{font-size:30px;line-height:1}
.pt-fbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pt-fbc{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px;min-width:0}
.pt-fbh{display:flex;align-items:baseline;gap:8px}
.pt-fbh .py{font-size:18px;font-weight:600}
.pt-sc{margin-left:auto;font-weight:700;font-size:15px;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.pt-sc.ok{color:var(--ok)}.pt-sc.mid{color:var(--warn)}.pt-sc.low{color:var(--bad)}
.pt-tipbox{font-size:13.5px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 12px}

/* games */
.gm-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.gm-cards{grid-template-columns:minmax(0,1fr)}}
.gm-card{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.gm-card:hover{border-color:var(--accent)}
.gm-ic{flex:none;width:56px;height:56px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:30px;font-weight:700}
.gm-ct{display:flex;flex-direction:column;gap:4px;min-width:0;align-items:flex-start}
.gm-ct b{font-size:16px}
.gm-board{display:flex;flex-direction:column}
.gm-brow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.gm-brow:first-child{border-top:0}
.gm-bic{width:32px;height:32px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-size:17px}
.gm-bname{display:flex;flex-direction:column;line-height:1.3;font-weight:600;min-width:0}
.gm-brow b{font-size:20px}
.gm-stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px;min-height:520px;box-shadow:var(--shadow);min-width:0}
.gm-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gm-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm-hud{display:flex;align-items:center;gap:12px;margin-left:auto}
.gm-pts{font-size:22px;font-weight:700;min-width:2ch;text-align:right}
.gm-body{display:flex;flex-direction:column;gap:14px;flex:1;min-width:0}
.gm-start,.gm-end{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:18px 4px}
.gm-bigic{width:88px;height:88px;border-radius:22px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:50px;font-weight:700}
.gm-rules{text-align:left;max-width:480px;margin:0;padding-left:20px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
.gm-go{min-width:180px;font-size:16px;padding:12px 22px}
.gm-count{flex:1;display:grid;place-items:center;min-height:340px}
.gm-count span{font-size:96px;font-weight:700;color:var(--accent)}
.gm-tbar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.gm-tbar i{display:block;height:100%;width:100%;background:var(--accent);border-radius:4px}
.gm-tbar.low i{background:var(--bad)}
.gm-sp{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:190px;gap:6px}
.gm-combo{min-height:26px}
.gm-cb{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.gm-cb.hot{background:color-mix(in srgb,var(--warn) 20%,var(--surface));color:var(--warn)}
.gm-word{--n:2;font-size:clamp(40px,calc(96px - var(--n) * 10px),86px);font-weight:700;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.gm-fxh{position:absolute;right:12%;top:30%;pointer-events:none}
.gm-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gm-opt{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:60px;font-size:15px;min-width:0;overflow-wrap:anywhere}
.gm-opt:hover{border-color:var(--accent)}
.gm-k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--sunk);color:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:700}
.gm-opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.gm-opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.gm-float{position:absolute;font-weight:700;font-size:15px;white-space:nowrap;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis;pointer-events:none;z-index:3;padding:2px 8px;border-radius:8px;background:var(--surface);box-shadow:var(--shadow)}
.gm-fxh .gm-float{font-size:22px;background:transparent;box-shadow:none}
.gm-float.ok{color:var(--ok)}.gm-float.bad{color:var(--bad)}
.gm-mround{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gm-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:600px){.gm-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}}
.gm-mc{min-height:88px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;display:grid;place-items:center;text-align:center;min-width:0;overflow-wrap:anywhere;line-height:1.3}
.gm-mc.is-h{font-size:28px;font-weight:700;background:var(--sunk)}
.gm-mc.is-v{font-size:13.5px}
.gm-mc.sel{border-color:var(--accent);background:var(--accent-soft)}
.gm-mc.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.gm-mc.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.gm-mc.gone{visibility:hidden;opacity:0}
.gm-field{position:relative;height:clamp(300px,52vh,460px);overflow:hidden;border:1px solid var(--line);border-radius:12px;background:linear-gradient(var(--sunk),color-mix(in srgb,var(--sunk) 40%,var(--surface)))}
.gm-floor{position:absolute;left:0;right:0;bottom:0;height:6px;background:color-mix(in srgb,var(--bad) 45%,transparent)}
.gm-drop{position:absolute;left:0;top:0;font-size:28px;font-weight:700;padding:2px 10px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;box-shadow:var(--shadow);white-space:nowrap;will-change:transform;z-index:1}
.gm-drop.hit,.gm-drop.target{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gm-type{display:flex;gap:8px}
.gm-type input{flex:1;font-size:18px;font-family:var(--f-py);padding:10px 14px;min-width:0}
.gm-lives{display:flex;gap:2px;font-style:normal}
.gm-lives i{font-style:normal;color:var(--line2);font-size:17px}
.gm-lives i.on{color:var(--bad)}
.gm-tone{display:flex;flex-direction:column;gap:14px}
.gm-tq{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:6px}

.cele-btn{background:#fff;color:#22346E;border:0;min-height:52px;min-width:200px;font-weight:800;font-size:16px;border-radius:16px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.mc-cele.goal .cele-btn{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-lo)}
.in-opts{display:flex;flex-direction:column;gap:8px;width:100%}
.in-opts .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5);color:#fff;min-height:52px}
.hats{display:flex;justify-content:center;gap:2px;margin:4px 0 8px}
.stamp{font-size:44px;font-weight:700;color:#fff;background:var(--seal);padding:6px 14px;border-radius:12px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.45);letter-spacing:.08em;animation:stamp .38s var(--ease-out) .25s both}
@keyframes stamp{from{transform:scale(1.7) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(-3deg);opacity:1}}
.cele-st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:6px 0}
.cele-st>div{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--sunk);border-radius:16px;padding:12px 6px;animation:celeIn .3s var(--ease-spring) both}
.cele-st>div:nth-child(2){animation-delay:.12s}.cele-st>div:nth-child(3){animation-delay:.24s}
.cele-st b{font-size:24px;font-weight:800}
.cele-st span:last-child{font-size:13px;color:var(--muted)}
.cele-st .st-i{margin:0}

/* study card */
.card.tap{cursor:pointer}
.card.back-in{animation:flipIn .32s var(--ease-out)}
@keyframes flipIn{from{transform:perspective(900px) rotateY(-14deg);opacity:.5}}
.rate-bar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:10px 0 4px;margin-top:6px!important}
@media (min-width:900px){.rate-bar{bottom:0;padding-bottom:12px}}
.rate.three{grid-template-columns:1fr 1fr 1fr}
.rate .btn{min-height:58px;gap:2px;flex-direction:column}
.rate .btn .i{width:18px;height:18px}
.rate .r0{border-color:var(--bad);color:var(--bad-ink);background:var(--bad-soft)}
.rate .r0 small{color:inherit;opacity:.8}
.rate .r2{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink)}
.rate .r3{border-color:var(--ok);background:var(--ok);color:#fff}
.rate .r3 small,.rate .r2 small{color:inherit;opacity:.85}
.card .emo{font-size:40px}
.done .mc-wrap{margin-bottom:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* profiles + study group */
.pf{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.pf-l{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:650}
.pf-l input{min-height:48px;font-size:16px;border-radius:14px}
.pf-n{font-size:13px;margin:0;opacity:.85}
.mc-cele.intro .pf-l input{background:rgba(255,255,255,.95);color:#16201B;border:0}
.board{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.bd-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.bd-row:last-child{border-bottom:0}
.bd-row.me{background:var(--accent-soft)}
.bd-pos{width:22px;font-weight:800;font-size:17px;color:var(--muted);text-align:center;flex:none}
.bd-row:first-child .bd-pos{color:var(--t2)}
.bd-mc{flex:none}
.bd-n{display:flex;flex-direction:column;flex:1;min-width:0;line-height:1.35}
.bd-n b{font-size:16px}
.bd-st{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.bd-x,.bd-f{display:inline-flex;align-items:center;gap:3px;font-weight:800;font-size:15px}
.bd-x .i{width:16px;height:16px;fill:var(--xp);stroke:var(--xp-ink);stroke-width:1.5}
.bd-f .i{width:16px;height:16px;fill:url(#flameG);stroke:none}
.bd-f.cold{color:var(--muted)}.bd-f.cold .i{fill:var(--line2)}
.inv{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.fr-mini{border:0;text-align:left;gap:8px}
.fr-r{display:flex;align-items:center;gap:8px;font-size:15px}
.fr-r>.num:first-child{width:16px;color:var(--muted);font-weight:800}
.fr-r b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr-r.me b{color:var(--accent)}
.fr-mc svg{display:block}

/* phrase decks: phrases are longer than single words */
.card .big.ph{font-size:clamp(30px,7.5vw,48px);letter-spacing:0;margin-top:36px}
.card:has(.big.ph) .corner{max-width:calc(100% - 110px);flex-wrap:wrap}

/* ===== Catalis core additions (English text, vocab cards, band widgets, quiz) ===== */
.en{font-family:var(--f-body);letter-spacing:-.01em}
.en-s{font-family:var(--f-en);font-size:17px;line-height:1.6}
.ipa{font-family:var(--f-py);color:var(--muted);font-size:15px}
.card .big.en{font-size:44px;font-weight:700;line-height:1.15;text-align:center;overflow-wrap:anywhere}
@media (max-width:600px){.card .big.en{font-size:36px}}
.card .ipa{font-size:18px}
.cols{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cl-chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:3px 10px;font-size:14px;color:var(--ink)}
button.cl-chip{cursor:pointer}
.modal .cols{justify-content:flex-start}
mark{background:var(--orange-soft);color:inherit;border-radius:4px;padding:0 2px}
.wd-head .h.en{font-size:34px;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.wrow.en-row{grid-template-columns:28px minmax(0,1.1fr) minmax(0,.9fr) minmax(0,2fr) auto}
.wrow.en-row .h{font-size:17px;font-weight:700}
.wrow.en-row .p{font-family:var(--f-py);color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.wrow.en-row{grid-template-columns:24px minmax(0,1fr) auto}.wrow.en-row .p,.wrow.en-row .v{grid-column:2/4}}
.lvchips .chip{white-space:nowrap}
.brand-t span{font-style:italic}
.seal-rk{font-size:14px;letter-spacing:.02em}
.stamp{font-size:30px}
.rk-n{font-weight:700;font-size:12.5px}
.band-mini .label{margin:0}
.bm-row{display:flex;align-items:baseline;gap:10px}
.bm-arrow{color:var(--muted);font-weight:700}
.bm-t{font-size:22px;font-weight:800;color:var(--orange)}
.bands{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:560px){.bands{grid-template-columns:repeat(2,minmax(0,1fr))}.bd-c.ov{grid-column:1/-1}}
.bd-c{background:var(--sunk);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.bd-c b{font-size:26px;font-weight:800;line-height:1.1}
.bd-c.ov{background:var(--accent);color:var(--accent-ink)}
.sc-list{display:flex;flex-direction:column;margin-top:6px}
.band-big{font-size:56px;font-weight:800;color:var(--accent);line-height:1}
.place-res{flex-direction:row;align-items:center;gap:16px}
@media (max-width:560px){.place-res{flex-direction:column;align-items:flex-start}}
.qz{gap:12px}
.qz-q{font-size:17.5px;font-weight:600;line-height:1.5}
.fb{border-radius:12px;padding:10px 12px;font-size:15px}
.fb.ok{background:var(--ok-soft);color:var(--ok-ink)}
.fb.bad{background:var(--bad-soft);color:var(--bad-ink)}
.quiz-end{align-items:center;text-align:center}
.mk-q{border-bottom:1px dashed var(--line);padding:8px 0;display:flex;flex-direction:column;gap:2px}
.mk-q:last-child{border-bottom:0}
.dly{display:flex;flex-direction:column;gap:8px}
.dly-t{font-size:19px;margin:0}
.dly.big .dly-t{font-size:22px}
.dly-en{display:flex;align-items:center;gap:8px;font-weight:600}
.dly-q{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.spk.sm{width:30px;height:30px}
.tabs{gap:6px}
.ai-out{white-space:pre-wrap;background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6}
.timer-chip{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:800;background:var(--sunk);border-radius:999px;padding:4px 12px}
.timer-chip.low{background:var(--bad-soft);color:var(--bad)}
.bm-ok{font-size:13px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:2px 10px}
.band-mini .mini-l{font-size:13.5px}

/* ===== Placement test (pc-) ===== */
.pc-top{display:flex;flex-direction:column;gap:8px}
.pc-top h2{margin:0}
.pc-bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.pc-bar.sm{height:5px}
.pc-bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .35s}
.pc-secs{display:flex;flex-wrap:wrap;gap:6px}
.pc-sec{font-size:12.5px;font-weight:650;color:var(--muted);background:var(--sunk);border-radius:999px;padding:2px 10px}
.pc-sec.cur{background:var(--accent-soft);color:var(--accent)}
.pc-sec.done{background:var(--ok-soft);color:var(--ok)}
.pc-q{gap:12px}
.pc-w{font-size:26px;font-weight:750;line-height:1.2;overflow-wrap:anywhere}
.pc-ex,.pc-gs{margin:0;line-height:1.7;overflow-wrap:anywhere}
.pc-hl{background:var(--orange-soft);color:var(--ink);border-radius:4px;padding:0 3px;font-weight:700}
.pc-gap{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--accent);margin:0 4px}
.pc-opts{grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.pc-opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pc-opts .opt{display:flex;gap:10px;align-items:flex-start;line-height:1.4;overflow-wrap:anywhere}
.pc-opts .opt .kbd{flex:none}
.pc-dk{align-self:flex-start}
.pc-rd{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:1000px){.pc-rd{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}.pc-rd .pc-qs{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow:auto}}
.pc-pass h3{margin:0 0 4px}
.pc-play{align-items:center}
.pc-sc{margin-right:auto}
.pc-rows{display:flex;flex-direction:column;gap:8px}
.pc-row{display:grid;grid-template-columns:90px 44px minmax(0,1fr);gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.pc-row:last-child{border-bottom:0}
.pc-rn{font-weight:650}
.pc-rb{font-size:18px;color:var(--accent)}
@media (max-width:420px){.pc-row{grid-template-columns:80px 40px minmax(0,1fr);gap:8px}}

/* ===== Listening, Reading, Thi thử (ts- shared engine, ls-, rd-) ===== */
.ts-test{display:flex;flex-direction:column;gap:10px}
.ts-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ts-card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1.5px solid transparent;box-shadow:var(--sh-1);border-radius:var(--r);padding:14px;min-width:0;cursor:pointer;transition:border-color .15s var(--ease),transform .15s var(--ease)}
.ts-card:hover{border-color:var(--accent)}
.ts-card:active{transform:translateY(1px)}
.ts-card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ts-card .t{font-weight:700;font-size:15.5px;line-height:1.35}
.ts-card .s{font-size:13.5px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ts-best{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.btn .ts-best{margin-left:4px}
.ts-mode .chip{display:inline-flex;align-items:center;gap:6px}
.ts-mode .chip .i{width:16px;height:16px}

/* sticky exam bar */
.ts-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:8;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh-1)}
@media (min-width:900px){.ts-bar{top:calc(env(safe-area-inset-top,0px) + 70px)}}
.ts-bar-r1{display:flex;align-items:center;gap:8px;min-width:0}
.ts-bar-t{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}
.ts-bar-t b{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ts-bar-t #tsCnt{white-space:nowrap}
@media (max-width:520px){.ts-bar-t b{font-size:13.5px}.ts-bar .timer-chip{padding:4px 8px}.ts-bar .timer-chip .i{display:none}.ts-bar #tsSub{padding:0 10px}}
.ts-back{padding:0 8px}
@media (max-width:520px){.ts-hide-s{display:none}}
.ts-bar .timer-chip .i{width:16px;height:16px}

/* questions */
.ts-qs{gap:14px}
.ts-grp{display:flex;flex-direction:column;gap:10px}
.ts-grp+.ts-grp{border-top:1px solid var(--line);padding-top:14px}
.ts-instr{white-space:pre-line;font-size:14px;line-height:1.5;color:var(--ink);background:var(--sunk);border-radius:10px;padding:10px 12px;font-weight:550}
.ts-box{border:1.5px solid var(--line2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.ts-box-t{font-weight:700;font-size:14px;margin-bottom:2px}
.ts-bo{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px;font-family:var(--f-en);font-size:15.5px;line-height:1.4}
.ts-bo b{font-family:var(--f-body);font-size:13.5px;color:var(--accent)}
.ts-items{display:flex;flex-direction:column;gap:4px}
.ts-it{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:start;padding:8px 6px;border-radius:10px;transition:background-color .3s}
.ts-it.ok{background:color-mix(in srgb,var(--ok) 7%,transparent)}
.ts-it.bad{background:color-mix(in srgb,var(--bad) 7%,transparent)}
.ts-n{display:inline-grid;place-items:center;min-width:28px;height:26px;padding:0 4px;border:1.5px solid var(--line2);border-radius:7px;font-weight:700;font-size:13px;color:var(--muted);margin-top:2px}
.ts-it.ok .ts-n{border-color:var(--ok);color:var(--ok)}
.ts-it.bad .ts-n{border-color:var(--bad);color:var(--bad)}
.ts-body{display:flex;flex-direction:column;gap:8px;min-width:0}
.ts-qt{font-family:var(--f-en);font-size:16.5px;line-height:1.9;overflow-wrap:anywhere}
.ts-sep{color:var(--line2);margin:0 4px}
.ts-hint{font-family:var(--f-body);font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;white-space:nowrap}
.ts-gap{font-family:var(--f-body)!important;font-size:15px;width:9.5em;max-width:100%;padding:3px 8px!important;margin:0 4px;border:1.5px solid var(--line2)!important;border-radius:7px!important;background:var(--surface);line-height:1.4;vertical-align:baseline}
.ts-gap::placeholder{color:var(--muted);opacity:.7;text-align:center;font-weight:700}
.ts-gap:focus{border-color:var(--accent)!important;outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.ts-gap.ok{border-color:var(--ok)!important;color:var(--ok)}
.ts-gap.bad{border-color:var(--bad)!important;color:var(--bad);text-decoration:line-through}
.ts-gap:disabled{opacity:1}
.ts-ch{display:flex;flex-direction:column;gap:6px}
.ts-tf{display:flex;flex-wrap:wrap;gap:6px}
.ts-c{display:flex;align-items:flex-start;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:42px;font-family:var(--f-en);font-size:15.5px;line-height:1.4;cursor:pointer}
.ts-c b{font-family:var(--f-body);font-size:13px;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--sunk);flex:none}
.ts-c.ts-m b{border-radius:5px}
.ts-c.sm{font-family:var(--f-body);font-size:13px;font-weight:700;letter-spacing:.03em;padding:6px 12px;min-height:38px;align-items:center}
.ts-c:hover:not(:disabled){border-color:var(--accent)}
.ts-c[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ts-c[aria-pressed="true"] b{background:var(--accent);color:var(--accent-ink)}
.ts-c:disabled{cursor:default}
.ts-c.right{border-color:var(--ok);background:var(--ok-soft)}
.ts-c.right b{background:var(--ok);color:var(--surface)}
.ts-c.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ts-c.wrong b{background:var(--bad);color:var(--surface)}
.ts-sel{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ts-sel .ts-qt{flex:1 1 220px;line-height:1.5}
.ts-sel select{min-width:88px;font-weight:700;border-width:1.5px}
.ts-sel select.ok{border-color:var(--ok);color:var(--ok)}
.ts-sel select.bad{border-color:var(--bad);color:var(--bad)}
.ts-sel select:disabled{opacity:1}
.ts-fb{font-size:14px;line-height:1.55;display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--line2);padding:2px 0 2px 10px}
.ts-it.ok .ts-fb{border-color:var(--ok)}
.ts-it.bad .ts-fb{border-color:var(--bad)}
.ts-okt{color:var(--ok)}
.ts-badt{color:var(--bad)}
.ts-why{color:var(--muted)}
.ts-para{align-self:flex-start}
.ts-flash{animation:tsFlash 1.4s var(--ease)}
@keyframes tsFlash{0%,40%{box-shadow:0 0 0 3px var(--orange)}100%{box-shadow:0 0 0 3px transparent}}

/* result panel */
.ts-res{gap:12px}
.ts-res-top{display:flex;align-items:center;gap:16px}
.ts-res-n{display:flex;flex-direction:column;gap:2px}
.ts-score{font-size:46px;font-weight:800;line-height:1;color:var(--accent)}
.ts-score span{font-size:22px;color:var(--muted);font-weight:700}
.ts-bandl{font-size:15px}
.ts-bandl b{font-size:20px;color:var(--orange)}
.ts-dots{display:flex;flex-wrap:wrap;gap:5px}
.ts-dot{width:32px;height:32px;border-radius:8px;border:0;font-size:12.5px;font-weight:800;background:var(--bad-soft);color:var(--bad-ink);font-variant-numeric:tabular-nums;cursor:pointer}
.ts-dot.ok{background:var(--ok-soft);color:var(--ok-ink)}

/* listening player */
.ls-player{display:flex;align-items:center;gap:8px;min-width:0}
.ls-pp{width:44px;height:44px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:0 2px 0 var(--accent-lo)}
.ls-pp:disabled{background:var(--sunk);color:var(--muted);box-shadow:none}
.ls-pp .i{width:20px;height:20px}
.ls-player .spk .i{width:17px;height:17px}
.ls-prog{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ls-bar{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.ls-bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .4s var(--ease)}
.ls-meta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.ls-player .spk{width:34px;height:34px}.ls-who{display:none}}
.ls-intro{font-size:14px;color:var(--muted);line-height:1.5}
.ls-trb{display:flex;flex-direction:column;gap:2px;padding:4px 0}
details .ls-trb{padding:4px 14px 12px}
.ls-trh{margin:10px 0 4px}
.ls-tl{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;padding:6px 0;border-bottom:1px dashed var(--line)}
.ls-tl:last-child{border-bottom:0}
.ls-tlt{display:flex;flex-direction:column;gap:1px}
.ls-sp{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.03em}
.ls-tl .en-s{font-size:16px;line-height:1.55}

/* dictation */
.ls-dict textarea{font-size:17px;line-height:1.5;border:1.5px solid var(--line2);border-radius:12px;padding:10px 12px;background:var(--surface)}
.ls-diff{line-height:2;background:var(--sunk);border-radius:12px;padding:10px 12px}
.ls-dw{border-radius:5px;padding:1px 3px}
.ls-dw.ok{color:var(--ok);background:var(--ok-soft)}
.ls-dw.miss{color:var(--bad);background:var(--bad-soft);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;font-weight:600}
.ls-dw.extra{color:var(--bad);text-decoration:line-through;opacity:.8}

/* reading */
.rd-ps{gap:6px}
.rd-mob{display:flex;gap:6px}
.rd-mob .chip{flex:1;display:inline-flex;justify-content:center;align-items:center;gap:6px}
.rd-mob .chip .i{width:16px;height:16px}
.rd-split{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.rd-split[data-mob="p"] .rd-qs{display:none}
.rd-split[data-mob="q"] .rd-pass{display:none}
.rd-col{background:var(--surface);box-shadow:var(--sh-1);border-radius:var(--r);padding:16px;min-width:0}
.rd-qs{display:flex;flex-direction:column;gap:14px}
.rd-ph{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.rd-title{font-size:21px;line-height:1.3;margin:2px 0}
.rd-p{margin:0 0 14px;border-radius:8px;padding:2px 4px;transition:background-color .4s}
.rd-l{font-family:var(--f-body);font-weight:800;color:var(--accent);margin-right:10px;font-size:15px}
.rd-hl{animation:rdHl 2.4s var(--ease)}
@keyframes rdHl{0%,50%{background:var(--orange-soft)}100%{background:transparent}}
.rd-subq{align-self:flex-start}
@media (min-width:900px){
  .rd-mob{display:none}
  .rd-split,.rd-split[data-mob]{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
  .rd-split[data-mob] .rd-qs{display:flex}
  .rd-split[data-mob] .rd-pass{display:block}
  .rd-col{height:calc(100dvh - 160px);min-height:420px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
}
.rd-voc{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.rd-vw{display:flex;gap:10px;align-items:center;background:var(--sunk);border-radius:12px;padding:8px 10px;min-width:0}
.rd-vw>div{min-width:0}
.rd-bub{position:fixed;z-index:60;transform:translateX(-50%);display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:7px 14px;font-size:14px;box-shadow:var(--sh-2);white-space:nowrap}
.rd-bub .i{width:15px;height:15px}

/* thi thử */
.ts-mock-h{display:flex;gap:12px;align-items:flex-start}
.ts-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:760px){.ts-steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ts-step{display:flex;gap:8px;align-items:flex-start;background:var(--sunk);border-radius:12px;padding:10px;min-width:0;line-height:1.35}
.ts-step .i{color:var(--accent);margin-top:1px}
.ts-step-n{font-size:12px;font-weight:800;color:var(--muted);margin-top:2px}
.ts-one{display:flex;flex-direction:column}
.ts-one-r{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--line)}
.ts-one-r:last-child{border-bottom:0}
.ts-one-t{display:inline-flex;align-items:center;gap:8px;font-weight:700;min-width:170px}
.ts-one-t .i{color:var(--accent)}
.ts-hist{display:flex;flex-direction:column}
.ts-hr{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.ts-hr:last-child{border-bottom:0}
.ts-hr.ov{background:var(--accent-soft);border-radius:10px;border-bottom-color:transparent;padding:8px}
.ts-hr-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ts-hr-b{font-size:18px}
.ts-conv{padding:4px 14px 14px;display:flex;flex-direction:column;gap:8px}
.ts-tw{overflow-x:auto}
.ts-tb{border-collapse:collapse;width:100%;font-size:14px;min-width:320px}
.ts-tb th,.ts-tb td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center}
.ts-tb th{background:var(--sunk);font-weight:700;font-size:13px}
.ts-tb td:first-child{font-weight:700}
.ts-prog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ts-pg{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.ts-pg i{height:6px;border-radius:999px;background:var(--sunk)}
.ts-pg.done i{background:var(--ok)}
.ts-pg.cur i{background:var(--accent)}
.ts-pg.cur{color:var(--ink);font-weight:700}
.ts-pg b{font-size:13px;color:var(--ink)}
.ts-brk{align-items:center;text-align:center;padding:28px 18px}
.ts-brk-t{font-size:24px;display:inline-flex;align-items:center;gap:8px}
.ts-brk-t .i{width:24px;height:24px;color:var(--accent)}
.ts-brk .small{max-width:52ch}
.ts-fin{flex-direction:row;align-items:center;justify-content:center;gap:24px;padding:24px}
.ts-fin-o{display:flex;flex-direction:column;align-items:flex-start}
.ts-fin-b{font-size:64px;font-weight:800;line-height:1;color:var(--accent)}
.ts-fbands{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){.ts-fbands{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* expert pack */
.pill.ts-xp{background:var(--orange-soft);color:var(--orange-ink)}
.ts-xh{display:flex;flex-direction:column;gap:2px;margin-top:10px;padding-top:14px;border-top:1.5px solid var(--line)}
.ts-xh h3{margin:0}
.ts-top{color:var(--ok);font-weight:600;max-width:34ch;line-height:1.4}
.btn.ts-xb{border-color:var(--orange-soft);background:var(--orange-soft);color:var(--orange-ink)}
.chip.ts-xc[aria-pressed="true"]{background:var(--orange-soft);color:var(--orange-ink);border-color:var(--orange)}
.ts-pick-l{display:flex;flex-direction:column;gap:6px}

/* passage / dialogue shown above a question in the mistakes review */
.qz-ctx{margin:0 0 14px}
.qz-ctxb{max-height:46vh;overflow:auto;padding:6px 4px 2px;overscroll-behavior:contain}
.qz-ctxb .rd-p{margin-bottom:10px}
.qz-hl{background:var(--orange-soft);box-shadow:inset 3px 0 0 var(--orange)}

/* ===== Writing (30-write.js) ===== */
.wr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.wr-card{text-align:left;align-items:flex-start;gap:8px;cursor:pointer;border:1.5px solid transparent;font:inherit;color:inherit}
.wr-card:hover{border-color:var(--line2)}
.wr-ct{font-weight:650;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.wr-ct.en{font-family:var(--f-en);font-weight:500;font-size:15.5px}
.wr-stt{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);margin-top:auto}
.wr-stt .i{width:15px;height:15px}
.wr-stt.ok{color:var(--ok)}
.wr-stt.dr{color:var(--t2)}
.wr-hl{display:flex;flex-direction:column}
.wr-hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:44px}
.wr-hrow:last-child{border-bottom:0}
.wr-hrow:hover{background:var(--sunk)}
.wr-hrt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.wr-hrow b{font-size:17px;color:var(--accent)}

/* room layout */
.wr-task{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"p w" "h w";gap:16px;align-items:start}
.wr-pa{grid-area:p}
.wr-wa{grid-area:w;position:sticky;top:12px}
.wr-ha{grid-area:h;display:flex;flex-direction:column;gap:10px;min-width:0}
.wr-exam .wr-task{grid-template-areas:"p w"}
@media (max-width:900px){
  .wr-task,.wr-exam .wr-task{grid-template-columns:minmax(0,1fr);grid-template-areas:"p" "w" "h"}
  .wr-wa{position:static}
}
.wr-ptext p{margin:0 0 8px}
.wr-ptext ul{margin:0 0 8px;padding-left:22px}
.wr-ptext{font-size:16.5px}
.wr-bar{gap:8px}
.wr-wc{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.wr-wc b{font-size:18px;color:var(--ink)}
.wr-wc.ok,.wr-wc.ok b{color:var(--ok)}
.wr-tx{width:100%;min-height:360px;resize:vertical;border:1.5px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);color:var(--ink);font-size:17px;line-height:1.65;box-sizing:border-box}
.wr-tx:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
@media (max-width:900px){.wr-tx{min-height:300px}}
.wr-det{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);padding:0}
.wr-det>summary{display:flex;align-items:center;gap:8px;padding:14px 16px;font-weight:650;cursor:pointer;min-height:44px;list-style:none}
.wr-det>summary::-webkit-details-marker{display:none}
.wr-det>summary .i{width:18px;height:18px;color:var(--accent)}
.wr-dbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;font-size:14.5px;line-height:1.6}
.wr-dbody p{margin:0}
.wr-ideas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:560px){.wr-ideas{grid-template-columns:minmax(0,1fr)}}
.wr-ideas ul,.wr-ul{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.wr-ovs{background:var(--sunk);border-radius:10px;padding:10px 12px}
.wr-ovs .en-s{font-size:15.5px}
.wr-phr{display:flex;flex-direction:column;gap:8px}
.wr-ph{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.wr-ph b{display:block;font-size:15px}
.wr-model p,.wr-better p{margin:0 0 12px}
.wr-model p:last-child,.wr-better p:last-child{margin:0}

/* chart */
.wr-chart{margin:8px 0 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0}
.wr-chart figcaption{display:flex;flex-direction:column;gap:2px;text-align:center;font-size:14px;line-height:1.35}
.wr-chart figcaption b{font-weight:700}
.wr-unit{font-size:12.5px;color:var(--muted)}
.wr-svg{width:100%;height:auto;display:block;overflow:visible}
.wr-svg text{fill:var(--muted);font-size:12px;font-family:var(--f-body)}
.wr-svg .wr-gr{stroke:var(--line);stroke-width:1}
.wr-svg .wr-ax{stroke:var(--line2);stroke-width:1.3}
.wr-svg .wr-mk{stroke:var(--surface);stroke-width:1.2}
.wr-svg .wr-slice{stroke:var(--surface);stroke-width:1.5}
.wr-svg .wr-pl{fill:#fff;font-weight:700;font-size:12px;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2.2px}
.wr-svg .wr-po{fill:var(--ink);font-weight:700}
.wr-svg .wr-pn{fill:var(--ink);font-weight:700;font-size:14px}
.wr-leg{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13px;color:var(--ink)}
.wr-leg span{display:inline-flex;align-items:center;gap:6px}
.wr-leg i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.wr-leg svg{width:26px;height:12px;flex:none}
.wr-tbw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.wr-tb{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.wr-tb th,.wr-tb td{border:1px solid var(--line2);padding:7px 8px;text-align:right;white-space:nowrap}
.wr-tb thead th{white-space:normal;min-width:52px;line-height:1.25}
.wr-tb thead th{background:var(--sunk);text-align:center;font-weight:700}
.wr-tb tbody th{text-align:left;font-weight:650;background:var(--sunk)}
.wr-proc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;align-items:stretch;max-width:420px;width:100%;align-self:center}
.wr-step{display:flex;flex-direction:column;align-items:stretch;min-width:0}
.wr-sbox{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line2);border-radius:10px;padding:8px 12px;background:var(--sunk);font-size:13.5px;line-height:1.4}
.wr-sbox b{display:block;font-size:14px;color:var(--ink)}
.wr-sbox span:not(.wr-sn){color:var(--muted)}
.wr-sn{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:800}
.wr-arr{width:22px;height:13px;flex:none;color:var(--accent);transform:rotate(90deg);align-self:center;margin:5px 0}
.wr-map{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:640px){.wr-map{grid-template-columns:minmax(0,1fr)}}
.wr-mp{min-width:0;border:1.5px solid var(--line2);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.wr-mph{display:flex;justify-content:space-between;align-items:baseline;padding:8px 10px;background:var(--sunk);border-bottom:1px solid var(--line2)}
.wr-mph b{font-size:18px}
.wr-mp.a .wr-mph b{color:var(--t3)}
.wr-mp.b .wr-mph b{color:var(--t4)}
.wr-mpi{display:flex;flex-direction:column;gap:6px;padding:8px}
.wr-mb{min-width:0;overflow-wrap:anywhere;display:flex;gap:6px;align-items:flex-start;border:1px dashed var(--line2);border-radius:8px;padding:6px 8px;font-size:12.5px;line-height:1.35;color:var(--ink);background:var(--surface)}
.wr-mbn{flex:none;font-weight:800;font-size:11px;width:18px;height:18px;border-radius:4px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}

/* grading */
.wr-load{flex-direction:row;align-items:center;gap:14px}
.wr-bar-ld{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden;margin-top:10px;max-width:280px}
.wr-bar-ld i{display:block;height:100%;width:35%;border-radius:999px;background:var(--accent);animation:wrLd 1.6s ease-in-out infinite}
@keyframes wrLd{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.wr-out{display:flex;flex-direction:column;gap:16px}
.wr-out:empty{display:none}
.wr-ovr{display:flex;gap:18px;align-items:center}
@media (max-width:560px){.wr-ovr{flex-direction:column;align-items:flex-start}}
.wr-ovb{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none;min-width:110px}
.wr-sum{display:flex;gap:10px;align-items:flex-start}
.wr-sum p{margin:0;line-height:1.6}
.wr-crits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.wr-crits{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wr-cr{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.wr-cr b{font-size:26px;font-weight:800;line-height:1.1;color:var(--accent)}
.wr-crv{font-weight:650;font-size:14px}
.wr-essay{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75}
.wr-c{display:inline}
.wr-err{display:inline;font:inherit;line-height:inherit;color:var(--bad);background:var(--bad-soft);border:0;border-radius:4px;padding:0 2px;text-decoration:line-through;text-decoration-thickness:1.5px;cursor:pointer}
.wr-err sup{font-family:var(--f-body);font-size:10px;font-weight:800;margin-left:2px;text-decoration:none;display:inline-block}
.wr-err.on{outline:2px solid var(--bad)}
.wr-fix{display:block;margin:4px 0 8px;padding:8px 12px;border-left:3px solid var(--ok);background:var(--ok-soft);border-radius:0 10px 10px 0;white-space:normal;font-family:var(--f-body);font-size:14.5px;line-height:1.5}
.wr-fix b{display:block;color:var(--ok-ink);font-size:15.5px}
.wr-fix span{color:var(--ink)}
.wr-fix[hidden]{display:none}
.wr-miss{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.wr-mi{display:flex;flex-direction:column;gap:2px}
.wr-mi s{color:var(--bad)}
.wr-mi b{color:var(--ok)}
.wr-cmp .wr-essay{font-size:16px}
.wr-steps .chip{display:inline-flex;align-items:center;gap:6px}
.wr-xres{gap:14px}

/* band 8 / band 9 model switch (also used by Speaking) */
.wr-sw{display:flex;flex-direction:column;gap:10px;min-width:0}
.wr-swt{gap:6px}
.wr-swp{display:flex;flex-direction:column;gap:10px;min-width:0}
.wr-swp[hidden]{display:none}
.wr-hl9{background:var(--orange-soft);color:inherit;border-radius:4px;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.wr-hl9 sup{font-family:var(--f-body);font-size:10px;font-weight:800;color:var(--orange-ink);margin-left:2px}
.wr-b9s{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.wr-b9s h4{margin:0;font-size:15px}
.wr-why9{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.wr-why9 li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start}
.wr-why9 li>div{display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.wr-why9 b{font-size:15px}
.wr-why9 span:not(.wr-wn){font-size:14px;line-height:1.55;color:var(--ink)}
.wr-wn{width:22px;height:22px;border-radius:6px;background:var(--orange-soft);color:var(--orange-ink);display:grid;place-items:center;font-size:12px;font-weight:800}
.wr-vs{margin:0;line-height:1.6}

/* ===== Speaking (sp-) ===== */
.sp{min-width:0}
.sp .en{font-family:var(--f-en)}
.sp-intro .mc-say{align-items:flex-start}
.sp-parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sp-parts>div{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px;min-width:0}
.sp-parts b{color:var(--accent)}
@media (max-width:700px){.sp-parts{grid-template-columns:minmax(0,1fr)}}
.sp-det summary{cursor:pointer;font-weight:650;font-size:14.5px;padding:4px 0}
.sp-crit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.sp-crit>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:14px;min-width:0}
.sp-crit small{color:var(--muted);font-size:12px}
@media (max-width:560px){.sp-crit{grid-template-columns:minmax(0,1fr)}}

.sp-topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sp-topic{border:1.5px solid var(--line2);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:64px;min-width:0}
.sp-topic:hover,.sp-cl:hover{border-color:var(--accent)}
.sp-topic b{font-size:15px}
.sp-topic .note{font-size:12.5px}
@media (max-width:420px){.sp-topics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sp-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
@media (max-width:420px){.sp-cards{grid-template-columns:minmax(0,1fr)}}
.sp-cl{position:relative;border:1.5px solid var(--line2);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.sp-clt{font-size:15.5px;line-height:1.35}
.sp-cl .note{font-size:13px}
.sp-tick{position:absolute;top:10px;right:10px;color:var(--ok)}
.sp-tick .i{width:16px;height:16px}

.sp-steps{display:flex;gap:5px}
.sp-steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.sp-steps i.d{background:var(--accent)}
.sp-steps i.c{background:var(--orange)}

/* recorder */
.sp-rec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sp-q{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start}
.sp-q .en-s{font-size:19px;line-height:1.4;font-weight:500}
.sp-body{display:flex;flex-direction:column;gap:10px;min-width:0}

@media (max-width:420px){.pr-tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}}
.pr-tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:76px;padding:8px 4px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;color:var(--ink);min-width:0}
.pr-tile:hover{border-color:var(--accent)}
.pr-sym{font-family:var(--f-py);font-size:23px;font-weight:500;line-height:1.15;color:var(--accent)}
.pr-tw{font-size:12.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-tile.seen::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.pr-mh{display:flex;gap:14px;align-items:center;padding-right:40px}
.pr-mh h2::first-letter{text-transform:uppercase}
.pr-big{font-family:var(--f-py);font-size:40px;font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:16px;min-width:76px;height:76px;padding:0 10px;display:grid;place-items:center;flex:none}
.pr-words{display:flex;flex-wrap:wrap;gap:8px}
.pr-word,.pr-exb{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 14px 6px 10px;font-size:16px;font-weight:600;color:var(--ink);min-width:0}
.pr-word svg,.pr-exb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--accent)}
.pr-word:hover,.pr-exb:hover{border-color:var(--accent)}
.pr-p{margin:4px 0 0;line-height:1.6}
.pr-pairs{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.pr-pair{display:flex;align-items:center;gap:10px;font-size:16px}
.pr-sets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:760px){.pr-sets{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pr-set{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);min-width:0}
.pr-set:hover{border-color:var(--accent)}
.pr-set b{font-family:var(--f-py);font-size:16px;color:var(--accent)}
.pr-set .small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pr-game{gap:14px}
.pr-con{font-family:var(--f-py);color:var(--accent);font-size:16px}
.pr-play{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0}
.pr-play .gm-play svg{width:42px;height:42px}
.pr-choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pr-ch{font-size:22px;font-weight:700;text-align:center;min-height:72px}
.pr-fb{display:flex;flex-direction:column;gap:10px}
.pr-fb .btn{align-self:flex-start}
.pr-ctl{justify-content:center}
.pr-end{align-items:center;text-align:center}
.pr-end .mc-say{text-align:left}
.pr-rules{display:flex;flex-direction:column;gap:8px}
.pr-rn{flex:none;width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:700}
.pr-chev{flex:none;width:16px;height:16px;color:var(--muted);transition:transform .15s}
details[open]>summary .pr-chev{transform:rotate(90deg)}
.pr-body{white-space:pre-line;line-height:1.65}
.pr-exs{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.pr-exb{font-weight:500}
.pr-exb .ipa{font-size:13.5px}
.pr-q{font-weight:600;font-family:var(--f-py)}
.pr-q,.opt{overflow-wrap:anywhere}
.pr .opt{font-family:var(--f-py)}
.pr-sp{gap:12px}
.pr-sp select{width:100%;font-family:var(--f-py)}
.pr-wchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.pr-wchips .chip{flex:none}
.pr-target{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 0}
.pr-tw2{font-size:clamp(34px,10vw,52px);font-weight:700;overflow-wrap:anywhere;text-align:center}
.pr-micw{display:flex;flex-direction:column;align-items:center;gap:8px}
.pr-micw .note{text-align:center;min-height:20px}
.pr-res{min-height:10px}
.pr-heard{display:flex;gap:12px;align-items:center;border-radius:12px;padding:10px 14px}
.pr-heard.ok{background:var(--ok-soft);color:var(--ok-ink)}
.pr-heard.retry{background:var(--orange-soft);color:var(--orange-ink)}
.pr-hi{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--surface)}
.pr-heard.ok .pr-hi{background:var(--ok)}
.pr-heard.retry .pr-hi{background:var(--orange)}
.pr-spnav{justify-content:space-between}

/* games extras */
.gm-hide{display:inline}
@media (max-width:420px){.gm-hide{display:none}}
.gm-hint{min-height:24px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:baseline;text-align:center}
.gm-type input{font-family:var(--f-body)}
.gm-cz{display:flex;flex-direction:column;gap:10px;padding:6px 2px}
.gm-czvi{font-size:17px;font-weight:600}
.gm-czvi .label{margin-right:6px}
.gm-czs{font-size:19px;line-height:1.6}
.gm-gap{display:inline-block;min-width:4ch;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:700;padding:0 4px}
.gm-gap.ok{color:var(--ok);border-color:var(--ok)}
.gm-gap.bad{color:var(--bad);border-color:var(--bad)}
.gm-opt .en{font-weight:650;font-size:16px}
.gm-mt2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gm-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.gm-mc2{min-height:58px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;text-align:center;overflow-wrap:anywhere;line-height:1.3;font-size:14px;color:var(--ink);min-width:0}
.gm-mc2.en{font-size:17px;font-weight:650}
.gm-mc2:hover:not(:disabled){border-color:var(--accent)}
.gm-mc2.sel{border-color:var(--accent);background:var(--accent-soft)}
.gm-mc2.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink);opacity:.75}
.gm-mc2.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s linear}
@media (prefers-reduced-motion:reduce){.gm-mc2.bad{animation:none}}
/* level 4: expert band 8.5-9 (orange tokens) */
.gr-lv4,.gr-row .gr-p4,.gr-pills .gr-lv4{background:var(--orange-soft);color:var(--orange-ink)}
.gr-l4 .gr-sh h3{color:var(--orange-ink)}
.gr-l4 .gr-row:hover{border-color:var(--orange)}
#grLv [data-t="4"][aria-pressed="true"]{background:var(--orange-soft);color:var(--orange-ink);border-color:var(--orange)}

</style>
